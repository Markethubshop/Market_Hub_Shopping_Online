<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MarketHub — Fresh Local Market &amp; Gadgets</title>

  <!-- PWA & Mobile App Manifest + Theme -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#16a34a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MarketHub" />
  <link rel="apple-touch-icon" href="icon-192.png" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --primary: #16a34a;
      --primary-dark: #15803d;
      --primary-deep: #14532d;
      --primary-light: #22c55e;
      --primary-soft: #f0fdf4;
      --primary-tint: #dcfce7;
      --accent-amber: #f59e0b;
      --bg: #f1f7f3;
      --card: #ffffff;
      --text: #14261c;
      --text-secondary: #3f5749;
      --muted: #647c6e;
      --border: #d9e7de;
      --danger: #dc2626;
      --green: #059669;
      --indigo: #0f766e;
      --shadow-xs: 0 1px 2px rgba(20, 83, 45, 0.05);
      --shadow-sm: 0 2px 6px rgba(20, 83, 45, 0.08);
      --shadow-md: 0 8px 20px rgba(20, 83, 45, 0.14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      background-image: url("data:image/svg+xml,%3Csvg width='160' height='160' viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%2316a34a' stroke-width='1.2' stroke-opacity='0.065' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='18' y='16' width='22' height='34' rx='4'/%3E%3Cline x1='26' y1='20' x2='32' y2='20'/%3E%3Ccircle cx='29' cy='45' r='1.3'/%3E%3Cpath d='M92 38c0-11 9-18 20-18 0 11-9 18-20 18z'/%3E%3Cpath d='M92 38l-5 5'/%3E%3Cpath d='M22 106a14 14 0 0 1 28 0v8'/%3E%3Crect x='19' y='106' width='6' height='11' rx='2'/%3E%3Crect x='47' y='106' width='6' height='11' rx='2'/%3E%3Cpath d='M96 98h24l-3 19H99z'/%3E%3Cpath d='M102 98v-4a6 6 0 0 1 12 0v4'/%3E%3Ccircle cx='138' cy='76' r='8'/%3E%3Cpath d='M138 64v4M138 84v4M126 76h4M146 76h4'/%3E%3C/g%3E%3C/svg%3E");
      background-size: 160px 160px;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }

    /* =========================================================
       FRESH GRASS GREEN TOP NAVIGATION HEADER
       ========================================================= */
    .site-header {
      background: linear-gradient(180deg, #15803d 0%, #16a34a 60%, #22c55e 100%);
      color: #ffffff;
      position: sticky;
      top: 0;
      z-index: 60;
      box-shadow: 0 3px 12px rgba(20, 83, 45, 0.2);
    }

    .header-inner {
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 1rem;
    }

    .header-top-links {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.42rem 0;
      font-size: 0.77rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.18);
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .top-link-group {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      flex-wrap: wrap;
    }

    .top-link-btn {
      background: transparent;
      color: #ffffff;
      border: none;
      padding: 0.18rem 0.35rem;
      font-size: 0.77rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      border-radius: 4px;
      transition: background 0.15s;
    }

    .top-link-btn:hover { background: rgba(255, 255, 255, 0.16); }
    .top-sep { color: rgba(255, 255, 255, 0.38); font-size: 0.72rem; }

    .header-main-row {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      padding: 0.75rem 0 0.85rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.52rem;
      font-weight: 800;
      font-size: 1.42rem;
      letter-spacing: -0.02em;
      cursor: pointer;
      color: #ffffff;
      white-space: nowrap;
      user-select: none;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      background: #ffffff;
      color: var(--primary-dark);
      border-radius: 9px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.14);
    }

    .header-search-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.32rem;
      min-width: 0;
    }

    .header-search-box {
      display: flex;
      align-items: center;
      background: #ffffff;
      border-radius: 6px;
      padding: 3px;
      box-shadow: 0 2px 8px rgba(15, 60, 30, 0.16);
    }

    .header-search-box input {
      border: none;
      outline: none;
      flex: 1;
      padding: 0.5rem 0.75rem;
      font-size: 0.88rem;
      color: var(--text);
      background: transparent;
      min-width: 0;
    }

    .header-search-btn {
      background: var(--primary-dark);
      color: #ffffff;
      border: none;
      border-radius: 4px;
      padding: 0.48rem 1.15rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      transition: background 0.15s;
    }

    .header-search-btn:hover { background: var(--primary-deep); }

    .header-quick-tags {
      display: flex;
      gap: 0.75rem;
      font-size: 0.72rem;
      color: rgba(255, 255, 255, 0.94);
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
    }
    .header-quick-tags::-webkit-scrollbar { display: none; }
    .header-quick-tags span { cursor: pointer; opacity: 0.92; transition: opacity 0.15s; }
    .header-quick-tags span:hover { opacity: 1; text-decoration: underline; }

    .header-right-icons {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      flex-shrink: 0;
    }

    .header-cart-btn {
      position: relative;
      background: transparent;
      border: none;
      color: #ffffff;
      padding: 0.4rem 0.5rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
    }
    .header-cart-btn:hover { background: rgba(255, 255, 255, 0.15); }

    .header-cart-badge {
      position: absolute;
      top: -1px;
      right: -3px;
      background: #ffffff;
      color: var(--primary-dark);
      border: 2px solid var(--primary);
      font-size: 0.68rem;
      font-weight: 800;
      min-width: 21px;
      height: 19px;
      padding: 0 5px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .user-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.38rem;
      background: rgba(255, 255, 255, 0.16);
      padding: 0.2rem 0.55rem 0.2rem 0.25rem;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.76rem;
      font-weight: 600;
      color: #ffffff;
    }
    .user-pill:hover { background: rgba(255, 255, 255, 0.25); }

    .user-avatar-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #ffffff;
      color: var(--primary-dark);
      font-weight: 800;
      font-size: 0.7rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* Buttons */
    button {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 0.52rem 0.95rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.15s ease;
    }
    button:hover { background: var(--primary-dark); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    button.secondary { background: #ffffff; color: var(--text); border: 1px solid var(--border); }
    button.secondary:hover { background: var(--primary-soft); border-color: #86efac; }
    button.danger { background: var(--danger); color: #fff; }
    button.danger:hover { background: #b91c1c; }
    button.danger-outline { background: #fff; color: var(--danger); border: 1px solid #fecaca; }
    button.danger-outline:hover { background: #fef2f2; }
    button.success-btn { background: var(--green); color: #fff; }
    button.success-btn:hover { background: #047857; }
    button.shop-cta { background: var(--primary); color: #fff; }
    button.shop-cta:hover { background: var(--primary-dark); }
    button.add-cart-outline {
      background: var(--primary-soft);
      color: var(--primary-dark);
      border: 1px solid var(--primary);
    }
    button.add-cart-outline:hover { background: var(--primary-tint); }
    button.sm { padding: 0.34rem 0.65rem; font-size: 0.78rem; }

    /* Badges */
    .badge {
      background: #f1f5f9;
      color: #334155;
      padding: 0.16rem 0.5rem;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }
    .badge.admin { background: #fef3c7; color: #92400e; }
    .badge.seller { background: var(--primary-tint); color: var(--primary-deep); }
    .badge.cat-badge { background: #f3f6f4; color: #3f5749; text-transform: none; font-weight: 600; }
    .badge.ship-free { background: #dcfce7; color: #166534; text-transform: none; }
    .badge.ship-paid { background: #e0f2fe; color: #075985; text-transform: none; }
    .badge.ship-out { background: #fef3c7; color: #92400e; text-transform: none; }
    .badge.area-badge { background: #fef9c3; color: #854d0e; text-transform: none; }
    .badge.ref-badge {
      background: #f0fdf4;
      color: #14532d;
      border: 1px solid #86efac;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.72rem;
      letter-spacing: 0.03em;
    }

    .badge.status-pending { background: #fef3c7; color: #b45309; }
    .badge.status-received { background: #e0e7ff; color: #3730a3; }
    .badge.status-confirmed { background: #dbeafe; color: #1d4ed8; }
    .badge.status-shipped { background: #f3e8ff; color: #7e22ce; }
    .badge.status-delivered, .badge.status-approved { background: #dcfce7; color: #15803d; }
    .badge.status-cancelled, .badge.status-rejected, .badge.status-suspended { background: #fee2e2; color: #b91c1c; }

    /* =========================================================
       REALTIME PHILIPPINES LOCATION AUTOCOMPLETE DROPDOWN
       ========================================================= */
    .ph-loc-wrap {
      position: relative;
      width: 100%;
    }
    .ph-loc-dropdown {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 4px);
      background: #ffffff;
      border: 1.5px solid #86efac;
      border-radius: 8px;
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.18);
      max-height: 230px;
      overflow-y: auto;
      z-index: 160;
    }
    .ph-loc-item {
      padding: 0.52rem 0.75rem;
      border-bottom: 1px solid #f1f5f9;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.81rem;
      transition: background 0.12s;
    }
    .ph-loc-item:last-child { border-bottom: none; }
    .ph-loc-item:hover { background: var(--primary-soft); }
    .ph-loc-main { font-weight: 700; color: var(--text); }
    .ph-loc-sub { font-size: 0.72rem; color: var(--muted); }
    .ph-loc-tag {
      font-size: 0.66rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--primary-tint);
      color: var(--primary-deep);
      white-space: nowrap;
    }
    .out-of-range-alert {
      background: #fffbeb;
      border: 1.5px solid #f59e0b;
      border-radius: 8px;
      padding: 0.65rem 0.8rem;
      margin-top: 0.45rem;
      font-size: 0.79rem;
      color: #92400e;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    /* Notifications */
    .notif-wrapper { position: relative; display: inline-block; }
    .notif-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 0.32rem;
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.28);
      padding: 0.2rem 0.55rem;
      font-size: 0.75rem;
      border-radius: 4px;
    }
    .notif-btn:hover { background: rgba(255, 255, 255, 0.25); }
    .notif-badge {
      background: #facc15;
      color: #14532d;
      font-size: 0.65rem;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 999px;
      line-height: 1.2;
    }
    .notif-dropdown {
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      width: 350px;
      max-width: 92vw;
      background: #ffffff;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 18px 36px rgba(15, 23, 42, 0.2);
      z-index: 120;
      overflow: hidden;
    }
    .notif-header {
      padding: 0.72rem 0.9rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--primary-soft);
    }
    .notif-header h4 { margin: 0; font-size: 0.86rem; color: var(--primary-deep); }
    .notif-list { max-height: 360px; overflow-y: auto; }
    .notif-item {
      padding: 0.72rem 0.9rem;
      border-bottom: 1px solid #f1f5f9;
      font-size: 0.81rem;
      cursor: pointer;
      transition: background 0.12s;
    }
    .notif-item:hover { background: #f8fafc; }
    .notif-item.unread { background: #f0fdf4; border-left: 3px solid var(--primary); }
    .notif-item-top { display: flex; justify-content: space-between; gap: 0.5rem; margin-bottom: 0.2rem; }
    .notif-title { font-weight: 700; color: var(--text); }
    .notif-time { font-size: 0.7rem; color: var(--muted); white-space: nowrap; }
    .notif-desc { color: var(--text-secondary); line-height: 1.35; }
    .notif-actions { display: flex; gap: 0.4rem; margin-top: 0.45rem; }

    /* Container */
    .container { max-width: 1240px; margin: 1rem auto; padding: 0 1rem 2.5rem; }
    .hidden { display: none !important; }

    /* =========================================================
       GRASS-GREEN MARKET & GADGET HERO BANNER
       ========================================================= */
    .hero-showcase {
      background: linear-gradient(125deg, #14532d 0%, #166534 42%, #16a34a 100%);
      border-radius: 12px;
      padding: 1.35rem 1.5rem;
      margin-bottom: 1rem;
      color: #ffffff;
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      gap: 1.25rem;
      align-items: center;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .hero-showcase::after {
      content: "";
      position: absolute;
      right: -40px;
      bottom: -40px;
      width: 240px;
      height: 240px;
      background: radial-gradient(circle, rgba(134, 239, 172, 0.25) 0%, transparent 70%);
      pointer-events: none;
    }

    .hero-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.28);
      padding: 0.22rem 0.65rem;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      margin-bottom: 0.55rem;
    }

    .hero-title {
      margin: 0 0 0.4rem;
      font-size: 1.5rem;
      font-weight: 800;
      line-height: 1.22;
      letter-spacing: -0.02em;
    }

    .hero-sub {
      margin: 0 0 0.9rem;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.9);
      line-height: 1.45;
      max-width: 520px;
    }

    .hero-actions {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .hero-btn-light {
      background: #ffffff;
      color: var(--primary-deep);
      font-weight: 700;
      padding: 0.55rem 1.05rem;
      border-radius: 6px;
    }
    .hero-btn-light:hover { background: #dcfce7; }

    .hero-btn-glass {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.35);
      padding: 0.55rem 1rem;
      border-radius: 6px;
    }
    .hero-btn-glass:hover { background: rgba(255, 255, 255, 0.26); }

    .hero-visual-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.65rem;
      position: relative;
      z-index: 1;
    }

    .hero-float-card {
      background: rgba(255, 255, 255, 0.13);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 10px;
      padding: 0.72rem 0.8rem;
      cursor: pointer;
      transition: transform 0.16s, background 0.16s;
    }
    .hero-float-card:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.22);
    }
    .hero-float-icon { font-size: 1.35rem; margin-bottom: 0.2rem; }
    .hero-float-title { font-size: 0.82rem; font-weight: 700; color: #ffffff; }
    .hero-float-desc { font-size: 0.7rem; color: rgba(255, 255, 255, 0.85); margin-top: 0.1rem; }

    /* =========================================================
       VERIFIED SHOPS SHOWCASE (MALL STRIP)
       ========================================================= */
    .mall-section {
      background: var(--card);
      border-radius: 10px;
      box-shadow: var(--shadow-xs);
      border: 1px solid var(--border);
      margin-bottom: 1rem;
      overflow: hidden;
    }

    .mall-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      background: #fafdfb;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .mall-title {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      font-weight: 800;
      font-size: 0.92rem;
      color: var(--primary-dark);
      letter-spacing: 0.02em;
    }

    .mall-shops-grid {
      display: flex;
      gap: 0.65rem;
      padding: 0.8rem 1rem;
      overflow-x: auto;
      scrollbar-width: thin;
    }

    .mall-shop-tile {
      min-width: 150px;
      max-width: 175px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.68rem 0.6rem;
      text-align: center;
      cursor: pointer;
      background: #ffffff;
      transition: all 0.16s ease;
      flex-shrink: 0;
    }

    .mall-shop-tile:hover {
      border-color: var(--primary);
      box-shadow: 0 3px 10px rgba(22, 163, 74, 0.12);
      transform: translateY(-1px);
    }

    .mall-shop-tile.active {
      border: 1.5px solid var(--primary);
      background: var(--primary-soft);
    }

    .mall-shop-logo {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      margin: 0 auto 0.4rem;
      background: linear-gradient(135deg, #dcfce7, #bbf7d0);
      color: var(--primary-deep);
      font-weight: 800;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #86efac;
    }

    .mall-shop-name {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mall-shop-meta {
      font-size: 0.68rem;
      color: var(--primary-dark);
      font-weight: 600;
      margin-top: 0.2rem;
    }

    /* =========================================================
       2-COLUMN MARKETPLACE LAYOUT (LEFT SIDEBAR + RIGHT GRID)
       ========================================================= */
    .marketplace-layout {
      display: grid;
      grid-template-columns: 205px 1fr;
      gap: 1rem;
      align-items: start;
    }

    .category-sidebar {
      background: var(--card);
      border-radius: 10px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-xs);
      padding: 0.9rem 0.85rem;
      position: sticky;
      top: 108px;
    }

    .sidebar-block { margin-bottom: 1.15rem; }
    .sidebar-block:last-child { margin-bottom: 0; }

    .sidebar-heading {
      font-size: 0.84rem;
      font-weight: 800;
      color: var(--primary-deep);
      padding-bottom: 0.55rem;
      margin-bottom: 0.55rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .sidebar-cat-list {
      display: flex;
      flex-direction: column;
      gap: 0.22rem;
    }

    .sidebar-cat-item {
      background: transparent;
      color: var(--text-secondary);
      border: none;
      text-align: left;
      padding: 0.42rem 0.5rem;
      font-size: 0.8rem;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .sidebar-cat-item:hover { color: var(--primary-dark); background: var(--primary-soft); }

    .sidebar-cat-item.active {
      color: var(--primary-dark);
      font-weight: 700;
      background: var(--primary-tint);
    }

    .sidebar-cat-item.active::before {
      content: "▸";
      color: var(--primary);
      font-size: 0.85rem;
    }

    .sidebar-filter-check {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.8rem;
      color: var(--text-secondary);
      padding: 0.34rem 0;
      cursor: pointer;
      user-select: none;
    }

    .sidebar-filter-check input { width: auto; accent-color: var(--primary); cursor: pointer; }

    .mobile-cat-strip {
      display: none;
      gap: 0.45rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
      margin-bottom: 0.65rem;
      scrollbar-width: none;
    }
    .mobile-cat-strip::-webkit-scrollbar { display: none; }
    .mobile-cat-pill {
      background: #ffffff;
      color: var(--text-secondary);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.35rem 0.8rem;
      font-size: 0.78rem;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .mobile-cat-pill.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    /* Sort Bar */
    .sort-bar {
      background: #e7f3ec;
      border: 1px solid #cce3d5;
      border-radius: 8px;
      padding: 0.6rem 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin-bottom: 0.75rem;
    }

    .sort-options {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      flex-wrap: wrap;
    }

    .sort-label {
      font-size: 0.8rem;
      color: var(--text-secondary);
      font-weight: 600;
      margin-right: 0.25rem;
    }

    .sort-btn {
      background: #ffffff;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 0.42rem 0.82rem;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .sort-btn:hover { border-color: var(--primary); color: var(--primary-dark); background: #fff; }
    .sort-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .sort-select {
      width: auto;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 0.4rem 0.7rem;
      font-size: 0.8rem;
      color: var(--text);
      font-weight: 600;
    }

    .selected-shop-banner {
      background: linear-gradient(135deg, #f0fdf4, #dcfce7);
      border: 1px solid #86efac;
      border-radius: 10px;
      padding: 0.9rem 1.1rem;
      margin-bottom: 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    /* =========================================================
       PURE PRODUCT CARDS
       ========================================================= */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
      gap: 0.75rem;
    }

    .card {
      background: var(--card);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-xs);
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: var(--primary);
      box-shadow: var(--shadow-md);
    }

    .card-img-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #f4f8f5;
      overflow: hidden;
    }

    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.25s ease;
    }

    .card:hover .card-img-wrap img { transform: scale(1.04); }

    .card-mall-tag {
      position: absolute;
      top: 7px;
      left: 0;
      background: var(--primary-dark);
      color: #ffffff;
      font-size: 0.64rem;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 0 4px 4px 0;
      letter-spacing: 0.03em;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
    }

    .card-top-badge {
      position: absolute;
      top: 7px;
      right: 7px;
      background: rgba(254, 249, 195, 0.96);
      color: #854d0e;
      font-size: 0.64rem;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .card-top-badge.soldout {
      background: rgba(15, 23, 42, 0.85);
      color: #ffffff;
    }

    .card-bottom-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(90deg, rgba(20, 83, 45, 0.92), rgba(22, 163, 74, 0.86));
      color: #ffffff;
      font-size: 0.66rem;
      font-weight: 700;
      padding: 3px 7px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-pure-body {
      padding: 0.58rem 0.62rem 0.68rem;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
      gap: 0.38rem;
    }

    .card-pure-title {
      font-size: 0.82rem;
      font-weight: 600;
      margin: 0;
      line-height: 1.35;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 2.2em;
    }

    .card-pure-tags {
      display: flex;
      gap: 0.28rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .mini-tag-green {
      font-size: 0.63rem;
      font-weight: 700;
      color: var(--primary-dark);
      border: 1px solid #86efac;
      background: var(--primary-soft);
      padding: 1px 5px;
      border-radius: 3px;
    }

    .mini-tag-outline {
      font-size: 0.63rem;
      font-weight: 600;
      color: var(--text-secondary);
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      padding: 1px 5px;
      border-radius: 3px;
    }

    .card-pure-footer {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.35rem;
      margin-top: 0.15rem;
    }

    .card-pure-price {
      font-size: 1rem;
      font-weight: 800;
      color: var(--primary-dark);
    }

    .card-pure-sold {
      font-size: 0.7rem;
      color: var(--muted);
      font-weight: 500;
      white-space: nowrap;
    }

    /* =========================================================
       EXPANDED PRODUCT DETAIL PAGE
       ========================================================= */
    .pdp-breadcrumb {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }

    .pdp-crumb-trail {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .pdp-crumb-link {
      color: var(--primary-dark);
      font-weight: 600;
      cursor: pointer;
    }
    .pdp-crumb-link:hover { text-decoration: underline; }

    .pdp-main-card {
      background: var(--card);
      border-radius: 10px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-xs);
      padding: 1.25rem;
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 1.5rem;
      margin-bottom: 0.9rem;
    }

    .pdp-gallery-main {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #f4f8f5;
    }

    .pdp-gallery-main img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .pdp-thumbs {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.6rem;
    }

    .pdp-thumb {
      width: 64px;
      height: 64px;
      border-radius: 6px;
      overflow: hidden;
      border: 2px solid transparent;
      cursor: pointer;
      background: #f8fafc;
    }
    .pdp-thumb.active { border-color: var(--primary); }
    .pdp-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .pdp-title-row {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      margin-bottom: 0.55rem;
    }

    .pdp-mall-pill {
      background: var(--primary);
      color: #ffffff;
      font-size: 0.68rem;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 4px;
      margin-top: 4px;
      flex-shrink: 0;
    }

    .pdp-title {
      margin: 0;
      font-size: 1.3rem;
      font-weight: 700;
      line-height: 1.32;
      color: var(--text);
    }

    .pdp-stats-bar {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      font-size: 0.84rem;
      color: var(--text-secondary);
      margin-bottom: 0.95rem;
    }

    .pdp-stat-item {
      display: flex;
      align-items: center;
      gap: 0.32rem;
    }

    .pdp-stat-divider {
      width: 1px;
      height: 14px;
      background: var(--border);
    }

    .pdp-price-box {
      background: var(--primary-soft);
      border: 1px solid #bbf7d0;
      border-radius: 8px;
      padding: 0.95rem 1.15rem;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .pdp-price-val {
      font-size: 1.85rem;
      font-weight: 800;
      color: var(--primary-dark);
      line-height: 1;
    }

    .pdp-meta-table {
      display: flex;
      flex-direction: column;
      gap: 0.72rem;
      font-size: 0.85rem;
      margin-bottom: 1.2rem;
    }

    .pdp-meta-row {
      display: grid;
      grid-template-columns: 125px 1fr;
      gap: 0.75rem;
      align-items: center;
    }

    .pdp-meta-label { color: var(--muted); font-weight: 600; }

    .qty-stepper {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 5px;
      overflow: hidden;
      background: #fff;
    }

    .qty-stepper button {
      background: #f8fafc;
      color: var(--text);
      border: none;
      width: 34px;
      height: 34px;
      padding: 0;
      border-radius: 0;
      font-size: 1rem;
      font-weight: 700;
    }
    .qty-stepper button:hover { background: var(--primary-soft); color: var(--primary-dark); }

    .qty-stepper input {
      width: 50px;
      height: 34px;
      border: none;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      border-radius: 0;
      text-align: center;
      font-weight: 700;
      font-size: 0.9rem;
      padding: 0;
    }

    .pdp-cta-row {
      display: flex;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .pdp-cta-row button {
      padding: 0.8rem 1.5rem;
      font-size: 0.94rem;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      min-width: 165px;
    }

    .pdp-shop-bar {
      background: var(--card);
      border-radius: 10px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-xs);
      padding: 1rem 1.25rem;
      margin-bottom: 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .pdp-shop-left {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .pdp-shop-avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, #16a34a, #15803d);
      color: #ffffff;
      font-weight: 800;
      font-size: 1.35rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .pdp-shop-stats {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      font-size: 0.82rem;
    }

    .pdp-shop-stat-col span { color: var(--muted); display: block; font-size: 0.74rem; }
    .pdp-shop-stat-col strong { color: var(--primary-dark); font-size: 0.95rem; }

    .pdp-bottom-grid {
      display: grid;
      grid-template-columns: 1fr 240px;
      gap: 0.9rem;
      align-items: start;
    }

    .pdp-section-card {
      background: var(--card);
      border-radius: 10px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-xs);
      padding: 1.2rem;
      margin-bottom: 0.9rem;
    }

    .pdp-section-heading {
      background: var(--primary-soft);
      padding: 0.62rem 0.9rem;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--primary-deep);
      margin: 0 0 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .pdp-spec-row {
      display: grid;
      grid-template-columns: 145px 1fr;
      gap: 0.75rem;
      padding: 0.42rem 0.4rem;
      font-size: 0.85rem;
    }

    .pdp-spec-label { color: var(--muted); }

    .pdp-description-text {
      font-size: 0.88rem;
      color: var(--text-secondary);
      line-height: 1.65;
      white-space: pre-line;
      padding: 0 0.4rem;
    }

    .rating-overview-box {
      background: var(--primary-soft);
      border: 1px solid #bbf7d0;
      border-radius: 8px;
      padding: 1rem 1.15rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }

    .rating-big-score {
      text-align: center;
      color: var(--primary-dark);
    }
    .rating-big-score .num { font-size: 1.85rem; font-weight: 800; line-height: 1; }

    .rating-filter-pills {
      display: flex;
      gap: 0.42rem;
      flex-wrap: wrap;
    }

    .rating-filter-btn {
      background: #ffffff;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 0.35rem 0.75rem;
      font-size: 0.78rem;
      font-weight: 600;
    }
    .rating-filter-btn.active {
      border-color: var(--primary);
      color: var(--primary-dark);
      background: var(--primary-tint);
    }

    .top-picks-card {
      background: var(--card);
      border-radius: 10px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-xs);
      padding: 0.9rem;
    }

    .top-picks-title {
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--primary-deep);
      margin-bottom: 0.75rem;
    }

    .top-pick-item {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.45rem;
      margin-bottom: 0.6rem;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .top-pick-item:hover { border-color: var(--primary); }
    .top-pick-item img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 4px; display: block; margin-bottom: 0.35rem; }
    .top-pick-name { font-size: 0.76rem; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .top-pick-price { font-size: 0.84rem; font-weight: 800; color: var(--primary-dark); margin-top: 0.15rem; }

    /* =========================================================
       SELLER CENTRE NAVIGATION MENU (MY HOME, INCOME, PRODUCTS, SHIPPING)
       ========================================================= */
    .seller-menu-bar {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.5rem;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.5rem;
      margin-bottom: 1rem;
      box-shadow: var(--shadow-xs);
    }

    .seller-menu-btn {
      background: #f8fbf9;
      color: var(--text-secondary);
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 0.72rem 0.8rem;
      font-size: 0.85rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      transition: all 0.16s ease;
    }

    .seller-menu-btn:hover {
      background: var(--primary-soft);
      color: var(--primary-dark);
      border-color: #bbf7d0;
    }

    .seller-menu-btn.active {
      background: linear-gradient(135deg, #15803d, #16a34a);
      color: #ffffff;
      box-shadow: 0 3px 10px rgba(22, 163, 74, 0.22);
    }

    /* =========================================================
       INCOME MONITORING & PIE CHART + PROFIT LEDGER
       ========================================================= */
    .income-split-grid {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 1.25rem;
      align-items: center;
      background: #f8fbf9;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.15rem;
      margin-bottom: 1rem;
    }

    .pie-chart-wrap {
      position: relative;
      width: 100%;
      max-width: 275px;
      margin: 0 auto;
    }

    .deduction-ledger {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem 1.15rem;
    }

    .deduction-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.48rem 0;
      font-size: 0.87rem;
      border-bottom: 1px dashed #e2e8f0;
    }

    .deduction-row:last-child { border-bottom: none; }

    .deduction-row.total-profit-row {
      margin-top: 0.45rem;
      padding-top: 0.7rem;
      border-top: 2px solid var(--primary);
      border-bottom: none;
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--primary-dark);
    }

    .legend-dot {
      display: inline-block;
      width: 11px;
      height: 11px;
      border-radius: 3px;
      margin-right: 0.45rem;
      vertical-align: middle;
    }

    /* =========================================================
       BARANGAY / LOCATION SHIPPING RULES CARDS
       ========================================================= */
    .brgy-rules-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 0.7rem;
      margin-top: 0.85rem;
    }

    .brgy-rule-card {
      background: #f8fbf9;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }

    .profit-preview-pill {
      background: var(--primary-soft);
      border: 1px solid #86efac;
      border-radius: 6px;
      padding: 0.55rem 0.85rem;
      font-size: 0.82rem;
      color: var(--primary-deep);
      margin-top: 0.65rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    /* =========================================================
       PANELS, FORMS, KPI CARDS, TABLES, AND MODALS
       ========================================================= */
    .panel {
      background: var(--card);
      padding: 1.2rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-xs);
      margin-bottom: 1rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 0.85rem;
    }

    label.field-label {
      display: block;
      font-size: 0.79rem;
      font-weight: 700;
      margin-bottom: 0.3rem;
      color: var(--text-secondary);
    }

    input, textarea, select {
      width: 100%;
      padding: 0.56rem 0.72rem;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.88rem;
      font-family: inherit;
      background: #fff;
    }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.14);
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(195px, 1fr));
      gap: 0.85rem;
      margin: 0.9rem 0 1.1rem;
    }
    .kpi-card {
      background: #f8fbf9;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.9rem 1rem;
    }
    .kpi-card.highlight { background: var(--primary-soft); border-color: #86efac; }
    .kpi-card.amber-highlight { background: #fffbeb; border-color: #fde68a; }
    .kpi-label { font-size: 0.72rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
    .kpi-value { font-size: 1.35rem; font-weight: 800; color: var(--text); margin-top: 0.25rem; }
    .kpi-card.highlight .kpi-value { color: var(--primary-dark); }
    .kpi-card.amber-highlight .kpi-value { color: #b45309; }
    .kpi-sub { font-size: 0.74rem; color: var(--muted); margin-top: 0.2rem; }

    /* Photo Slots (Max 2) */
    .photo-slots-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
      margin-top: 0.45rem;
      max-width: 340px;
    }
    .photo-slot {
      position: relative;
      aspect-ratio: 1 / 1;
      border: 2px dashed #cbd5e1;
      border-radius: 8px;
      background: #f8fbf9;

  let psgcCacheLoaded = false;
  let psgcLocationPool = [...LOCAL_PH_LOCATIONS];
  let phLocDebounceTimer = null;

  async function initPsgcLocations() {
    if (psgcCacheLoaded) return;
    psgcCacheLoaded = true;
    try {
      const [provRes, muniRes] = await Promise.all([
        fetch('https://psgc.gitlab.io/api/provinces/'),
        fetch('https://psgc.gitlab.io/api/municipalities/')
      ]);
      const provinces = provRes.ok ? await provRes.json() : [];
      const munis = muniRes.ok ? await muniRes.json() : [];
      const provMap = new Map();
      (provinces || []).forEach(p => provMap.set(p.code, p.name));

      const added = new Set(psgcLocationPool.map(x => x.label.toLowerCase()));
      (munis || []).forEach(m => {
        const provName = provMap.get(m.provinceCode) || '';
        const label = provName ? `${m.name}, ${provName}` : m.name;
        if (!added.has(label.toLowerCase())) {
          added.add(label.toLowerCase());
          psgcLocationPool.push({
            label,
            type: 'Municipality',
            area: m.name,
            code: m.code
          });
        }
      });
      (provinces || []).forEach(p => {
        if (!added.has(p.name.toLowerCase())) {
          added.add(p.name.toLowerCase());
          psgcLocationPool.push({
            label: p.name,
            type: 'Province',
            area: p.name
          });
        }
      });
    } catch (_) {
      // Offline / network fallback uses LOCAL_PH_LOCATIONS seamlessly
    }
  }

  async function searchPsgcBarangays(keyword) {
    const clean = (keyword || '').trim().toLowerCase();
    if (clean.length < 2) return [];
    const matchedMuni = psgcLocationPool.find(item =>
      item.code && (clean.includes(item.area.toLowerCase()) || item.label.toLowerCase().includes(clean))
    );
    if (!matchedMuni || !matchedMuni.code) return [];
    try {
      const res = await fetch(`https://psgc.gitlab.io/api/municipalities/${matchedMuni.code}/barangays/`);
      if (!res.ok) return [];
      const brgys = await res.json();
      return (brgys || []).map(b => ({
        label: `${b.name}, ${matchedMuni.label}`,
        type: 'Barangay',
        area: matchedMuni.area
      }));
    } catch (_) {
      return [];
    }
  }

  function onPhLocationInput(inputEl, dropdownId) {
    const dd = document.getElementById(dropdownId);
    if (!dd || !inputEl) return;
    const rawVal = inputEl.value || '';
    const parts = rawVal.split(',');
    const queryTerm = (parts[parts.length - 1] || rawVal).trim().toLowerCase();

    clearTimeout(phLocDebounceTimer);
    phLocDebounceTimer = setTimeout(async () => {
      let candidates = psgcLocationPool.filter(item =>
        !queryTerm ||
        item.label.toLowerCase().includes(queryTerm) ||
        item.label.toLowerCase().includes(rawVal.trim().toLowerCase())
      );

      if (queryTerm.length >= 2) {
        const dynamicBrgys = await searchPsgcBarangays(queryTerm);
        if (dynamicBrgys.length > 0) {
          const existing = new Set(candidates.map(c => c.label.toLowerCase()));
          dynamicBrgys.forEach(b => {
            if (!existing.has(b.label.toLowerCase())) {
              existing.add(b.label.toLowerCase());
              candidates.unshift(b);
            }
          });
        }
      }

      candidates = candidates.slice(0, 10);
      if (candidates.length === 0) {
        dd.classList.add('hidden');
        return;
      }

      dd.innerHTML = candidates.map(c => `
        <div class="ph-loc-item" onmousedown="event.preventDefault(); selectPhLocation('${inputEl.id}', '${dropdownId}', ${JSON.stringify(c.label).replace(/"/g, '&quot;')})">
          <div>
            <div class="ph-loc-main">${escapeHtml(c.label)}</div>
            <div class="ph-loc-sub">${escapeHtml(c.area)}</div>
          </div>
          <span class="ph-loc-tag">${escapeHtml(c.type)}</span>
        </div>
      `).join('');
      dd.classList.remove('hidden');
    }, 90);
  }

  function selectPhLocation(inputId, dropdownId, chosenLabel) {
    const inputEl = document.getElementById(inputId);
    const dd = document.getElementById(dropdownId);
    if (inputEl) {
      if (inputEl.tagName === 'TEXTAREA') {
        const existingParts = inputEl.value.split(',');
        if (existingParts.length > 1) {
          existingParts[existingParts.length - 1] = ' ' + chosenLabel;
          inputEl.value = existingParts.join(',').replace(/^,\s*/, '');
        } else {
          inputEl.value = chosenLabel;
        }
      } else {
        inputEl.value = chosenLabel;
      }
      inputEl.dispatchEvent(new Event('input', { bubbles: true }));
    }
    if (dd) dd.classList.add('hidden');
  }

  document.addEventListener('click', (e) => {
    if (!e.target.closest('.ph-loc-wrap')) {

  // =========================================================
  // REALISTIC ORDER REFERENCE GENERATOR (MH-YYYYMMDD-XXXXXX)
  // =========================================================
  function generateOrderReference() {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, '0');
    const d = String(now.getDate()).padStart(2, '0');
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let code = '';
    for (let i = 0; i < 6; i++) {
      code += chars[Math.floor(Math.random() * chars.length)];
    }
    return `MH-${y}${m}${d}-${code}`;

  function formatMoney(n) {
    return '₱' + Number(n || 0).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function escapeHtml(str) {
    return String(str || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function getMonthKey(dateStr) {
    if (!dateStr) return 'unknown';
    const d = new Date(dateStr);
    if (isNaN(d.getTime())) return String(dateStr).slice(0, 7);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  }

  function formatMonthLabel(monthKey) {
    if (!monthKey || monthKey === 'unknown') return 'Unknown Month';
    const [y, m] = monthKey.split('-');
    const d = new Date(Number(y), Number(m) - 1, 1);
    return d.toLocaleDateString('en-PH', { month: 'long', year: 'numeric' });
  }

  function formatTimeAgo(dateStr) {
    if (!dateStr) return '';
    const diffSec = Math.floor((Date.now() - new Date(dateStr).getTime()) / 1000);
    if (diffSec < 60) return 'Just now';
    if (diffSec < 3600) return `${Math.floor(diffSec / 60)}m ago`;
    if (diffSec < 86400) return `${Math.floor(diffSec / 3600)}h ago`;
    return `${Math.floor(diffSec / 86400)}d ago`;
  }

  // =========================================================
  function parseShopShippingMeta(shop) {
    let brgyRules = [];
    let outPolicy = 'chat_seller';
    if (shop && shop.shipping_notes) {
      try {
        const parsed = JSON.parse(shop.shipping_notes);
        if (parsed && Array.isArray(parsed.brgy_rules)) {
          brgyRules = parsed.brgy_rules;
        }
        if (parsed && parsed.out_policy) {
          outPolicy = parsed.out_policy;
        }
      } catch (_) {}
    }

    const isFreeDefault = Boolean(shop?.free_shipping);
    const defaultFee = isFreeDefault ? 0 : Math.max(0, Number(shop?.shipping_fee ?? 50) || 0);
    const areaMode = shop?.delivery_area_mode === 'all' ? 'all' : 'specific';
    const allowedArea = (shop?.delivery_area_text || 'Roxas Only').trim();

    return {
      isFreeDefault,
      defaultFee,
      areaMode,
      allowedArea,
      brgyRules,
      outPolicy
    };
  }

  function encodeShopShippingNotes(brgyRules, outPolicy) {
    return JSON.stringify({
      brgy_rules: Array.isArray(brgyRules) ? brgyRules : [],
      out_policy: outPolicy || 'chat_seller'
    });
  }

  function evaluateBuyerShippingForShop(shop, buyerAddress) {
    const meta = parseShopShippingMeta(shop);
    const addrClean = (buyerAddress || '').trim().toLowerCase();

    // 1. Check specific configured barangay / location rules first
    if (addrClean && Array.isArray(meta.brgyRules) && meta.brgyRules.length > 0) {
      for (const rule of meta.brgyRules) {
        const locName = String(rule.location || rule.barangay || '').trim();
        if (!locName) continue;
        const locTokens = locName.toLowerCase().split(',').map(s => s.trim()).filter(Boolean);
        const primaryToken = locTokens[0] || locName.toLowerCase();
        if (addrClean.includes(locName.toLowerCase()) || (primaryToken.length >= 3 && addrClean.includes(primaryToken))) {
          const isFree = rule.mode === 'free';
          const fee = isFree ? 0 : Math.max(0, Number(rule.fee || 0));
          return {
            allowed: true,
            outOfRange: false,
            fee,
            isFree,
            matchedLocation: locName,
            rangeNote: rule.rangeNote || '',
            label: isFree
              ? `Free Shipping (${locName})`
              : `${formatMoney(fee)} (${locName}${rule.rangeNote ? ' • ' + rule.rangeNote : ''})`
          };
        }
      }
    }

    // 2. Check general coverage area
    if (meta.areaMode === 'all') {
      return {
        allowed: true,
        outOfRange: false,
        fee: meta.isFreeDefault ? 0 : meta.defaultFee,
        isFree: meta.isFreeDefault,
        matchedLocation: 'All PH Areas',
        rangeNote: '',
        label: meta.isFreeDefault ? 'Free Shipping' : formatMoney(meta.defaultFee)
      };
    }

    // Specific coverage area check
    const areaTokens = meta.allowedArea
      .replace(/\bonly\b/gi, '')
      .split(',')
      .map(t => t.trim().toLowerCase())
      .filter(t => t.length >= 3);

    const matchesAllowedArea = Boolean(addrClean) && areaTokens.some(tok => addrClean.includes(tok));

    if (matchesAllowedArea || !addrClean) {
      return {
        allowed: true,
        outOfRange: false,
        fee: meta.isFreeDefault ? 0 : meta.defaultFee,
        isFree: meta.isFreeDefault,
        matchedLocation: meta.allowedArea,
        rangeNote: '',
        label: meta.isFreeDefault ? 'Free Shipping' : formatMoney(meta.defaultFee)
      };
    }

    // Out of range / unlisted location
    const blockOrder = meta.outPolicy === 'block_order';
    return {
      allowed: !blockOrder,
      outOfRange: true,
      fee: meta.isFreeDefault ? 0 : meta.defaultFee,
      isFree: meta.isFreeDefault,
      matchedLocation: '',
      rangeNote: '',
      label: `Out of range — Chat seller (${meta.allowedArea})`,
      warningText: `Your location is outside ${shop.name}'s configured range (${meta.allowedArea}). Please chat the seller first to confirm shipping fee.`
    };
  }

  function getShopShippingBadgeHtml(shop) {
    const meta = parseShopShippingMeta(shop);
    if (meta.brgyRules.length > 0) {
      const hasFree = meta.brgyRules.some(r => r.mode === 'free');

  function fileToCompressedBase64(file, maxSize = 600, quality = 0.68) {
    return new Promise((resolve, reject) => {
      if (!file.type.startsWith('image/')) {
        reject(new Error('Please select a valid image file.'));
        return;
      }
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          if (width > height) {
            if (width > maxSize) { height = Math.round((height * maxSize) / width); width = maxSize; }
          } else {
            if (height > maxSize) { width = Math.round((width * maxSize) / height); height = maxSize; }
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          try {
            const webp = canvas.toDataURL('image/webp', quality);
            resolve(webp.startsWith('data:image/webp') ? webp : canvas.toDataURL('image/jpeg', quality));
          } catch (_) {
            resolve(canvas.toDataURL('image/jpeg', quality));
          }
        };
        img.onerror = () => reject(new Error('Invalid image file.'));
        img.src = ev.target.result;
      };
      reader.onerror = () => reject(new Error('Failed to read file.'));
      reader.readAsDataURL(file);
    });
  }

  async function signUp(e) {
    e.preventDefault();
    const btn = document.getElementById('btn-submit-register');
    btn.disabled = true;
    btn.textContent = 'Creating account...';
    try {
      const fullName = document.getElementById('reg-name').value.trim();
      const phone = document.getElementById('reg-phone').value.trim();
      const address = document.getElementById('reg-address').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;

      const { data, error } = await db.auth.signUp({
        email,
        password,
        options: { data: { full_name: fullName, phone, address, role: 'buyer' } }
      });
      if (error) throw error;

      if (data.user) {
        await db.from('profiles').upsert({
          id: data.user.id,
          full_name: fullName,
          phone,
          address,
          role: 'buyer'
        }, { onConflict: 'id' });
      }

      if (!data.session) {
        showToast('Account registered! Check your email to confirm, then sign in.', 'success', 4500);
        switchAuthTab('signin');
      } else {
        currentProfile = { full_name: fullName, phone, address, role: 'buyer' };
        closeAuthModal();
        showToast('Account created! Welcome to MarketHub.', 'success');
      }
    } catch (err) {
      showToast(err.message || 'Registration failed.', 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Complete Registration';
    }
  }

  function toggleNotifDropdown(e) {

  async function createNotification(recipientUserId, title, message, type = 'order', targetTab = 'purchases') {
    if (!recipientUserId) return;
    try {
      await db.from('notifications').insert({
        user_id: recipientUserId,

        message,
        type,
        target_tab: targetTab,
        is_read: false
      });
    } catch (_) {}

  async function loadNotifications() {
    if (!currentUser) return;
    try {
      const { data, error } = await db
        .from('notifications')
        .select('*')
        .eq('user_id', currentUser.id)
        .order('created_at', { ascending: false })
        .limit(30);
      if (error) return;
      notifications = data || [];
      renderNotificationsUI();
    } catch (_) {}
  }

  function renderNotificationsUI() {
    const wrapper = document.getElementById('notif-wrapper');
    if (!currentUser) {
      wrapper.classList.add('hidden');
      return;
    }
    wrapper.classList.remove('hidden');

    const unreadCount = notifications.filter(n => !n.is_read).length;
    const badge = document.getElementById('notif-badge');
    if (unreadCount > 0) {
      badge.textContent = unreadCount;
      badge.classList.remove('hidden');
    } else {
      badge.classList.add('hidden');
    }

    const listEl = document.getElementById('notif-list');
    if (notifications.length === 0) {
      listEl.innerHTML = `<div style="padding:1.5rem 1rem; text-align:center; color:var(--muted); font-size:0.82rem;">No notifications yet.</div>`;
      return;
    }

    listEl.innerHTML = notifications.map(n => `
      <div class="notif-item ${n.is_read ? '' : 'unread'}" onclick="handleNotificationClick('${n.id}', '${n.target_tab || 'purchases'}')">
        <div class="notif-item-top">
          <span class="notif-title">${escapeHtml(n.title)}</span>
          <span class="notif-time">${formatTimeAgo(n.created_at)}</span>
        </div>
        <div class="notif-desc">${escapeHtml(n.message)}</div>
      </div>
    `).join('');
  }

  async function handleNotificationClick(notifId, targetTab) {
    if (!currentUser) return;
    await db.from('notifications').update({ is_read: true }).eq('id', notifId);
    const item = notifications.find(n => n.id === notifId);
    if (item) item.is_read = true;
    renderNotificationsUI();
    document.getElementById('notif-dropdown').classList.add('hidden');
    if (targetTab === 'chat') {
      openChatModal();
    } else {
      switchOrdersSubTab(targetTab === 'sales' ? 'sales' : 'purchases');
      switchView('orders');
    }
  }

  async function markAllNotificationsRead() {
    if (!currentUser) return;
    await db.from('notifications').update({ is_read: true }).eq('user_id', currentUser.id).eq('is_read', false);
    notifications.forEach(n => n.is_read = true);
    renderNotificationsUI();
  }

  async function clearAllNotifications() {
    if (!currentUser) return;
    await db.from('notifications').delete().eq('user_id', currentUser.id);
    notifications = [];
    renderNotificationsUI();

  async function openChatModal(prefillShopId = null, prefillPeerId = null, prefillMessage = '') {
    if (!currentUser) {
      openAuthModal('signin');
      return;
    }
    if (prefillShopId) activeChatShopId = prefillShopId;
    if (prefillPeerId) activeChatPeerId = prefillPeerId;
    if (prefillMessage) {
      const inp = document.getElementById('chat-message-input');
      if (inp && !inp.value) inp.value = prefillMessage;
    }

  }

  function closeChatModal() {
    document.getElementById('chat-modal').classList.add('hidden');
  }

  async function loadChatMessages(renderThreads = false) {
    if (!currentUser) return;
    try {
      const { data, error } = await db
        .from('chat_messages')
        .select('*')
        .or(`sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`)
        .order('created_at', { ascending: true })
        .limit(200);
      if (!error && data) {
        chatMessages = data;
      }
    } catch (_) {}

    updateChatBadge();
    if (renderThreads || !activeChatPeerId) {
      buildChatThreadsList();
    }
    renderActiveChatFeed();
  }

  function updateChatBadge() {
    const btn = document.getElementById('btn-live-chat');
    const badge = document.getElementById('chat-unread-badge');
    if (!currentUser) {
      btn?.classList.add('hidden');
      return;
    }
    btn?.classList.remove('hidden');
    const unread = chatMessages.filter(m => m.receiver_id === currentUser.id && !m.is_read).length;
    if (unread > 0) {
      badge.textContent = unread;
      badge.classList.remove('hidden');
    } else {
      badge.classList.add('hidden');
    }
  }

  function buildChatThreadsList() {
    const container = document.getElementById('chat-threads-list');
    if (!container) return;

    const threadsMap = new Map();

    if (activeChatPeerId && activeChatPeerId !== currentUser.id) {
      const shop = allShops.find(s => s.owner_id === activeChatPeerId || s.id === activeChatShopId);
      threadsMap.set(activeChatPeerId, {
        peerId: activeChatPeerId,
        shopId: shop ? shop.id : activeChatShopId,
        title: shop ? shop.name : 'Seller / Buyer',
        subtitle: shop ? `Store • ${shop.delivery_area_text || 'Verified Shop'}` : 'Direct Chat',
        lastMsg: '',
        lastTime: ''
      });
    }

    chatMessages.forEach(m => {
      const peerId = m.sender_id === currentUser.id ? m.receiver_id : m.sender_id;
      if (!peerId || peerId === currentUser.id) return;
      const shop = allShops.find(s => s.id === m.shop_id || s.owner_id === peerId);
      threadsMap.set(peerId, {
        peerId,
        shopId: m.shop_id || (shop ? shop.id : null),
        title: shop ? shop.name : (m.sender_name && m.sender_id !== currentUser.id ? m.sender_name : 'Marketplace User'),
        subtitle: shop ? `Store • ${shop.delivery_area_text || 'Verified Shop'}` : 'Order / Inquiry Chat',
        lastMsg: m.message,
        lastTime: m.created_at
      });
    });

    const threads = Array.from(threadsMap.values());
    if (!activeChatPeerId && threads.length > 0) {
      activeChatPeerId = threads[0].peerId;
      activeChatShopId = threads[0].shopId;
    }

    if (threads.length === 0) {
      container.innerHTML = `<div style="padding:1.25rem 0.85rem; font-size:0.78rem; color:var(--muted); text-align:center;">No conversations yet. Click "Chat Seller" on any shop or product!</div>`;
      return;
    }

    container.innerHTML = threads.map(t => `
      <div class="chat-thread-item ${t.peerId === activeChatPeerId ? 'active' : ''}" onclick="selectChatThread('${t.peerId}', '${t.shopId || ''}')">
        <div style="font-weight:700; font-size:0.82rem; color:var(--text);">${escapeHtml(t.title)}</div>
        <div style="font-size:0.7rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:0.15rem;">${escapeHtml(t.lastMsg || t.subtitle)}</div>
      </div>
    `).join('');
  }

  async function selectChatThread(peerId, shopId) {
    activeChatPeerId = peerId;
    activeChatShopId = shopId || null;
    buildChatThreadsList();
    renderActiveChatFeed();
    if (currentUser) {
      try {
        await db.from('chat_messages').update({ is_read: true }).eq('receiver_id', currentUser.id).eq('sender_id', peerId);
        chatMessages.forEach(m => {
          if (m.receiver_id === currentUser.id && m.sender_id === peerId) m.is_read = true;
        });
        updateChatBadge();
      } catch (_) {}
    }
  }

  function renderActiveChatFeed() {
    const feed = document.getElementById('chat-messages-feed');
    const banner = document.getElementById('chat-active-banner');
    if (!feed || !banner) return;

    if (!activeChatPeerId) {
      banner.textContent = 'Select or start a conversation';
      feed.innerHTML = `<div style="text-align:center; color:var(--muted); font-size:0.82rem; margin-top:2rem;">Choose a shop from the left or click "Chat Seller" on any item.</div>`;
      return;
    }

    const shop = allShops.find(s => s.owner_id === activeChatPeerId || s.id === activeChatShopId);
    banner.textContent = shop
      ? `💬 Chatting with ${shop.name} (${shop.delivery_area_text || 'Verified Seller'})`
      : '💬 Direct Conversation';

    const msgs = chatMessages.filter(m =>
      (m.sender_id === currentUser.id && m.receiver_id === activeChatPeerId) ||
      (m.sender_id === activeChatPeerId && m.receiver_id === currentUser.id)
    );

    if (msgs.length === 0) {
      feed.innerHTML = `<div style="text-align:center; color:var(--muted); font-size:0.8rem; margin-top:2rem;">Say hi to start chatting about products, stock, or shipping fee!</div>`;
      return;
    }

    feed.innerHTML = msgs.map(m => {
      const isMine = m.sender_id === currentUser.id;
      return `
        <div class="chat-bubble ${isMine ? 'mine' : 'theirs'}">
          <div>${escapeHtml(m.message)}</div>
          <span class="chat-bubble-meta">${isMine ? 'You' : escapeHtml(m.sender_name || 'User')} • ${formatTimeAgo(m.created_at)}</span>
        </div>
      `;
    }).join('');
    feed.scrollTop = feed.scrollHeight;
  }

  async function sendChatMessage(e) {
    e.preventDefault();
    if (!currentUser || !activeChatPeerId) {
      showToast('Select a seller or buyer first.', 'error');
      return;
    }
    const input = document.getElementById('chat-message-input');
    const text = input.value.trim();
    if (!text) return;

    const btn = document.getElementById('btn-send-chat');
    btn.disabled = true;
    try {
      const payload = {
        sender_id: currentUser.id,
        receiver_id: activeChatPeerId,
        shop_id: activeChatShopId || null,
        sender_name: currentProfile.full_name || currentUser.email || 'Member',
        message: text,
        is_read: false
      };
      const { data, error } = await db.from('chat_messages').insert(payload).select().single();
      if (error) throw error;
      chatMessages.push(data || { ...payload, created_at: new Date().toISOString() });
      input.value = '';
      buildChatThreadsList();
      renderActiveChatFeed();
      await createNotification(
        activeChatPeerId,
        `💬 New message from ${payload.sender_name}`,
        text.slice(0, 110),
        'chat',
        'chat'
      );
    } catch (err) {
      showToast(err.message || 'Could not send message.', 'error');
    } finally {
      btn.disabled = false;
    }
  }

  async function loadMarketplace() {
    try {
      const [shopsRes, prodsRes] = await Promise.all([
        db.from('shops').select('*').order('created_at', { ascending: false }),
        db.from('products').select('*').order('created_at', { ascending: false })
      ]);
      if (shopsRes.error) throw shopsRes.error;
      if (prodsRes.error) throw prodsRes.error;

      allShops = shopsRes.data || [];
      allProducts = prodsRes.data || [];
      if (currentUser) {
        myShop = allShops.find(s => s.owner_id === currentUser.id) || null;
      }
      renderMarketplaceAll();
    } catch (err) {
      showError('Failed to load marketplace: ' + err.message);
    }
  }

    renderShopsShowcase();
    renderSelectedShopBanner();
    renderProductGrid();
  }

  function getApprovedShopIds() {
    return new Set(allShops.filter(s => s.status === 'approved').map(s => s.id));

  function renderShopsShowcase() {
    const approvedShops = allShops.filter(s => s.status === 'approved');
    document.getElementById('shops-count').textContent = approvedShops.length;
    document.getElementById('btn-clear-shop-filter').classList.toggle('hidden', activeShopFilter === 'all');

    const container = document.getElementById('shops-list-pills');
    if (approvedShops.length === 0) {
      container.innerHTML = `<span style="color:var(--muted); font-size:0.84rem;">No Admin-verified shops yet.</span>`;
      return;
    }

        <div class="mall-shop-tile ${isSelected ? 'active' : ''}" onclick="setShopFilter('${shop.id}')">

  function renderProductGrid() {
    const grid = document.getElementById('product-grid');
    const q = (document.getElementById('search-input')?.value || '').trim().toLowerCase();
    const approvedIds = getApprovedShopIds();
    const shopMap = new Map(allShops.map(s => [s.id, s]));

    let filtered = allProducts.filter(p => {
      if (!approvedIds.has(p.shop_id)) return false;
      const shop = shopMap.get(p.shop_id);
      const meta = parseShopShippingMeta(shop);
      const shopName = (shop?.name || '').toLowerCase();
      const areaText = (shop?.delivery_area_text || '').toLowerCase();
      const brgyNames = meta.brgyRules.map(r => (r.location || '').toLowerCase()).join(' ');

      const matchesShop = activeShopFilter === 'all' || p.shop_id === activeShopFilter;
      const matchesCat = activeCategoryFilter === 'all' || (p.category || 'General Merchandise') === activeCategoryFilter;
      const matchesStock = !onlyInStock || Number(p.stock || 0) > 0;
      const matchesFreeShip = !onlyFreeShipping || meta.isFreeDefault || meta.brgyRules.some(r => r.mode === 'free');
      const matchesRoxas = !onlyRoxasArea || areaText.includes('roxas') || brgyNames.includes('roxas');

      const matchesQuery = !q ||
        (p.name || '').toLowerCase().includes(q) ||
        (p.description || '').toLowerCase().includes(q) ||
        (p.category || '').toLowerCase().includes(q) ||
        shopName.includes(q) ||
        areaText.includes(q) ||
        brgyNames.includes(q);

      return matchesShop && matchesCat && matchesStock && matchesFreeShip && matchesRoxas && matchesQuery;
    });

    if (priceSortMode === 'price_asc') {
      filtered.sort((a, b) => Number(a.price) - Number(b.price));
    } else if (priceSortMode === 'price_desc') {
      filtered.sort((a, b) => Number(b.price) - Number(a.price));
    } else if (sortMode === 'latest') {
      filtered.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
    } else if (sortMode === 'topsales') {
      filtered.sort((a, b) => Number(b.sold_count || 0) - Number(a.sold_count || 0));
    } else {
      filtered.sort((a, b) => (Number(b.sold_count || 0) + Number(b.stock || 0) * 0.1) - (Number(a.sold_count || 0) + Number(a.stock || 0) * 0.1));
    }

    document.getElementById('catalog-result-count').textContent = `${filtered.length} product(s)`;

    const loadMoreWrap = document.getElementById('load-more-wrap');
    const remainingCount = Math.max(0, filtered.length - visibleProductsCount);
    if (remainingCount > 0) {
      loadMoreWrap.classList.remove('hidden');
      document.getElementById('remaining-products-count').textContent = remainingCount;
    } else {
      loadMoreWrap.classList.add('hidden');
    }

    const pageItems = filtered.slice(0, visibleProductsCount);

    if (pageItems.length === 0) {
      grid.innerHTML = `<div class="empty-state" style="grid-column: 1 / -1;">No products match your current filter. Try clearing filters or searching another keyword.</div>`;
      return;
    }

    grid.innerHTML = pageItems.map(p => {
      const outOfStock = Number(p.stock || 0) <= 0;
      const soldCount = Number(p.sold_count || 0);
      const shop = shopMap.get(p.shop_id);
      const meta = parseShopShippingMeta(shop);
      const photo = getProductPrimaryPhoto(p);
      const hasFreeOption = meta.isFreeDefault || meta.brgyRules.some(r => r.mode === 'free');

      return `
        <div class="card" onclick="openExpandedProduct('${p.id}')">
          <div class="card-img-wrap">
            <img src="${escapeHtml(photo)}" alt="${escapeHtml(p.name)}" loading="lazy" />
            <span class="card-mall-tag">VERIFIED</span>
            ${outOfStock
              ? `<span class="card-top-badge soldout">Sold Out</span>`
              : (hasFreeOption ? `<span class="card-top-badge">FREE SHIP</span>` : `<span class="card-top-badge">COD / QR</span>`)}
            <div class="card-bottom-overlay">${escapeHtml(shop ? shop.name : 'MarketHub Store')}</div>
          </div>

          <div class="card-pure-body">
            <h3 class="card-pure-title">${escapeHtml(p.name)}</h3>
            <div class="card-pure-tags">
              ${hasFreeOption ? `<span class="mini-tag-green">Free Shipping</span>` : `<span class="mini-tag-outline">${escapeHtml(meta.areaMode === 'all' ? 'All Areas' : meta.allowedArea)}</span>`}
              <span class="mini-tag-outline">${escapeHtml(p.category || 'General')}</span>
            </div>
            <div class="card-pure-footer">
              <span class="card-pure-price">${formatMoney(p.price)}</span>
              <span class="card-pure-sold">${soldCount} sold</span>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  async function openExpandedProduct(productId) {
    const prod = allProducts.find(p => p.id === productId);
    if (!prod) return;

    activeExpandedProduct = prod;
    activePdpGalleryIndex = 0;
    activeReviewStarFilter = 'all';

    const shop = allShops.find(s => s.id === prod.shop_id);
    const meta = parseShopShippingMeta(shop);
    const photos = getProductPhotos(prod);
    const outOfStock = Number(prod.stock || 0) <= 0;

    document.getElementById('pdp-crumb-cat').textContent = prod.category || 'General Merchandise';
    document.getElementById('pdp-crumb-title').textContent = prod.name;
    document.getElementById('pdp-title').textContent = prod.name;
    document.getElementById('pdp-price').textContent = formatMoney(prod.price);
    document.getElementById('pdp-sold-count').textContent = Number(prod.sold_count || 0);
    document.getElementById('pdp-stock-text').textContent = outOfStock ? 'Out of stock' : `${prod.stock} pieces available`;

    document.getElementById('pdp-ship-pill').outerHTML = `<span id="pdp-ship-pill">${getShopShippingBadgeHtml(shop)}</span>`;
    document.getElementById('pdp-area-pill').outerHTML = `<span id="pdp-area-pill">${getShopAreaBadgeHtml(shop)}</span>`;

    const hasQr = Boolean(shop && shop.qr_image_url);
    document.getElementById('pdp-payment-info').textContent = hasQr
      ? '💵 Cash on Delivery (COD) & 📱 E-Wallet Scan QR'
      : '💵 Cash on Delivery (COD)';

    const rulesSummary = meta.brgyRules.length > 0
      ? meta.brgyRules.map(r => `${r.location}: ${r.mode === 'free' ? 'FREE' : formatMoney(r.fee)}`).join(' • ')
      : (meta.isFreeDefault ? 'Free Shipping (₱0.00)' : `${formatMoney(meta.defaultFee)} standard fee`);
    document.getElementById('pdp-shipping-info').textContent = rulesSummary;
    document.getElementById('pdp-area-info').textContent = meta.areaMode === 'all' ? 'All Areas / Philippines-Wide' : meta.allowedArea;

    document.getElementById('pdp-spec-cat').textContent = prod.category || 'General Merchandise';
    document.getElementById('pdp-spec-stock').textContent = outOfStock ? 'OUT OF STOCK' : `IN STOCK (${prod.stock})`;
    document.getElementById('pdp-spec-area').textContent = meta.areaMode === 'all' ? 'All Areas / Nationwide' : meta.allowedArea;
    document.getElementById('pdp-spec-ship').textContent = rulesSummary;
    document.getElementById('pdp-spec-shop').textContent = shop ? shop.name : 'MarketHub Official';
    document.getElementById('pdp-description').textContent = prod.description || 'No detailed description provided by seller.';

    renderPdpGallery(photos);

    const qtyInput = document.getElementById('pdp-qty');
    qtyInput.max = Math.max(1, Number(prod.stock || 1));
    qtyInput.value = 1;

    const addBtn = document.getElementById('pdp-add-btn');
    const buyBtn = document.getElementById('pdp-buy-btn');
    const chatBtn = document.getElementById('pdp-chat-btn');
    addBtn.disabled = outOfStock;
    buyBtn.disabled = outOfStock;
    addBtn.onclick = () => addToCart(prod.id, Math.max(1, Number(document.getElementById('pdp-qty').value || 1)));
    buyBtn.onclick = () => buyNowProduct(prod.id, Math.max(1, Number(document.getElementById('pdp-qty').value || 1)));
    chatBtn.onclick = () => openChatModal(shop?.id || prod.shop_id, shop?.owner_id || null, `Hi! Ask about ${prod.name} & shipping to my location.`);

    const shopName = shop ? shop.name : 'Verified Seller';
    document.getElementById('pdp-shop-avatar').textContent = shopName.charAt(0).toUpperCase();
    document.getElementById('pdp-shop-name').textContent = shopName;
    document.getElementById('pdp-shop-desc-short').textContent = shop?.description || 'Trusted local store on MarketHub';

    const shopProds = allProducts.filter(p => p.shop_id === prod.shop_id);
    const shopTotalSold = shopProds.reduce((sum, p) => sum + Number(p.sold_count || 0), 0);
    document.getElementById('pdp-shop-prod-count').textContent = shopProds.length;
    document.getElementById('pdp-shop-total-sold').textContent = shopTotalSold;
    document.getElementById('pdp-shop-area-stat').textContent = meta.areaMode === 'all' ? 'All Areas' : meta.allowedArea;
    document.getElementById('pdp-shop-ship-stat').textContent = meta.isFreeDefault ? 'Free' : formatMoney(meta.defaultFee);

    document.getElementById('pdp-shop-chat-btn').onclick = () => openChatModal(shop?.id || prod.shop_id, shop?.owner_id || null);
    document.getElementById('pdp-view-shop-btn').onclick = () => {
      closeExpandedProduct();
      setShopFilter(prod.shop_id);
    };

    const topPicks = shopProds.filter(p => p.id !== prod.id).slice(0, 4);
    document.getElementById('pdp-top-picks-list').innerHTML = topPicks.length === 0
      ? `<div style="font-size:0.78rem; color:var(--muted); text-align:center; padding:1rem 0;">More items coming soon.</div>`
      : topPicks.map(tp => `
          <div class="top-pick-item" onclick="openExpandedProduct('${tp.id}')">

            <div class="top-pick-name">${escapeHtml(tp.name)}</div>
            <div class="top-pick-price">${formatMoney(tp.price)}</div>
          </div>
        `).join('');

    ['shop', 'product-detail', 'seller', 'orders', 'admin'].forEach(v => {
      document.getElementById(`view-${v}`).classList.toggle('hidden', v !== 'product-detail');
    });
    window.scrollTo({ top: 0, behavior: 'smooth' });
    await loadProductReviews(prod.id);
  }

  function closeExpandedProduct() {
    activeExpandedProduct = null;
    switchView('shop');

  function renderPdpGallery(photos) {
    document.getElementById('pdp-main-img').src = photos[activePdpGalleryIndex] || photos[0];
    const thumbsEl = document.getElementById('pdp-thumbs');
    if (photos.length <= 1) {
      thumbsEl.innerHTML = '';
      return;
    }
    thumbsEl.innerHTML = photos.map((url, idx) => `
      <div class="pdp-thumb ${idx === activePdpGalleryIndex ? 'active' : ''}" onclick="selectPdpPhoto(${idx})">
        <img src="${escapeHtml(url)}" alt="Thumbnail ${idx + 1}" />
      </div>
    `).join('');
  }

  function selectPdpPhoto(idx) {
    if (!activeExpandedProduct) return;
    activePdpGalleryIndex = idx;
    renderPdpGallery(getProductPhotos(activeExpandedProduct));
  }

  function adjustPdpQty(delta) {
    const input = document.getElementById('pdp-qty');
    const maxStock = Math.max(1, Number(activeExpandedProduct?.stock || 1));
    const next = Math.min(maxStock, Math.max(1, Number(input.value || 1) + delta));
    input.value = next;
  }
