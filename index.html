  /* =========================================================
     2. HELPER UTILITIES & LOCAL EXTRA STORAGE FALLBACK
     ========================================================= */
  function peso(val) {
    const n = Number(val || 0);
    return '₱' + n.toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function escapeHtml(str) {
    return String(str ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function showToast(msg, type = 'success') {
    const box = document.getElementById('toast-container');
    if (!box) return;
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.innerHTML = `<span>${escapeHtml(msg)}</span><button type="button" style="background:transparent;padding:0;color:#fff;font-size:0.9rem;" onclick="this.parentElement.remove()">✕</button>`;
    box.appendChild(el);
    setTimeout(() => { if (el.parentElement) el.remove(); }, 4200);
  }

  function getLocalProductCosts() {
    try { return JSON.parse(localStorage.getItem('mh_product_costs') || '{}'); } catch { return {}; }
  }
  function setLocalProductCost(productId, cost) {
    const map = getLocalProductCosts();
    map[productId] = Number(cost || 0);
    localStorage.setItem('mh_product_costs', JSON.stringify(map));
  }

  function getLocalShopExtras() {
    try { return JSON.parse(localStorage.getItem('mh_shop_extras') || '{}'); } catch { return {}; }
  }
  function setLocalShopExtra(shopId, patch) {
    const map = getLocalShopExtras();
    map[shopId] = { ...(map[shopId] || {}), ...patch };
    localStorage.setItem('mh_shop_extras', JSON.stringify(map));
  }

  function enrichShopData(shop) {
    if (!shop) return shop;
    const extras = getLocalShopExtras()[shop.id] || {};
    const rates = Array.isArray(shop.barangay_rates) && shop.barangay_rates.length
      ? shop.barangay_rates
      : (Array.isArray(extras.barangay_rates) ? extras.barangay_rates : []);
    return {
      ...shop,
      barangay_rates: rates,
      qr_image_url: shop.qr_image_url || extras.qr_image_url || '',
      qr_description: shop.qr_description || extras.qr_description || ''
    };
  }

  function enrichProductData(prod) {
    if (!prod) return prod;
    const localCosts = getLocalProductCosts();
    const cost = prod.cost_price !== undefined && prod.cost_price !== null
      ? Number(prod.cost_price)
      : Number(localCosts[prod.id] || 0);
    return { ...prod, cost_price: cost };
  }

  function normalizeLocationToken(str) {
    return String(str || '')
      .toLowerCase()
      .replace(/\b(brgy|barangay|bgy|sitio|purok|municipality of|city of)\b\.?/g, '')
      .replace(/[^a-z0-9\s]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  /* =========================================================
     3. BARANGAY / LOCATION SHIPPING CALCULATOR
     Matches customer address against Seller's Barangay Rules
     (e.g., Dangay -> Free Shipping or Custom Fee)
     ========================================================= */
  function computeShopShippingForAddress(shop, rawAddress) {
    const s = enrichShopData(shop);
    if (!s) return { matched: false, isFree: true, fee: 0, allowed: true, label: 'Free Shipping' };

    const rates = Array.isArray(s.barangay_rates) ? s.barangay_rates : [];
    const addrClean = normalizeLocationToken(rawAddress);

    if (addrClean && rates.length > 0) {
      for (const r of rates) {
        const brgyClean = normalizeLocationToken(r.barangay);
        if (brgyClean && addrClean.includes(brgyClean)) {
          const isFree = r.mode === 'free' || Number(r.fee || 0) <= 0;
          const fee = isFree ? 0 : Number(r.fee || 0);
          return {
            matched: true,
            barangay: r.barangay,
            isFree,
            fee,
            allowed: true,
            label: isFree ? `Free Shipping (${r.barangay})` : `${peso(fee)} (${r.barangay})`
          };
        }
      }
    }

    // Check general coverage if no specific barangay rule matched
    const areaMode = s.delivery_area_mode || 'specific';
    const areaText = String(s.delivery_area || 'Roxas Only').trim();
    let allowed = true;

    if (addrClean && areaMode === 'specific' && areaText) {
      const areaCore = normalizeLocationToken(areaText.replace(/\bonly\b/gi, ''));
      if (areaCore && !addrClean.includes(areaCore)) {
        allowed = false;
      }
    }

    const defaultFree = s.shipping_mode === 'free' || Number(s.shipping_fee || 0) <= 0;
    const defaultFee = defaultFree ? 0 : Number(s.shipping_fee || 0);

    return {
      matched: false,
      barangay: '',
      isFree: defaultFree,
      fee: defaultFee,
      allowed,
      label: defaultFree ? 'Free Shipping' : `${peso(defaultFee)} (Standard Rate)`
    };
  }

  function formatShopShippingBadgeText(shop) {
    const s = enrichShopData(shop);
    if (!s) return '🚚 Free Shipping';
    const rates = Array.isArray(s.barangay_rates) ? s.barangay_rates : [];
    const freeBrgys = rates.filter(r => r.mode === 'free' || Number(r.fee) <= 0).map(r => r.barangay);

    if (s.shipping_mode === 'free') {
      return '🚚 Free Shipping';
    }
    if (freeBrgys.length > 0) {
      const preview = freeBrgys.slice(0, 2).join(', ');
      return `🚚 Free: ${preview}${freeBrgys.length > 2 ? ' +' : ''}`;
    }
    if (rates.length > 0) {
      const minFee = Math.min(...rates.map(r => Number(r.fee || 0)));
      return `🚚 From ${peso(minFee)}`;
    }
    return `🚚 ${peso(s.shipping_fee || 0)}`;
  }

  /* =========================================================
     4. IMAGE COMPRESSION TO SQUARE 1:1 WEBP
     ========================================================= */
  async function compressImageToWebP(file, maxSize = 720, quality = 0.8) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const side = Math.min(img.width, img.height);
          const sx = (img.width - side) / 2;
          const sy = (img.height - side) / 2;
          const target = Math.min(side, maxSize);
          canvas.width = target;
          canvas.height = target;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, sx, sy, side, side, 0, 0, target, target);
          canvas.toBlob((blob) => {
            if (!blob) return reject(new Error('Image compression failed'));
            resolve({ blob, dataUrl: canvas.toDataURL('image/webp', quality) });
          }, 'image/webp', quality);
        };
        img.onerror = reject;
        img.src = ev.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function uploadImageAsset(file, folder = 'uploads') {
    const { blob, dataUrl } = await compressImageToWebP(file);
    if (!sb) return dataUrl;
    try {
      const filePath = `${folder}/${Date.now()}_${Math.random().toString(36).slice(2, 8)}.webp`;
      const { error } = await sb.storage.from('product-images').upload(filePath, blob, {
        contentType: 'image/webp',
        upsert: true
      });
      if (error) return dataUrl;
      const { data } = sb.storage.from('product-images').getPublicUrl(filePath);
      return data?.publicUrl || dataUrl;
    } catch {
      return dataUrl;
    }
  }

  /* =========================================================
     5. NAVIGATION & VIEW ROUTING
     ========================================================= */
  function switchView(view) {
    const views = ['shop', 'product-detail', 'seller', 'orders', 'admin'];
    views.forEach(v => {
      const el = document.getElementById(`view-${v}`);
      if (el) el.classList.toggle('hidden', v !== view);
    });

    if (view === 'seller') {
      if (!currentUser) {
        openAuthModal('signin');
        switchView('shop');
        return;
      }
      renderSellerCentre();
    } else if (view === 'orders') {
      if (!currentUser) {
        openAuthModal('signin');
        switchView('shop');
        return;
      }
      loadOrders();
    } else if (view === 'admin') {
      if (!currentProfile || currentProfile.role !== 'admin') {
        showToast('Platform Admin access only.', 'error');
        switchView('shop');
        return;
      }
      renderAdminPanel();
    }
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function handleStartSellingClick() {
    if (!currentUser) {
      openAuthModal('register');
      showToast('Create an account or sign in first to open your shop.', 'warning');
      return;
    }
    switchView('seller');
  }

  /* =========================================================
     6. AUTHENTICATION, PROFILE & PASSWORD RECOVERY
     ========================================================= */
  function openAuthModal(tab = 'signin') {
    document.getElementById('auth-modal').classList.remove('hidden');
    switchAuthTab(tab);
  }

  function closeAuthModal() {
    document.getElementById('auth-modal').classList.add('hidden');
  }

  function switchAuthTab(tab) {
    document.getElementById('tab-signin').classList.toggle('active', tab === 'signin');
    document.getElementById('tab-register').classList.toggle('active', tab === 'register');
    document.getElementById('form-signin').classList.toggle('hidden', tab !== 'signin');
    document.getElementById('form-register').classList.toggle('hidden', tab !== 'register');
    document.getElementById('form-forgot').classList.toggle('hidden', tab !== 'forgot');
    document.getElementById('google-oauth-box').classList.toggle('hidden', tab === 'forgot');
    document.getElementById('auth-tabs-bar').classList.toggle('hidden', tab === 'forgot');
    document.getElementById('auth-modal-title').textContent =
      tab === 'register' ? 'Create Your MarketHub Account' :
      tab === 'forgot' ? 'Reset Your Password' : 'Welcome to MarketHub';
  }

  async function signInWithGoogle() {
    if (!sb) {
      showToast('Configure SUPABASE_URL & SUPABASE_ANON_KEY first.', 'warning');
      return;
    }
    const { error } = await sb.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.origin + window.location.pathname }
    });
    if (error) showToast(error.message, 'error');
  }

  async function signIn(e) {
    e.preventDefault();
    if (!sb) return showToast('Configure Supabase credentials in Part 4.', 'warning');
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const btn = document.getElementById('btn-submit-signin');
    btn.disabled = true;
    btn.textContent = 'Signing in...';

    const { error } = await sb.auth.signInWithPassword({ email, password });
    btn.disabled = false;
    btn.textContent = 'Sign In';

    if (error) {
      showToast(error.message, 'error');
    } else {
      closeAuthModal();
      showToast('Welcome back to MarketHub!');
      await bootstrapSession();
    }
  }

  async function signUp(e) {
    e.preventDefault();
    if (!sb) return showToast('Configure Supabase credentials in Part 4.', 'warning');
    const fullName = document.getElementById('reg-name').value.trim();
    const phone = document.getElementById('reg-phone').value.trim();
    const address = document.getElementById('reg-address').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const password = document.getElementById('reg-password').value;

    const btn = document.getElementById('btn-submit-register');
    btn.disabled = true;
    btn.textContent = 'Creating account...';

    const { data, error } = await sb.auth.signUp({
      email,
      password,
      options: { data: { full_name: fullName, phone, address } }
    });

    if (error) {
      btn.disabled = false;
      btn.textContent = 'Complete Registration';
      return showToast(error.message, 'error');
    }

    if (data?.user) {
      await sb.from('profiles').upsert({
        id: data.user.id,
        email,
        full_name: fullName,
        phone,
        address,
        role: 'buyer'
      });
    }

    btn.disabled = false;
    btn.textContent = 'Complete Registration';
    closeAuthModal();
    showToast('Account created! Check your email if confirmation is enabled.');
    await bootstrapSession();
  }

  async function sendPasswordReset(e) {
    e.preventDefault();
    if (!sb) return showToast('Supabase not configured.', 'warning');
    const email = document.getElementById('forgot-email').value.trim();
    const btn = document.getElementById('btn-submit-forgot');
    btn.disabled = true;
    const { error } = await sb.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + window.location.pathname
    });
    btn.disabled = false;
    if (error) showToast(error.message, 'error');
    else {
      showToast('Password reset link sent to your email!');
      switchAuthTab('signin');
    }
  }

  function closeRecoveryModal() {
    document.getElementById('recovery-modal').classList.add('hidden');
  }

  async function completePasswordReset(e) {
    e.preventDefault();
    if (!sb) return;
    const p1 = document.getElementById('recovery-new-password').value;
    const p2 = document.getElementById('recovery-confirm-password').value;
    if (p1 !== p2) return showToast('Passwords do not match.', 'error');

    const { error } = await sb.auth.updateUser({ password: p1 });
    if (error) showToast(error.message, 'error');
    else {
      closeRecoveryModal();
      showToast('Password updated successfully!');
    }
  }

  async function logout() {
    if (sb) await sb.auth.signOut();
    currentUser = null;
    currentProfile = null;
    myShop = null;
    updateAuthUi();
    switchView('shop');
    showToast('Signed out.');
  }

  function openProfileModal() {
    if (!currentUser) return openAuthModal('signin');
    document.getElementById('prof-name').value = currentProfile?.full_name || '';
    document.getElementById('prof-phone').value = currentProfile?.phone || '';
    document.getElementById('prof-address').value = currentProfile?.address || '';
    document.getElementById('prof-email').value = currentUser.email || '';
    document.getElementById('settings-reset-email-label').textContent = currentUser.email || 'your email';
    switchProfileTab('info');
    document.getElementById('profile-modal').classList.remove('hidden');
  }

  function closeProfileModal() {
    document.getElementById('profile-modal').classList.add('hidden');
  }

  function switchProfileTab(tab) {
    document.getElementById('prof-tab-info').classList.toggle('active', tab === 'info');
    document.getElementById('prof-tab-security').classList.toggle('active', tab === 'security');
    document.getElementById('profile-info-form').classList.toggle('hidden', tab !== 'info');
    document.getElementById('profile-security-pane').classList.toggle('hidden', tab !== 'security');

  async function saveUserProfile(e) {
    e.preventDefault();
    if (!sb || !currentUser) return;
    const fullName = document.getElementById('prof-name').value.trim();
    const phone = document.getElementById('prof-phone').value.trim();
    const address = document.getElementById('prof-address').value.trim();

    const { error } = await sb.from('profiles').upsert({
      id: currentUser.id,
      email: currentUser.email,
      full_name: fullName,
      phone,
      address,
      role: currentProfile?.role || 'buyer'
    });

    if (error) return showToast(error.message, 'error');
    currentProfile = { ...(currentProfile || {}), id: currentUser.id, email: currentUser.email, full_name: fullName, phone, address };
    updateAuthUi();
    closeProfileModal();
    showToast('Profile & Barangay shipping address saved!');
  }

  async function updatePasswordFromSettings(e) {
    e.preventDefault();
    if (!sb) return;
    const p1 = document.getElementById('settings-new-pass').value;
    const p2 = document.getElementById('settings-confirm-pass').value;
    if (p1 !== p2) return showToast('Passwords do not match.', 'error');

    const { error } = await sb.auth.updateUser({ password: p1 });
    if (error) showToast(error.message, 'error');
    else {
      document.getElementById('settings-new-pass').value = '';
      document.getElementById('settings-confirm-pass').value = '';
      showToast('Password updated!');
    }
  }

  async function sendResetLinkFromProfileSettings() {
    if (!sb || !currentUser?.email) return;
    const { error } = await sb.auth.resetPasswordForEmail(currentUser.email, {
      redirectTo: window.location.origin + window.location.pathname
    });
    if (error) showToast(error.message, 'error');
    else showToast('Reset link sent to ' + currentUser.email);
  }

  function updateAuthUi() {
    const loggedIn = Boolean(currentUser);
    document.getElementById('btn-login').classList.toggle('hidden', loggedIn);
    document.getElementById('btn-logout').classList.toggle('hidden', !loggedIn);
    document.getElementById('user-pill').classList.toggle('hidden', !loggedIn);
    document.getElementById('btn-orders').classList.toggle('hidden', !loggedIn);
    document.getElementById('btn-live-chat').classList.toggle('hidden', !loggedIn);
    document.getElementById('notif-wrapper').classList.toggle('hidden', !loggedIn);

    const isAdmin = currentProfile?.role === 'admin';
    document.getElementById('btn-admin').classList.toggle('hidden', !isAdmin);

    const hasApprovedShop = myShop && myShop.status === 'approved';
    document.getElementById('btn-seller').classList.toggle('hidden', !loggedIn);
    document.getElementById('btn-header-apply').classList.toggle('hidden', hasApprovedShop);

    if (loggedIn) {
      const displayName = currentProfile?.full_name || currentUser.email?.split('@')[0] || 'User';
      document.getElementById('user-info').textContent = displayName;
      document.getElementById('user-avatar-dot').textContent = displayName.charAt(0).toUpperCase();
      const roleBadge = document.getElementById('role-badge');
      if (isAdmin) {
        roleBadge.textContent = 'Admin';
        roleBadge.className = 'badge admin';
      } else if (hasApprovedShop) {
        roleBadge.textContent = 'Seller';
        roleBadge.className = 'badge seller';
      } else {
        roleBadge.textContent = 'Buyer';
        roleBadge.className = 'badge';
      }
    }
    updateCartBadge();
  }

  /* =========================================================
     7. DATA LOADING (SHOPS, PRODUCTS, ORDERS, REVIEWS, NOTIFS)
     ========================================================= */
  async function bootstrapSession() {
    if (!sb) {
      updateAuthUi();
      renderMarketplace();
      return;
    }

    const { data: { session } } = await sb.auth.getSession();
    currentUser = session?.user || null;

    if (currentUser) {
      const { data: prof } = await sb.from('profiles').select('*').eq('id', currentUser.id).maybeSingle();
      if (prof) {
        currentProfile = prof;
      } else {
        const meta = currentUser.user_metadata || {};
        currentProfile = {
          id: currentUser.id,
          email: currentUser.email,
          full_name: meta.full_name || currentUser.email.split('@')[0],
          phone: meta.phone || '',
          address: meta.address || '',
          role: 'buyer'
        };
        await sb.from('profiles').upsert(currentProfile);
      }
    } else {
      currentProfile = null;
      myShop = null;
    }

    await loadMarketplaceData();
    if (currentUser) {
      await Promise.all([loadOrders(), loadNotifications(), loadChatMessages(false)]);
    }
    updateAuthUi();
    renderMarketplace();
  }

  async function loadMarketplaceData() {
    if (!sb) return;
    const [shopsRes, prodsRes, revRes] = await Promise.all([
      sb.from('shops').select('*').order('created_at', { ascending: false }),
      sb.from('products').select('*').order('created_at', { ascending: false }),
      sb.from('reviews').select('*').order('created_at', { ascending: false })
    ]);

    allShops = (shopsRes.data || []).map(enrichShopData);
    allProducts = (prodsRes.data || []).map(enrichProductData);
    allReviews = revRes.data || [];

    if (currentUser) {
      myShop = allShops.find(s => s.owner_id === currentUser.id) || null;
    } else {
      myShop = null;
    }

    if (currentProfile?.role === 'admin') {
      const { data: sett } = await sb.from('commission_settlements').select('*');
      commissionSettlements = sett || [];
    }
  }

  /* =========================================================
     8. MARKETPLACE CATALOG, FILTERS & EXPANDED PRODUCT PAGE
     ========================================================= */
  function resetPaginationAndRender() {
    visibleProductLimit = PAGE_SIZE;
    renderMarketplace();
  }

  function resetMarketplaceFilters() {
    activeShopFilter = 'all';
    activeCategoryFilter = 'all';
    filterInStockOnly = false;
    filterFreeShipOnly = false;
    filterRoxasOnly = false;
    activeSortMode = 'popular';
    document.getElementById('search-input').value = '';
    document.getElementById('filter-instock').checked = false;
    document.getElementById('filter-freeship').checked = false;
    document.getElementById('filter-roxas').checked = false;
    document.getElementById('sort-price-select').value = '';
    document.querySelectorAll('.sort-btn').forEach(b => b.classList.toggle('active', b.dataset.sort === 'popular'));
    syncCategoryPillsUi();
    resetPaginationAndRender();
  }

  function quickSearchKeyword(kw) {
    document.getElementById('search-input').value = kw;
    switchView('shop');
    resetPaginationAndRender();
  }

  function quickBrowseCategory(cat) {
    setCategoryFilter(cat);
    switchView('shop');
    document.getElementById('product-grid').scrollIntoView({ behavior: 'smooth' });
  }

  function setShopFilter(shopId) {
    activeShopFilter = shopId;
    resetPaginationAndRender();
  }

  function setCategoryFilter(cat) {
    activeCategoryFilter = cat;
    syncCategoryPillsUi();
    resetPaginationAndRender();
  }

  function syncCategoryPillsUi() {
    document.querySelectorAll('.sidebar-cat-item, .mobile-cat-pill').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.cat === activeCategoryFilter);
    });
  }

  function toggleStockFilter() {
    filterInStockOnly = document.getElementById('filter-instock').checked;
    resetPaginationAndRender();
  }

  function toggleFreeShipFilter() {
    filterFreeShipOnly = document.getElementById('filter-freeship').checked;
    resetPaginationAndRender();
  }

  function toggleRoxasFilter() {
    filterRoxasOnly = document.getElementById('filter-roxas').checked;
    resetPaginationAndRender();
  }

  function setSortMode(mode) {

    document.querySelectorAll('.sort-btn').forEach(b => b.classList.toggle('active', b.dataset.sort === mode));
    resetPaginationAndRender();

  function setPriceSort(val) {
    if (!val) return;
    activeSortMode = val;
    document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
    resetPaginationAndRender();

  function loadMoreProducts() {
    visibleProductLimit += PAGE_SIZE;
    renderMarketplace();
  }

  function renderMarketplace() {
    const approvedShops = allShops.filter(s => s.status === 'approved');
    const approvedShopMap = new Map(approvedShops.map(s => [s.id, s]));

    document.getElementById('shops-count').textContent = approvedShops.length;
    document.getElementById('btn-clear-shop-filter').classList.toggle('hidden', activeShopFilter === 'all');

    const shopsStrip = document.getElementById('shops-list-pills');
    if (approvedShops.length === 0) {
      shopsStrip.innerHTML = `<div style="font-size:0.82rem; color:var(--muted); padding:0.4rem;">No verified shops yet. Be the first to open a shop!</div>`;
    } else {
      shopsStrip.innerHTML = approvedShops.map(shop => {
        const count = allProducts.filter(p => p.shop_id === shop.id).length;
        return `
          <div class="mall-shop-tile ${activeShopFilter === shop.id ? 'active' : ''}" onclick="setShopFilter('${shop.id}')">
            <div class="mall-shop-logo">${escapeHtml((shop.name || 'S').charAt(0).toUpperCase())}</div>
            <div class="mall-shop-name">${escapeHtml(shop.name)}</div>
            <div class="mall-shop-meta">${count} items • ${escapeHtml(shop.category || 'Store')}</div>
          </div>
        `;
      }).join('');
    }

    // Selected Shop Banner
    const banner = document.getElementById('selected-shop-banner');
    if (activeShopFilter !== 'all' && approvedShopMap.has(activeShopFilter)) {
      const sh = approvedShopMap.get(activeShopFilter);
      const shopProds = allProducts.filter(p => p.shop_id === sh.id);
      const totalSold = shopProds.reduce((sum, p) => sum + Number(p.sold_count || 0), 0);
      document.getElementById('banner-shop-name').textContent = sh.name;
      document.getElementById('banner-shop-category').textContent = sh.category || 'Store';
      document.getElementById('banner-shop-shipping').textContent = formatShopShippingBadgeText(sh);
      document.getElementById('banner-shop-area').textContent = `📍 ${sh.delivery_area_mode === 'all' ? 'All Areas' : (sh.delivery_area || 'Roxas Only')}`;
      document.getElementById('banner-shop-desc').textContent = sh.description || '';
      document.getElementById('banner-shop-products').textContent = shopProds.length;
      document.getElementById('banner-shop-sold').textContent = totalSold;
      document.getElementById('btn-banner-chat-shop').onclick = () => openChatModal(sh.id, sh.name);
      banner.classList.remove('hidden');
    } else {
      banner.classList.add('hidden');
    }

    // Filter Products
    const q = (document.getElementById('search-input').value || '').trim().toLowerCase();
    let list = allProducts.filter(p => approvedShopMap.has(p.shop_id));

    if (activeShopFilter !== 'all') {
      list = list.filter(p => p.shop_id === activeShopFilter);
    }
    if (activeCategoryFilter !== 'all') {
      list = list.filter(p => p.category === activeCategoryFilter);
    }
    if (filterInStockOnly) {
      list = list.filter(p => Number(p.stock || 0) > 0);
    }
    if (filterFreeShipOnly) {
      list = list.filter(p => {
        const sh = approvedShopMap.get(p.shop_id);
        if (!sh) return false;
        const hasBrgyFree = (sh.barangay_rates || []).some(r => r.mode === 'free' || Number(r.fee) <= 0);
        return sh.shipping_mode === 'free' || Number(sh.shipping_fee || 0) === 0 || hasBrgyFree;
      });
    }
    if (filterRoxasOnly) {
      list = list.filter(p => {
        const sh = approvedShopMap.get(p.shop_id);
        return sh && ((sh.delivery_area || '').toLowerCase().includes('roxas') || sh.delivery_area_mode === 'all');
      });
    }
    if (q) {
      list = list.filter(p => {
        const sh = approvedShopMap.get(p.shop_id);
        const brgyNames = (sh?.barangay_rates || []).map(r => r.barangay).join(' ').toLowerCase();
        const shipTag = sh?.shipping_mode === 'free' ? 'free shipping' : '';
        return (
          (p.name || '').toLowerCase().includes(q) ||
          (p.description || '').toLowerCase().includes(q) ||
          (p.category || '').toLowerCase().includes(q) ||
          (sh?.name || '').toLowerCase().includes(q) ||
          (sh?.delivery_area || '').toLowerCase().includes(q) ||
          brgyNames.includes(q) ||
          shipTag.includes(q)
        );
      });
    }

    // Sort
    if (activeSortMode === 'latest') {
      list.sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
    } else if (activeSortMode === 'topsales') {
      list.sort((a, b) => Number(b.sold_count || 0) - Number(a.sold_count || 0));
    } else if (activeSortMode === 'price_asc') {
      list.sort((a, b) => Number(a.price || 0) - Number(b.price || 0));
    } else if (activeSortMode === 'price_desc') {
      list.sort((a, b) => Number(b.price || 0) - Number(a.price || 0));
    } else {
      list.sort((a, b) => (Number(b.sold_count || 0) * 2 + Number(b.stock || 0)) - (Number(a.sold_count || 0) * 2 + Number(a.stock || 0)));
    }

    document.getElementById('catalog-result-count').textContent = `${list.length} product${list.length === 1 ? '' : 's'}`;

    const grid = document.getElementById('product-grid');
    if (list.length === 0) {
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">No matching products found. Try clearing your filters or searching another keyword.</div>`;
      document.getElementById('load-more-wrap').classList.add('hidden');
      return;
    }

    const sliced = list.slice(0, visibleProductLimit);
    grid.innerHTML = sliced.map(p => {
      const sh = approvedShopMap.get(p.shop_id) || {};
      const imgs = Array.isArray(p.images) && p.images.length ? p.images : [p.image_url || 'https://placehold.co/400x400/dcfce7/14532d?text=MarketHub'];
      const outOfStock = Number(p.stock || 0) <= 0;
      const shipLabel = formatShopShippingBadgeText(sh);

      return `
        <article class="card" onclick="openExpandedProduct('${p.id}')">
          <div class="card-img-wrap">
            <img src="${escapeHtml(imgs[0])}" alt="${escapeHtml(p.name)}" loading="lazy" />
            <span class="card-mall-tag">Verified</span>
            <span class="card-top-badge ${outOfStock ? 'soldout' : ''}">
              ${outOfStock ? 'SOLD OUT' : `${p.stock} left`}
            </span>
            <div class="card-bottom-overlay">${escapeHtml(shipLabel)}</div>
          </div>
          <div class="card-pure-body">
            <h3 class="card-pure-title">${escapeHtml(p.name)}</h3>
            <div class="card-pure-tags">
              <span class="mini-tag-green">${escapeHtml(sh.name || 'Shop')}</span>
              ${sh.qr_image_url ? `<span class="mini-tag-outline">QR Pay</span>` : ''}
            </div>
            <div class="card-pure-footer">
              <span class="card-pure-price">${peso(p.price)}</span>
              <span class="card-pure-sold">${Number(p.sold_count || 0)} sold</span>
            </div>
          </div>
        </article>
      `;
    }).join('');

    const remaining = list.length - sliced.length;
    document.getElementById('load-more-wrap').classList.toggle('hidden', remaining <= 0);
    document.getElementById('remaining-products-count').textContent = remaining;
  }

  function openExpandedProduct(productId) {
    const prod = allProducts.find(p => p.id === productId);
    if (!prod) return;
    activePdpProductId = productId;
    activeReviewStarFilter = 'all';

    const shop = allShops.find(s => s.id === prod.shop_id) || {};
    const imgs = Array.isArray(prod.images) && prod.images.length ? prod.images : [prod.image_url || 'https://placehold.co/500x500/dcfce7/14532d?text=MarketHub'];
    const prodReviews = allReviews.filter(r => r.product_id === prod.id);
    const avgRating = prodReviews.length
      ? (prodReviews.reduce((s, r) => s + Number(r.rating || 5), 0) / prodReviews.length).toFixed(1)
      : '5.0';

    document.getElementById('pdp-crumb-cat').textContent = prod.category || 'General';
    document.getElementById('pdp-crumb-title').textContent = prod.name;
    document.getElementById('pdp-main-img').src = imgs[0];

    document.getElementById('pdp-thumbs').innerHTML = imgs.map((url, idx) => `
      <div class="pdp-thumb ${idx === 0 ? 'active' : ''}" onclick="document.getElementById('pdp-main-img').src='${escapeHtml(url)}'; document.querySelectorAll('.pdp-thumb').forEach((t,i)=>t.classList.toggle('active', i===${idx}))">
        <img src="${escapeHtml(url)}" alt="Thumb ${idx + 1}" />
      </div>
    `).join('');

    document.getElementById('pdp-title').textContent = prod.name;
    document.getElementById('pdp-rating-avg').textContent = avgRating;
    document.getElementById('pdp-review-count').textContent = prodReviews.length;
    document.getElementById('pdp-sold-count').textContent = Number(prod.sold_count || 0);
    document.getElementById('pdp-price').textContent = peso(prod.price);

    const brgySummary = (shop.barangay_rates || []).length
      ? shop.barangay_rates.map(r => `${r.barangay}: ${r.mode === 'free' || Number(r.fee) <= 0 ? 'FREE' : peso(r.fee)}`).join(' • ')
      : (shop.shipping_mode === 'free' ? 'Free Shipping' : `${peso(shop.shipping_fee || 0)} Standard Delivery`);

    document.getElementById('pdp-ship-pill').textContent = formatShopShippingBadgeText(shop);
    document.getElementById('pdp-area-pill').textContent = `📍 ${shop.delivery_area_mode === 'all' ? 'All Areas' : (shop.delivery_area || 'Roxas Only')}`;
    document.getElementById('pdp-payment-info').textContent = shop.qr_image_url
      ? '💵 Cash on Delivery (COD) & 📱 Scan E-Wallet QR'
      : '💵 Cash on Delivery (COD)';
    document.getElementById('pdp-shipping-info').textContent = brgySummary;
    document.getElementById('pdp-area-info').textContent = shop.delivery_area_mode === 'all' ? 'All Areas / Province-Wide' : (shop.delivery_area || 'Roxas Only');

    const qtyInput = document.getElementById('pdp-qty');
    qtyInput.value = 1;
    qtyInput.max = Math.max(1, Number(prod.stock || 0));
    document.getElementById('pdp-stock-text').textContent = `${prod.stock} pieces available`;

    const out = Number(prod.stock || 0) <= 0;
    const addBtn = document.getElementById('pdp-add-btn');
    const buyBtn = document.getElementById('pdp-buy-btn');
    addBtn.disabled = out;
    buyBtn.disabled = out;
    addBtn.onclick = () => addToCart(prod.id, Number(qtyInput.value || 1));
    buyBtn.onclick = () => startExpressBuyNow(prod.id, Number(qtyInput.value || 1));
    document.getElementById('pdp-chat-btn').onclick = () => openChatModal(shop.id, shop.name);

    // Shop Bar
    const shopProds = allProducts.filter(p => p.shop_id === shop.id);
    const shopTotalSold = shopProds.reduce((s, p) => s + Number(p.sold_count || 0), 0);
    document.getElementById('pdp-shop-avatar').textContent = (shop.name || 'S').charAt(0).toUpperCase();
    document.getElementById('pdp-shop-name').textContent = shop.name || 'Verified Shop';
    document.getElementById('pdp-shop-desc-short').textContent = shop.description || 'Verified MarketHub Store';
    document.getElementById('pdp-shop-prod-count').textContent = shopProds.length;
    document.getElementById('pdp-shop-total-sold').textContent = shopTotalSold;
    document.getElementById('pdp-shop-area-stat').textContent = shop.delivery_area_mode === 'all' ? 'All Areas' : (shop.delivery_area || 'Roxas Only');
    document.getElementById('pdp-shop-ship-stat').textContent = shop.shipping_mode === 'free' ? 'Free' : peso(shop.shipping_fee || 0);
    document.getElementById('pdp-shop-chat-btn').onclick = () => openChatModal(shop.id, shop.name);
    document.getElementById('pdp-view-shop-btn').onclick = () => {
      setShopFilter(shop.id);
      switchView('shop');
    };

    // Specs & Description
    document.getElementById('pdp-spec-cat').textContent = prod.category || 'General Merchandise';
    document.getElementById('pdp-spec-stock').textContent = out ? 'OUT OF STOCK' : `${prod.stock} available`;
    document.getElementById('pdp-spec-area').textContent = shop.delivery_area_mode === 'all' ? 'All Areas' : (shop.delivery_area || 'Roxas Only');
    document.getElementById('pdp-spec-ship').textContent = brgySummary;
    document.getElementById('pdp-spec-shop').textContent = shop.name || 'MarketHub Store';
    document.getElementById('pdp-description').textContent = prod.description || 'Fresh quality product from our verified local shop.';

    // Reviews & Top Picks
    document.getElementById('pdp-overview-score').textContent = avgRating;
    renderPdpReviews();
    renderPdpTopPicks(shop.id, prod.id);

    switchView('product-detail');
  }

  function adjustPdpQty(delta) {
    const input = document.getElementById('pdp-qty');
    const max = Number(input.max || 99);
    const next = Math.min(max, Math.max(1, Number(input.value || 1) + delta));
    input.value = next;
  }

    activeReviewStarFilter = star;
    document.querySelectorAll('.rating-filter-btn').forEach(b => {
      b.classList.toggle('active', String(b.dataset.star) === String(star));
    });
    renderPdpReviews();
  }

    selectedReviewStar = n;
    document.querySelectorAll('#star-picker .star-btn').forEach((btn, idx) => {
      btn.classList.toggle('selected', idx < n);

  function renderPdpReviews() {
    if (!activePdpProductId) return;
    const revForm = document.getElementById('review-form');
    const canReview = Boolean(currentUser);
    revForm.classList.toggle('hidden', !canReview);
    if (canReview) {
      document.getElementById('review-eligibility-note').textContent = `Posting as ${currentProfile?.full_name || currentUser.email}`;
    }

    let list = allReviews.filter(r => r.product_id === activePdpProductId);
    if (activeReviewStarFilter !== 'all') {
      list = list.filter(r => Number(r.rating) === Number(activeReviewStarFilter));

    if (list.length === 0) {
      container.innerHTML = `<div style="font-size:0.83rem; color:var(--muted); padding:0.75rem 0;">No ratings yet for this filter.</div>`;
      return;

    container.innerHTML = list.map(r => `

          <strong style="font-size:0.84rem;">${escapeHtml(r.buyer_name || 'Verified Buyer')}</strong>
          <span style="font-size:0.72rem; color:var(--muted);">${new Date(r.created_at || Date.now()).toLocaleDateString()}</span>
        </div>
        <div style="color:#f59e0b; font-size:0.85rem; margin:0.15rem 0;">${'★'.repeat(Number(r.rating || 5))}${'☆'.repeat(5 - Number(r.rating || 5))}</div>
        <div style="font-size:0.84rem; color:var(--text-secondary);">${escapeHtml(r.comment || '')}</div>

  async function submitProductReview(e) {
    e.preventDefault();
    if (!sb || !currentUser || !activePdpProductId) return;
    const comment = document.getElementById('review-comment').value.trim();
    if (!comment) return;

    const { error } = await sb.from('reviews').insert({
      product_id: activePdpProductId,
      buyer_id: currentUser.id,
      buyer_name: currentProfile?.full_name || currentUser.email.split('@')[0],
      rating: selectedReviewStar,
      comment
    });

    if (error) return showToast(error.message, 'error');
    document.getElementById('review-comment').value = '';
    showToast('Thank you for your review!');
    await loadMarketplaceData();
    renderPdpReviews();
  }

  function renderPdpTopPicks(shopId, excludeProdId) {
    const picks = allProducts.filter(p => p.shop_id === shopId && p.id !== excludeProdId).slice(0, 4);

      box.innerHTML = `<div style="font-size:0.78rem; color:var(--muted);">No other items in this shop yet.</div>`;

        <div class="top-pick-item" onclick="openExpandedProduct('${p.id}')">
          <img src="${escapeHtml(img)}" alt="${escapeHtml(p.name)}" />
          <div class="top-pick-name">${escapeHtml(p.name)}</div>

  async function submitShopApplication(e) {
    e.preventDefault();
    if (!sb || !currentUser) return showToast('Please sign in first.', 'warning');

    const btn = document.getElementById('btn-create-shop');
    btn.disabled = true;
    btn.textContent = 'Submitting Application...';

    try {
      const idFile = document.getElementById('new-shop-id-file').files[0];
      if (!idFile) throw new Error('Please upload a Valid ID or Physical Store proof photo.');
      const proofUrl = await uploadImageAsset(idFile, 'shop-proofs');

      let qrUrl = '';
      const qrFile = document.getElementById('new-shop-qr-file').files[0];
      if (qrFile) {
        qrUrl = await uploadImageAsset(qrFile, 'shop-qr');
      }
      const qrDesc = document.getElementById('new-shop-qr-desc').value.trim();

      const shipMode = document.getElementById('new-shop-ship-mode').value;
      const shipFee = shipMode === 'free' ? 0 : Number(document.getElementById('new-shop-ship-fee').value || 0);
      const areaMode = document.getElementById('new-shop-area-mode').value;
      const areaText = areaMode === 'all' ? 'All Areas' : document.getElementById('new-shop-area-text').value.trim();

      const payload = {
        owner_id: currentUser.id,
        name: document.getElementById('new-shop-name').value.trim(),
        category: document.getElementById('new-shop-category').value,
        phone: document.getElementById('new-shop-phone').value.trim(),
        pickup_address: document.getElementById('new-shop-address').value.trim(),
        description: document.getElementById('new-shop-desc').value.trim(),
        shipping_mode: shipMode,
        shipping_fee: shipFee,
        delivery_area_mode: areaMode,
        delivery_area: areaText,
        qr_image_url: qrUrl,
        qr_description: qrDesc,
        barangay_rates: [],
        id_proof_url: proofUrl,
        status: 'pending'
      };

      let { data, error } = await sb.from('shops').insert(payload).select().single();
      if (error && /column .* does not exist/i.test(error.message)) {
        const fallbackPayload = { ...payload };
        delete fallbackPayload.qr_image_url;
        delete fallbackPayload.qr_description;
        delete fallbackPayload.barangay_rates;
        const retry = await sb.from('shops').insert(fallbackPayload).select().single();
        data = retry.data;
        error = retry.error;
      }

      if (error) throw error;
      if (data?.id) {
        setLocalShopExtra(data.id, { qr_image_url: qrUrl, qr_description: qrDesc, barangay_rates: [] });
      }

      showToast('Shop application submitted! Awaiting Platform Admin approval.');
      await loadMarketplaceData();
      renderSellerCentre();
    } catch (err) {
      showToast(err.message || 'Failed to submit application.', 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Submit Shop Application for Admin Approval';
    }
  }

  async function resubmitRejectedShop(e) {
    e.preventDefault();
    if (!sb || !myShop) return;
    let proofUrl = myShop.id_proof_url;
    const file = document.getElementById('resub-shop-id-file').files[0];
    if (file) proofUrl = await uploadImageAsset(file, 'shop-proofs');

    const { error } = await sb.from('shops').update({
      name: document.getElementById('resub-shop-name').value.trim(),
      phone: document.getElementById('resub-shop-phone').value.trim(),
      pickup_address: document.getElementById('resub-shop-address').value.trim(),
      description: document.getElementById('resub-shop-desc').value.trim(),
      id_proof_url: proofUrl,
      status: 'pending',
      admin_note: null
    }).eq('id', myShop.id);

    if (error) return showToast(error.message, 'error');
    showToast('Re-submitted for Admin review!');
    await loadMarketplaceData();
    renderSellerCentre();
  }

  function renderSellerCentre() {
    const createPanel = document.getElementById('create-shop-panel');
    const gatePanel = document.getElementById('shop-status-gate-panel');
    const dashPanel = document.getElementById('seller-dashboard-panel');

    createPanel.classList.add('hidden');
    gatePanel.classList.add('hidden');
    dashPanel.classList.add('hidden');

    if (!myShop) {
      createPanel.classList.remove('hidden');
      if (currentProfile?.phone) document.getElementById('new-shop-phone').value = currentProfile.phone;
      if (currentProfile?.address) document.getElementById('new-shop-address').value = currentProfile.address;
      return;
    }

    myShop = enrichShopData(myShop);

    if (myShop.status !== 'approved') {
      gatePanel.classList.remove('hidden');
      const isRejected = myShop.status === 'rejected';
      document.getElementById('gate-icon').textContent = isRejected ? '⚠️' : '⏳';
      document.getElementById('gate-title').textContent = isRejected
        ? 'Shop Application Needs Revision'
        : 'Shop Application Pending Admin Approval';
      document.getElementById('gate-message').textContent = isRejected
        ? 'Please review the Platform Admin note below, update your shop details, and re-submit.'
        : `Your shop "${myShop.name}" is currently under verification by the Platform Admin. Once approved, your Seller Centre tools will unlock automatically.`;

      const noteBox = document.getElementById('gate-admin-note');
      if (myShop.admin_note) {
        noteBox.textContent = `Admin Note: ${myShop.admin_note}`;
        noteBox.classList.remove('hidden');
      } else {
        noteBox.classList.add('hidden');
      }

      const resubForm = document.getElementById('resubmit-shop-form');
      resubForm.classList.toggle('hidden', !isRejected);
      if (isRejected) {
        document.getElementById('resub-shop-name').value = myShop.name || '';
        document.getElementById('resub-shop-phone').value = myShop.phone || '';
        document.getElementById('resub-shop-address').value = myShop.pickup_address || '';
        document.getElementById('resub-shop-desc').value = myShop.description || '';
      }
      return;
    }

    // Approved Seller Centre
    dashPanel.classList.remove('hidden');
    populateSellerHomeAndShippingFields();
    renderSellerIncomeMonitoring();
    renderSellerProductsTable();
    renderPhotoSlots();
    switchSellerTab(activeSellerTab);
  }

  /* ----- SELLER TAB 1: MY HOME ----- */
  function populateSellerHomeAndShippingFields() {
    if (!myShop) return;
    const shopOrders = allOrders.filter(o => o.shop_id === myShop.id);

  function computeSellerProfitMetrics(monthStr, allMonths = false) {
    if (!myShop) {
      return {
        validOrders: 0, grossTotal: 0, shippingTotal: 0, productSales: 0,
        puhunanTotal: 0, adminFeeTotal: 0, netProfit: 0, adminPaid: 0, adminUnpaid: 0
      };
    }

    const prodMap = new Map(allProducts.map(p => [p.id, enrichProductData(p)]));
    const shopOrders = allOrders.filter(o => {
      if (o.shop_id !== myShop.id || o.status === 'cancelled') return false;
      if (allMonths) return true;
      return String(o.created_at || '').slice(0, 7) === monthStr;
    });

    let grossTotal = 0;
    let shippingTotal = 0;
    let productSales = 0;
    let puhunanTotal = 0;

    shopOrders.forEach(o => {
      const total = Number(o.total_amount || 0);
      const ship = Number(o.shipping_fee || 0);
      const itemsSubtotal = Math.max(0, total - ship);

      grossTotal += total;
      shippingTotal += ship;
      productSales += itemsSubtotal;

      const items = Array.isArray(o.items) ? o.items : [];
      items.forEach(it => {
        const qty = Number(it.qty || 1);
        const unitCost = it.cost_price !== undefined && it.cost_price !== null
          ? Number(it.cost_price)
          : Number(prodMap.get(it.product_id)?.cost_price || 0);
        puhunanTotal += unitCost * qty;
      });
    });

    const adminFeeTotal = productSales * COMMISSION_RATE;
    const netProfit = productSales - puhunanTotal - adminFeeTotal;

    const settledMonths = new Set(
      commissionSettlements
        .filter(s => s.shop_id === myShop.id && s.settled)
        .map(s => s.month)
    );

    let adminPaid = 0;
    if (!allMonths && settledMonths.has(monthStr)) {
      adminPaid = adminFeeTotal;
    } else if (allMonths) {
      // Sum settled months
      const byMonth = {};
      shopOrders.forEach(o => {
        const m = String(o.created_at || '').slice(0, 7);
        const itemsSub = Math.max(0, Number(o.total_amount || 0) - Number(o.shipping_fee || 0));
        byMonth[m] = (byMonth[m] || 0) + itemsSub * COMMISSION_RATE;
      });
      Object.entries(byMonth).forEach(([m, fee]) => {
        if (settledMonths.has(m)) adminPaid += fee;
      });
    }

    const adminUnpaid = Math.max(0, adminFeeTotal - adminPaid);

    return {
      validOrders: shopOrders.length,
      grossTotal,
      shippingTotal,
      productSales,
      puhunanTotal,
      adminFeeTotal,
      netProfit,
      adminPaid,
      adminUnpaid
    };
  }

  function renderSellerIncomeMonitoring() {
    if (!myShop) return;
    const monthInput = document.getElementById('seller-finance-month');
    if (!monthInput.value) monthInput.value = sellerSelectedMonth;

    const m = computeSellerProfitMetrics(sellerSelectedMonth, sellerShowAllMonths);

    document.getElementById('seller-kpi-net-profit').textContent = peso(m.netProfit);
    document.getElementById('seller-kpi-prod-sales').textContent = peso(m.productSales);
    document.getElementById('seller-kpi-order-count').textContent = `${m.validOrders} valid order${m.validOrders === 1 ? '' : 's'} ${sellerShowAllMonths ? '(All Months)' : `(${sellerSelectedMonth})`}`;
    document.getElementById('seller-kpi-puhunan').textContent = peso(m.puhunanTotal);
    document.getElementById('seller-kpi-admin-unpaid').textContent = peso(m.adminUnpaid);
    document.getElementById('seller-kpi-admin-total').textContent = peso(m.adminFeeTotal);

    // Deduction Breakdown Ledger
    document.getElementById('ledger-gross-total').textContent = peso(m.grossTotal);
    document.getElementById('ledger-less-shipping').textContent = `−${peso(m.shippingTotal)}`;
    document.getElementById('ledger-product-sales').textContent = peso(m.productSales);
    document.getElementById('ledger-less-puhunan').textContent = `−${peso(m.puhunanTotal)}`;
    document.getElementById('ledger-less-admin').textContent = `−${peso(m.adminFeeTotal)}`;
    document.getElementById('ledger-net-profit').textContent = peso(m.netProfit);
    document.getElementById('seller-kpi-admin-paid').textContent = peso(m.adminPaid);
    document.getElementById('seller-kpi-fee-status').textContent = m.adminUnpaid > 0
      ? `Payable to Admin: ${peso(m.adminUnpaid)}`
      : '✓ All Admin Fees Settled';

    // Render Chart.js Pie Chart
    renderSellerIncomePieChart(m);

    // Render Monthly History Table
    const monthsSet = new Set([sellerSelectedMonth]);
    allOrders.filter(o => o.shop_id === myShop.id && o.status !== 'cancelled').forEach(o => {
      if (o.created_at) monthsSet.add(String(o.created_at).slice(0, 7));
    });
    const sortedMonths = Array.from(monthsSet).sort().reverse();

    const tbody = document.getElementById('seller-monthly-history-tbody');
    tbody.innerHTML = sortedMonths.map(mo => {
      const row = computeSellerProfitMetrics(mo, false);
      const settled = row.adminFeeTotal > 0 && row.adminUnpaid === 0;
      return `
        <tr>
          <td><strong>${escapeHtml(mo)}</strong></td>
          <td>${row.validOrders}</td>
          <td>${peso(row.productSales)}</td>
          <td style="color:#475569;">−${peso(row.puhunanTotal)}</td>
          <td style="color:#b45309;">−${peso(row.adminFeeTotal)}</td>
          <td style="color:#0369a1;">${peso(row.shippingTotal)}</td>
          <td><strong style="color:var(--primary-dark);">${peso(row.netProfit)}</strong></td>
          <td>
            <span class="badge ${settled ? 'status-approved' : (row.adminFeeTotal === 0 ? '' : 'status-pending')}">
              ${row.adminFeeTotal === 0 ? 'No Fee' : (settled ? '✓ Paid' : 'Unpaid')}
            </span>
          </td>
        </tr>
      `;
    }).join('');
  }

  function renderSellerIncomePieChart(metrics) {
    const canvas = document.getElementById('seller-income-pie-chart');
    if (!canvas || !window.Chart) return;

    if (sellerPieChartInstance) {
      sellerPieChartInstance.destroy();
      sellerPieChartInstance = null;
    }

    const profitVal = Math.max(0, Number(metrics.netProfit || 0));
    const puhunanVal = Math.max(0, Number(metrics.puhunanTotal || 0));
    const adminVal = Math.max(0, Number(metrics.adminFeeTotal || 0));
    const shipVal = Math.max(0, Number(metrics.shippingTotal || 0));
    const hasData = (profitVal + puhunanVal + adminVal + shipVal) > 0;

    sellerPieChartInstance = new Chart(canvas.getContext('2d'), {
      type: 'doughnut',
      data: {
        labels: hasData
          ? ['Net Profit (Kita)', 'Puhunan (Capital)', '10% Admin Fee', 'Shipping Fee (Separate)']
          : ['No Sales Data Yet'],
        datasets: [{
          data: hasData ? [profitVal, puhunanVal, adminVal, shipVal] : [1],
          backgroundColor: hasData
            ? ['#16a34a', '#64748b', '#f59e0b', '#0ea5e9']
            : ['#e2e8f0'],
          borderWidth: 2,
          borderColor: '#ffffff'
        }]
      },
      options: {
        responsive: true,
        cutout: '56%',
        plugins: {
          legend: {
            position: 'bottom',
            labels: { boxWidth: 12, font: { size: 11, weight: '600' } }
          },
          tooltip: {
            callbacks: {
              label: (ctx) => hasData ? ` ${ctx.label}: ${peso(ctx.raw)}` : ' No sales recorded for this period'
            }
          }
        }
      }
    });
  }

  async function saveProduct(e) {
    e.preventDefault();
    if (!sb || !myShop) return;

    const btn = document.getElementById('btn-save-product');
    btn.disabled = true;
    btn.textContent = 'Saving...';

    try {
      const editId = document.getElementById('edit-prod-id').value;
      const validImgs = productPhotoSlots.filter(Boolean);
      const costPrice = Number(document.getElementById('p-cost').value || 0);
      const retailPrice = Number(document.getElementById('p-price').value || 0);

      const payload = {
        shop_id: myShop.id,
        name: document.getElementById('p-name').value.trim(),
        category: document.getElementById('p-category').value,
        stock: Number(document.getElementById('p-stock').value || 0),
        cost_price: costPrice,
        price: retailPrice,
        description: document.getElementById('p-desc').value.trim(),
        images: validImgs,
        image_url: validImgs[0] || null
      };

      let savedId = editId;
      let error = null;

      if (editId) {
        let res = await sb.from('products').update(payload).eq('id', editId);
        if (res.error && /column "cost_price"/i.test(res.error.message)) {
          const fallback = { ...payload };
          delete fallback.cost_price;
          res = await sb.from('products').update(fallback).eq('id', editId);
        }
        error = res.error;
      } else {
        let res = await sb.from('products').insert(payload).select().single();
        if (res.error && /column "cost_price"/i.test(res.error.message)) {
          const fallback = { ...payload };
          delete fallback.cost_price;
          res = await sb.from('products').insert(fallback).select().single();
        }
        error = res.error;
        savedId = res.data?.id;
      }

      if (error) throw error;
      if (savedId) setLocalProductCost(savedId, costPrice);

      showToast(editId ? 'Product updated!' : 'Product published to MarketHub!');
      resetProductForm();
      await loadMarketplaceData();
      renderSellerProductsTable();
      renderMarketplace();
    } catch (err) {
      showToast(err.message || 'Failed to save product.', 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = document.getElementById('edit-prod-id').value ? 'Update Product' : 'Publish Product';
    }
  }

  async function deleteProduct(prodId) {
    if (!sb || !confirm('Delete this product from your shop?')) return;
    const { error } = await sb.from('products').delete().eq('id', prodId);
    if (error) return showToast(error.message, 'error');
    showToast('Product deleted.');
    await loadMarketplaceData();
    renderSellerProductsTable();
    renderMarketplace();
  }

    tbody.innerHTML = prods.map(p => {
      const retail = Number(p.price || 0);

      const unitProfit = retail - cost - (retail * COMMISSION_RATE);

          <td>

            <span class="badge cat-badge">${escapeHtml(p.category || '')}</span>
          </td>
          <td style="color:#0369a1; font-weight:600;">${peso(cost)}</td>
          <td><strong>${peso(retail)}</strong></td>
          <td style="color:${unitProfit >= 0 ? 'var(--primary-dark)' : 'var(--danger)'}; font-weight:800;">${peso(unitProfit)}</td>

  }
