  // PRODUCT REVIEWS & RATINGS
  // =========================================================
  function setReviewStar(star) {
    selectedReviewStar = star;
    document.querySelectorAll('#star-picker .star-btn').forEach((btn, i) => {
      btn.classList.toggle('selected', i < star);
    });
  }

  function setReviewFilter(star) {
    activeReviewStarFilter = star;
    document.querySelectorAll('#pdp-rating-filters .rating-filter-btn').forEach(btn => {
      btn.classList.toggle('active', String(btn.dataset.star) === String(star));
    });
    renderFilteredReviews();
  }

  async function loadProductReviews(productId) {
    try {
      const { data, error } = await db
        .from('product_reviews')
        .select('*')
        .eq('product_id', productId)
        .order('created_at', { ascending: false });
      activeReviews = error ? [] : (data || []);
    } catch (_) {
      activeReviews = [];
    }

    const count = activeReviews.length;
    const avg = count > 0
      ? (activeReviews.reduce((s, r) => s + Number(r.rating || 5), 0) / count).toFixed(1)
      : '0.0';

    document.getElementById('pdp-rating-avg').textContent = avg;
    document.getElementById('pdp-overview-score').textContent = avg;
    document.getElementById('pdp-review-count').textContent = count;

    const form = document.getElementById('review-form');
    const noteEl = document.getElementById('review-eligibility-note');
    if (currentUser) {
      form.classList.remove('hidden');
      const hasBought = myOrders.some(o =>
        o.buyer_id === currentUser.id &&
        o.status !== 'cancelled' &&
        Array.isArray(o.items) &&
        o.items.some(it => it.product_id === productId)
      );
      noteEl.textContent = hasBought ? '✓ Verified Buyer' : 'Community review';
    } else {
      form.classList.add('hidden');
    }

    renderFilteredReviews();
  }

  function renderFilteredReviews() {
    const listEl = document.getElementById('pdp-reviews-list');
    const filtered = activeReviewStarFilter === 'all'
      ? activeReviews
      : activeReviews.filter(r => Number(r.rating) === Number(activeReviewStarFilter));

    if (filtered.length === 0) {
      listEl.innerHTML = `<div style="font-size:0.84rem; color:var(--muted); padding:0.5rem 0;">No ratings matching this filter yet.</div>`;
      return;
    }

    listEl.innerHTML = filtered.map(r => {
      const stars = '★'.repeat(Number(r.rating || 5)) + '☆'.repeat(5 - Number(r.rating || 5));
      return `
        <div class="review-card">
          <div class="row-between">
            <div>
              <strong style="font-size:0.85rem;">${escapeHtml(r.reviewer_name || 'Buyer')}</strong>
              <span style="color:#f59e0b; font-size:0.9rem; margin-left:0.35rem;">${stars}</span>
            </div>
            <span style="font-size:0.74rem; color:var(--muted);">${new Date(r.created_at).toLocaleDateString()}</span>
          </div>
          <p style="margin:0.35rem 0 0; font-size:0.84rem; color:var(--text-secondary);">${escapeHtml(r.comment)}</p>
        </div>
      `;
    }).join('');
  }

  async function submitProductReview(e) {
    e.preventDefault();
    if (!currentUser || !activeExpandedProduct) return;
    const comment = document.getElementById('review-comment').value.trim();
    if (!comment) return;

    const btn = document.getElementById('btn-submit-review');
    btn.disabled = true;
    try {
      const { error } = await db.from('product_reviews').insert({
        product_id: activeExpandedProduct.id,
        shop_id: activeExpandedProduct.shop_id,
        reviewer_id: currentUser.id,
        reviewer_name: currentProfile.full_name || currentUser.email,
        rating: selectedReviewStar,
        comment
      });
      if (error) throw error;
      document.getElementById('review-comment').value = '';
      setReviewStar(5);
      showToast('Thank you for your review!', 'success');
      await loadProductReviews(activeExpandedProduct.id);
    } catch (err) {
      showToast(err.message || 'Could not submit review.', 'error');
    } finally {
      btn.disabled = false;
    }
  }

  function handleHeaderCartClick() {
    if (!currentUser) {
      openAuthModal('signin');
      return;
    }
    expressBuyItem = null;
    openCart();
  }

  function addToCart(productId, qtyToAdd = 1) {
    if (!currentUser) {
      openAuthModal('signin');
      return;
    }
    const prod = allProducts.find(p => p.id === productId);
    if (!prod || Number(prod.stock) <= 0) {
      showToast('This item is out of stock.', 'error');
      return;
    }
    const existing = cart.find(i => i.product_id === productId);
    if (existing) {
      existing.qty = Math.min(Number(prod.stock), existing.qty + qtyToAdd);
    } else {
      cart.push({ product_id: prod.id, qty: Math.min(Number(prod.stock), qtyToAdd) });
    }
    renderCartBadge();
    showToast(`Added "${prod.name}" to cart!`, 'success');
  }

  function buyNowProduct(productId, qty = 1) {
    if (!currentUser) {
      openAuthModal('signin');
      return;
    }
    const prod = allProducts.find(p => p.id === productId);
    if (!prod || Number(prod.stock) <= 0) {
      showToast('This item is out of stock.', 'error');
      return;
    }
    expressBuyItem = {
      product_id: prod.id,
      qty: Math.min(Number(prod.stock), Math.max(1, qty))
    };
    openCart();
  }

  function renderCartBadge() {
    const total = cart.reduce((sum, i) => sum + i.qty, 0);
    document.getElementById('cart-count').textContent = total;
  }

  function selectCheckoutPaymentMethod(method) {
    checkoutPaymentMethod = method;
    document.getElementById('pay-choice-cod').classList.toggle('active', method === 'COD');
    document.getElementById('pay-choice-qr').classList.toggle('active', method === 'QR');
    document.getElementById('checkout-qr-panel').classList.toggle('hidden', method !== 'QR');
    if (method === 'QR') {
      renderCheckoutQrCodes();
    }
  }

  function getActiveCheckoutItems() {
    if (expressBuyItem) {
      const p = allProducts.find(prod => prod.id === expressBuyItem.product_id);
      return p ? [{ ...expressBuyItem, product: p }] : [];
    }
    return cart.map(i => ({ ...i, product: allProducts.find(p => p.id === i.product_id) })).filter(i => i.product);
  }

  function renderCheckoutQrCodes() {
    const container = document.getElementById('checkout-qr-list');
    const items = getActiveCheckoutItems();
    const shopIds = [...new Set(items.map(i => i.product.shop_id))];
    const shopsWithQr = shopIds.map(id => allShops.find(s => s.id === id)).filter(s => s && s.qr_image_url);

    if (shopsWithQr.length === 0) {
      container.innerHTML = `
        <div style="background:#fffbeb; border:1px solid #fde68a; border-radius:6px; padding:0.7rem; font-size:0.8rem; color:#92400e;">
          ⚠️ No E-Wallet QR code uploaded for this shop yet. You may switch to <strong>Cash on Delivery (COD)</strong> or chat the seller.
        </div>
      `;
      return;
    }

    container.innerHTML = shopsWithQr.map(s => `
      <div class="qr-preview-box" style="margin-bottom:0.55rem;">
        <img src="${escapeHtml(s.qr_image_url)}" alt="${escapeHtml(s.name)} QR" onclick="window.open(this.src, '_blank')" title="Click to enlarge QR" />
        <div style="flex:1; min-width:180px;">
          <div style="font-weight:700; font-size:0.86rem; color:var(--primary-deep);">${escapeHtml(s.name)} — E-Wallet QR</div>
          <div style="font-size:0.8rem; color:var(--text-secondary); margin-top:0.2rem;">${escapeHtml(s.qr_description || 'Scan QR using GCash, Maya, or E-Wallet app')}</div>
          <small style="display:block; color:var(--muted); margin-top:0.3rem;">Tap QR image to view larger, pay exact total, then enter reference below.</small>
        </div>
      </div>
    `).join('');
  }

  function getCheckoutValues() {
    if (isEditingCheckoutInfo) {
      return {
        name: (document.getElementById('checkout-name').value || '').trim(),
        phone: (document.getElementById('checkout-phone').value || '').trim(),
        address: (document.getElementById('checkout-address').value || '').trim()
      };
    }
    return {
      name: (currentProfile.full_name || '').trim(),
      phone: (currentProfile.phone || '').trim(),
      address: (currentProfile.address || '').trim()
    };
  }

  function syncCheckoutPreview() {
    const vals = getCheckoutValues();
    document.getElementById('display-checkout-name').textContent = vals.name || '— Missing —';
    document.getElementById('display-checkout-phone').textContent = vals.phone || '— Missing —';
    document.getElementById('display-checkout-address').textContent = vals.address || '— Missing —';
    const hasMissing = !vals.name || !vals.phone || !vals.address;
    document.getElementById('checkout-missing-alert').classList.toggle('hidden', !hasMissing);
  }

  function toggleCheckoutEdit() {
    isEditingCheckoutInfo = !isEditingCheckoutInfo;
    const editFields = document.getElementById('checkout-edit-fields');
    const btn = document.getElementById('btn-toggle-checkout-edit');
    if (isEditingCheckoutInfo) {
      document.getElementById('checkout-name').value = currentProfile.full_name || '';
      document.getElementById('checkout-phone').value = currentProfile.phone || '';
      document.getElementById('checkout-address').value = currentProfile.address || '';
      editFields.classList.remove('hidden');
      btn.textContent = 'Use Saved Info';
    } else {
      editFields.classList.add('hidden');
      btn.textContent = 'Edit Details';
    }
    syncCheckoutPreview();
    renderCartModal();
  }

  function openCart() {
    const isExpress = Boolean(expressBuyItem);
    document.getElementById('cart-modal-title').textContent = isExpress ? '⚡ Express Buy Now' : '🛒 Shopping Cart';
    document.getElementById('express-buy-badge').classList.toggle('hidden', !isExpress);

    const hasSavedInfo = Boolean(currentProfile.full_name && currentProfile.phone && currentProfile.address);
    isEditingCheckoutInfo = !hasSavedInfo;

    const editFields = document.getElementById('checkout-edit-fields');
    const toggleBtn = document.getElementById('btn-toggle-checkout-edit');
    if (!hasSavedInfo) {
      document.getElementById('checkout-name').value = currentProfile.full_name || '';
      document.getElementById('checkout-phone').value = currentProfile.phone || '';
      document.getElementById('checkout-address').value = currentProfile.address || '';
      editFields.classList.remove('hidden');
      toggleBtn.textContent = 'Use Saved Info';
    } else {
      editFields.classList.add('hidden');
      toggleBtn.textContent = 'Edit Details';
    }

    syncCheckoutPreview();
    selectCheckoutPaymentMethod('COD');
    renderCartModal();
    document.getElementById('cart-modal').classList.remove('hidden');
  }

  function closeCart() {
    expressBuyItem = null;
    document.getElementById('cart-modal').classList.add('hidden');
  }

  function renderCartModal() {
    const container = document.getElementById('cart-items-container');
    const checkoutSec = document.getElementById('checkout-section');
    const items = getActiveCheckoutItems();
    const isExpress = Boolean(expressBuyItem);
    const vals = getCheckoutValues();

    if (items.length === 0) {
      container.innerHTML = `<div class="empty-state">Your cart is empty.</div>`;
      checkoutSec.classList.add('hidden');
      return;
    }

    checkoutSec.classList.remove('hidden');

    let itemsSubtotal = 0;
    let shippingSubtotal = 0;
    const perShopShipping = new Map();
    const outOfRangeShops = [];

    const rowsHtml = items.map(item => {
      const p = item.product;
      const shop = allShops.find(s => s.id === p.shop_id);
      const lineTotal = Number(p.price) * item.qty;
      itemsSubtotal += lineTotal;

      const evalShip = evaluateBuyerShippingForShop(shop, vals.address);
      if (!perShopShipping.has(p.shop_id)) {
        perShopShipping.set(p.shop_id, evalShip);
        shippingSubtotal += evalShip.fee;
        if (evalShip.outOfRange) {
          outOfRangeShops.push({ shop, evalShip });
        }
      }

      const qtyControl = isExpress
        ? `<span style="font-size:0.82rem; font-weight:700;">Qty: ${item.qty}</span>`
        : `
          <div style="display:flex; align-items:center; gap:0.35rem;">
            <button type="button" class="secondary sm" onclick="updateCartQty('${p.id}', -1)">−</button>
            <span style="min-width:20px; text-align:center; font-weight:700;">${item.qty}</span>
            <button type="button" class="secondary sm" onclick="updateCartQty('${p.id}', 1)">+</button>
          </div>
        `;

      return `
        <div style="padding:0.65rem 0; border-bottom:1px solid var(--border);">
          <div class="row-between">
            <div>
              <div style="font-weight:700; font-size:0.9rem;">${escapeHtml(p.name)}</div>
              <small style="color:var(--muted);">
                ${escapeHtml(shop ? shop.name : 'Store')} • ${formatMoney(p.price)} each •
                <span style="color:${evalShip.outOfRange ? '#b45309' : 'var(--green)'}; font-weight:700;">${escapeHtml(evalShip.label)}</span>
              </small>
            </div>
            <div style="display:flex; align-items:center; gap:0.55rem;">
              ${qtyControl}
              <strong style="min-width:72px; text-align:right;">${formatMoney(lineTotal)}</strong>
              ${!isExpress ? `<button type="button" class="danger sm" onclick="removeFromCart('${p.id}')">✕</button>` : ''}
            </div>
          </div>
        </div>
      `;
    }).join('');

    const outOfRangeHtml = outOfRangeShops.map(({ shop, evalShip }) => {
      const prefillMsg = `Hi ${shop.name}, my delivery address is "${vals.address}" which seems outside your configured range (${parseShopShippingMeta(shop).allowedArea}). How much is the shipping fee?`;
      return `
        <div class="out-of-range-alert">
          <div>
            <strong>📍 Location Out of Range (${escapeHtml(shop.name)}):</strong><br/>
            <span>${escapeHtml(evalShip.warningText || 'Please chat seller for shipping rate.')}</span>
          </div>
          <button type="button" class="shop-cta sm" onclick="closeCart(); openChatModal('${shop.id}', '${shop.owner_id || ''}', ${JSON.stringify(prefillMsg).replace(/"/g, '&quot;')})">
            💬 Chat Seller
          </button>
        </div>
      `;
    }).join('');

    const grandTotal = itemsSubtotal + shippingSubtotal;
    container.innerHTML = `
      ${rowsHtml}
      ${outOfRangeHtml}
      <div style="margin-top:0.75rem; background:#f8fbf9; border:1px solid var(--border); border-radius:8px; padding:0.75rem 0.9rem; font-size:0.86rem;">
        <div class="row-between" style="margin-bottom:0.3rem;">
          <span>Items Subtotal:</span>
          <strong>${formatMoney(itemsSubtotal)}</strong>
        </div>
        <div class="row-between" style="margin-bottom:0.4rem;">
          <span>Shipping Fee (Location-Based):</span>
          <strong style="color:${shippingSubtotal === 0 ? 'var(--green)' : 'var(--text)'};">${shippingSubtotal === 0 ? 'FREE (₱0.00)' : formatMoney(shippingSubtotal)}</strong>
        </div>
        <div class="row-between" style="border-top:1px solid var(--border); padding-top:0.45rem; font-size:1.05rem;">
          <strong>Total Amount Due:</strong>
          <strong style="color:var(--primary-dark);">${formatMoney(grandTotal)}</strong>
        </div>
      </div>
    `;

    const placeBtn = document.getElementById('btn-place-order');
    const anyBlocked = outOfRangeShops.some(x => !x.evalShip.allowed);
    placeBtn.disabled = anyBlocked;
    placeBtn.textContent = anyBlocked
      ? 'Chat Seller Required (Out of Range)'
      : `Place Order • ${formatMoney(grandTotal)}`;
  }

  function updateCartQty(productId, delta) {
    const item = cart.find(i => i.product_id === productId);
    const prod = allProducts.find(p => p.id === productId);
    if (!item || !prod) return;
    const nextQty = item.qty + delta;
    if (nextQty <= 0) {
      cart = cart.filter(i => i.product_id !== productId);
    } else if (nextQty <= Number(prod.stock)) {
      item.qty = nextQty;
    } else {
      showToast(`Only ${prod.stock} stock available.`, 'error');
    }
    renderCartBadge();
    renderCartModal();
  }

  function removeFromCart(productId) {
    cart = cart.filter(i => i.product_id !== productId);
    renderCartBadge();
    renderCartModal();
  }

  async function checkout() {
    if (!currentUser) {
      openAuthModal('signin');
      return;
    }

    const vals = getCheckoutValues();
    if (!vals.name || !vals.phone || !vals.address) {
      isEditingCheckoutInfo = true;
      document.getElementById('checkout-edit-fields').classList.remove('hidden');
      document.getElementById('btn-toggle-checkout-edit').textContent = 'Use Saved Info';
      syncCheckoutPreview();
      showToast('Please complete your Name, Contact Number, and Delivery Address.', 'error');
      return;
    }

    if (!document.getElementById('checkout-policy-agree').checked) {
      showToast('Please agree to the No to Cancel after Shipping policy.', 'error');
      return;
    }

    let qrRefText = '';
    if (checkoutPaymentMethod === 'QR') {
      qrRefText = (document.getElementById('checkout-qr-ref').value || '').trim();
      if (!qrRefText) {
        showToast('Please enter your E-Wallet payment reference number or sender name.', 'error');
        return;
      }
    }

    const activeItems = getActiveCheckoutItems();
    if (activeItems.length === 0) return;

    const byShop = new Map();
    for (const item of activeItems) {
      const p = item.product;
      if (!p || Number(p.stock) < item.qty) {
        showToast(`Insufficient stock for ${p ? p.name : 'an item'}.`, 'error');
        return;
      }
      if (!byShop.has(p.shop_id)) byShop.set(p.shop_id, []);
      byShop.get(p.shop_id).push({ item, product: p });
    }

    // Check out-of-range block
    for (const [shopId] of byShop.entries()) {
      const shop = allShops.find(s => s.id === shopId);
      const evalShip = evaluateBuyerShippingForShop(shop, vals.address);
      if (!evalShip.allowed) {
        showToast(`Your location is outside ${shop?.name || 'the seller'}'s allowed range. Please chat the seller.`, 'error');
        return;
      }
    }

    const btn = document.getElementById('btn-place-order');
    btn.disabled = true;
    btn.textContent = 'Processing order...';

    try {
      const createdOrdersSummary = [];

      for (const [shopId, group] of byShop.entries()) {
        const shop = allShops.find(s => s.id === shopId);
        const evalShip = evaluateBuyerShippingForShop(shop, vals.address);
        const shippingFee = evalShip.fee;

        const itemsSubtotal = group.reduce((sum, g) => sum + Number(g.product.price) * g.item.qty, 0);
        const totalAmount = itemsSubtotal + shippingFee;
        const commissionAmount = Number((itemsSubtotal * PLATFORM_COMMISSION_RATE).toFixed(2));
        const orderRef = generateOrderReference();

        const orderItems = group.map(g => ({
          product_id: g.product.id,
          name: g.product.name,
          price: Number(g.product.price),
          cost_price: getProductUnitCost(g.product),
          qty: g.item.qty
        }));

        const orderPayload = {
          buyer_id: currentUser.id,
          shop_id: shopId,
          customer_name: vals.name,
          customer_phone: vals.phone,
          customer_address: vals.address,
          items: orderItems,
          items_subtotal: itemsSubtotal,
          shipping_fee: shippingFee,
          total_amount: totalAmount,
          commission_rate: PLATFORM_COMMISSION_RATE,
          commission_amount: commissionAmount,
          commission_paid: false,
          payment_method: checkoutPaymentMethod,
          payment_reference: checkoutPaymentMethod === 'QR' ? qrRefText : null,
          status: 'pending'
        };

        const { data: insertedOrder, error: orderErr } = await db
          .from('orders')
          .insert(orderPayload)
          .select()
          .single();

        if (orderErr) throw orderErr;

        for (const g of group) {
          const newStock = Math.max(0, Number(g.product.stock) - g.item.qty);
          await db.from('products').update({ stock: newStock }).eq('id', g.product.id);
        }

        if (shop?.owner_id) {
          await createNotification(
            shop.owner_id,
            `🛒 New Order ${orderRef} (${checkoutPaymentMethod})`,
            `${vals.name} ordered ${orderItems.map(i => `${i.name} x${i.qty}`).join(', ')} — Total ${formatMoney(totalAmount)}.`,
            'order',
            'sales'
          );
        }

        createdOrdersSummary.push({
          ...(insertedOrder || orderPayload),
          order_ref: orderRef,
          shopName: shop?.name || 'MarketHub Store'
        });
      }

      if (!currentProfile.full_name || !currentProfile.phone || !currentProfile.address) {
        currentProfile.full_name = vals.name;
        currentProfile.phone = vals.phone;
        currentProfile.address = vals.address;
        await db.from('profiles').upsert({
          id: currentUser.id,
          full_name: vals.name,
          phone: vals.phone,
          address: vals.address,
          role: currentProfile.role || 'buyer'
        }, { onConflict: 'id' });
        updateUserHeaderBadge();
      }

      if (expressBuyItem) {
        expressBuyItem = null;
      } else {
        cart = [];
        renderCartBadge();
      }

      document.getElementById('checkout-qr-ref').value = '';
      closeCart();
      await loadMarketplace();
      await loadOrders();

      if (createdOrdersSummary.length === 1) {
        showToast(`Order placed! Ref #: ${createdOrdersSummary[0].order_ref}`, 'success', 4500);
        openReceiptModal(createdOrdersSummary[0].id, createdOrdersSummary[0]);
      } else {
        showToast(`${createdOrdersSummary.length} orders placed!`, 'success', 4000);
        switchOrdersSubTab('purchases');
        switchView('orders');
      }
    } catch (err) {
      showToast(err.message || 'Checkout failed.', 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Place Order Now';
    }
  }

  // =========================================================
  // ORDERS, REALISTIC REF #, PRINTABLE RECEIPT & LIVE TRACKING
  // =========================================================
  function switchOrdersSubTab(tab) {
    ordersTab = tab;
    renderOrdersSubTabs();
    renderOrdersList();
  }

  function renderOrdersSubTabs() {
    const isSeller = Boolean(myShop && myShop.status === 'approved');
    const salesBtn = document.getElementById('orders-tab-sales');
    salesBtn.classList.toggle('hidden', !isSeller);
    document.getElementById('orders-tab-purchases').classList.toggle('active', ordersTab === 'purchases');
    salesBtn.classList.toggle('active', ordersTab === 'sales');
  }

  async function loadOrders() {
    if (!currentUser) return;
    try {
      const { data: purchases, error: pErr } = await db
        .from('orders')
        .select('*')
        .eq('buyer_id', currentUser.id)
        .order('created_at', { ascending: false });
      if (pErr) throw pErr;
      myOrders = purchases || [];

      if (myShop && myShop.status === 'approved') {
        const { data: sales, error: sErr } = await db
          .from('orders')
          .select('*')
          .eq('shop_id', myShop.id)
          .order('created_at', { ascending: false });
        if (sErr) throw sErr;
        sellerOrders = sales || [];
      } else {
        sellerOrders = [];
      }

      const activeSalesCount = sellerOrders.filter(o => !['cancelled', 'delivered'].includes(o.status)).length;
      document.getElementById('tab-sales-badge').textContent = activeSalesCount;
      document.getElementById('seller-pending-count').textContent = activeSalesCount;

      renderOrdersList();
    } catch (err) {
      showError('Failed to load orders: ' + err.message);
    }
  }

  function renderOrderStepper(status) {
    if (status === 'cancelled') {
      return `<div class="cancelled-banner">✕ Order Cancelled (Cancelled while Pending)</div>`;
    }
    const idxMap = { pending: 0, received: 1, confirmed: 1, shipped: 2, delivered: 3 };
    const currentIdx = idxMap[status] ?? 0;

    return `
      <div class="order-stepper">
        ${ORDER_STEPS.map((st, idx) => {
          let cls = 'step-item';
          if (idx < currentIdx) cls += ' done';
          else if (idx === currentIdx) cls += ' current';
          const icon = idx < currentIdx ? '✓' : (idx + 1);
          return `
            <div class="${cls}">
              <div class="step-dot">${icon}</div>
              <div>${st.label}</div>
            </div>
          `;
        }).join('')}
      </div>
    `;
  }

  function renderOrdersList() {
    const container = document.getElementById('orders-list');
    const isSalesView = ordersTab === 'sales' && myShop && myShop.status === 'approved';
    const list = isSalesView ? sellerOrders : myOrders;

    if (list.length === 0) {
      container.innerHTML = `<div class="empty-state">${isSalesView ? 'No incoming shop orders yet.' : 'You have not placed any orders yet.'}</div>`;
      return;
    }

    const shopMap = new Map(allShops.map(s => [s.id, s]));

    container.innerHTML = list.map(o => {
      const itemsList = Array.isArray(o.items) ? o.items : [];
      const itemsSummary = itemsList.map(i => `${escapeHtml(i.name)} × ${i.qty}`).join(', ');
      const shop = shopMap.get(o.shop_id);
      const shopName = shop?.name || 'MarketHub Store';
      const orderRef = getOrderRefCode(o);

      const itemsSub = Number(o.items_subtotal ?? itemsList.reduce((s, i) => s + Number(i.price) * Number(i.qty), 0));
      const shipFee = Number(o.shipping_fee ?? 0);
      const grandTotal = Number(o.total_amount ?? (itemsSub + shipFee));

      const payMethod = o.payment_method || 'COD';
      const payLabel = payMethod === 'QR'
        ? `📱 Scan QR (${escapeHtml(o.payment_reference || 'Ref provided')})`
        : '💵 Cash on Delivery (COD)';

      let actionButtons = '';

      if (isSalesView) {
        if (o.status === 'pending') {
          actionButtons = `
            <button type="button" class="success-btn sm" onclick="updateOrderStatus('${o.id}', 'confirmed')">✓ Confirm Order</button>
            <button type="button" class="danger-outline sm" onclick="cancelPendingOrder('${o.id}', true)">Cancel (Pending)</button>
          `;
        } else if (o.status === 'confirmed' || o.status === 'received') {
          actionButtons = `
            <button type="button" class="shop-cta sm" onclick="updateOrderStatus('${o.id}', 'shipped')">🚚 Mark Shipped (No Cancel)</button>
          `;
        } else if (o.status === 'shipped') {
          actionButtons = `
            <button type="button" class="success-btn sm" onclick="updateOrderStatus('${o.id}', 'delivered')">✓ Mark Delivered</button>
          `;
        }
        if (o.buyer_id) {
          actionButtons += ` <button type="button" class="secondary sm" onclick="openChatModal('${o.shop_id}', '${o.buyer_id}', 'Regarding Order ${escapeHtml(orderRef)}')">💬 Chat Buyer</button>`;
        }
      } else {
        if (o.status === 'pending') {
          actionButtons = `
            <button type="button" class="danger-outline sm" onclick="cancelPendingOrder('${o.id}', false)">Cancel Order (While Pending)</button>
          `;
        } else if (o.status === 'shipped') {
          actionButtons += ` <button type="button" class="success-btn sm" onclick="updateOrderStatus('${o.id}', 'delivered')">✓ Confirm Received</button>`;
        }
        if (shop?.owner_id) {
          actionButtons += ` <button type="button" class="secondary sm" onclick="openChatModal('${o.shop_id}', '${shop.owner_id}', 'Regarding Order ${escapeHtml(orderRef)}')">💬 Chat Seller</button>`;
        }
      }

      actionButtons += ` <button type="button" class="secondary sm" onclick="openReceiptModal('${o.id}')">🖨️ Print Receipt</button>`;

      return `
        <div class="panel">
          <div class="row-between">
            <div style="display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap;">
              <strong style="font-size:0.95rem; color:var(--primary-deep);">${escapeHtml(shopName)}</strong>
              <span class="badge ref-badge">${escapeHtml(orderRef)}</span>
              <span class="badge status-${o.status}">${o.status}</span>
              <span class="badge cat-badge">${payLabel}</span>
            </div>
            <span style="font-size:0.78rem; color:var(--muted);">${new Date(o.created_at).toLocaleString()}</span>
          </div>

          ${renderOrderStepper(o.status)}

          <div style="margin-top:0.5rem; font-size:0.86rem; line-height:1.5;">
            <div><strong>Items:</strong> ${itemsSummary || '—'}</div>
            <div>
              <strong>Items Subtotal:</strong> ${formatMoney(itemsSub)} &nbsp;|&nbsp;
              <strong>Shipping:</strong> ${shipFee === 0 ? '<span style="color:var(--green); font-weight:700;">FREE</span>' : formatMoney(shipFee)} &nbsp;|&nbsp;
              <strong>Total:</strong> <strong style="color:var(--primary-dark); font-size:0.98rem;">${formatMoney(grandTotal)}</strong>
            </div>
            <div style="color:var(--muted); font-size:0.8rem; margin-top:0.2rem;">
              <strong>Recipient:</strong> ${escapeHtml(o.customer_name)} (${escapeHtml(o.customer_phone)}) • <strong>Address:</strong> ${escapeHtml(o.customer_address)}
            </div>
          </div>

          <div style="margin-top:0.85rem; display:flex; gap:0.45rem; flex-wrap:wrap;">
            ${actionButtons}
          </div>
        </div>
      `;
    }).join('');
  }

  async function cancelPendingOrder(orderId, isSellerAction = false) {
    const order = [...myOrders, ...sellerOrders].find(o => o.id === orderId);
    if (!order) return;
    if (order.status !== 'pending') {
      showToast('Cancellation is only allowed while order is Pending. Strictly NO TO CANCEL once shipped!', 'error');
      return;
    }
    const orderRef = getOrderRefCode(order);

    try {
      const { error } = await db.from('orders').update({ status: 'cancelled' }).eq('id', orderId).eq('status', 'pending');
      if (error) throw error;

      if (Array.isArray(order.items)) {
        for (const it of order.items) {
          const prod = allProducts.find(p => p.id === it.product_id);
          if (prod) {
            await db.from('products').update({ stock: Number(prod.stock || 0) + Number(it.qty || 0) }).eq('id', prod.id);
          }
        }
      }

      const shop = allShops.find(s => s.id === order.shop_id);
      if (isSellerAction && order.buyer_id) {
        await createNotification(
          order.buyer_id,
          `✕ Order ${orderRef} Cancelled by Seller`,
          `${shop?.name || 'Seller'} cancelled pending order ${orderRef}.`,
          'order',
          'purchases'
        );
      } else if (!isSellerAction && shop?.owner_id) {
        await createNotification(
          shop.owner_id,
          `✕ Order ${orderRef} Cancelled by Buyer`,
          `${order.customer_name} cancelled pending order ${orderRef}. Stock restored.`,
          'order',
          'sales'
        );
      }

      showToast(`Order ${orderRef} cancelled and stock restored.`, 'info');
      await loadMarketplace();
      await loadOrders();
    } catch (err) {
      showToast(err.message || 'Could not cancel order.', 'error');
    }
  }

  async function updateOrderStatus(orderId, nextStatus) {
    const order = [...myOrders, ...sellerOrders].find(o => o.id === orderId);
    const orderRef = order ? getOrderRefCode(order) : orderId.slice(0, 8);

    try {
      const { error } = await db.from('orders').update({ status: nextStatus }).eq('id', orderId);
      if (error) throw error;

      if (nextStatus === 'shipped' && order) {
        const itemsList = Array.isArray(order.items) ? order.items : [];
        for (const it of itemsList) {
          const prod = allProducts.find(p => p.id === it.product_id);
          if (prod) {
            const newSold = Number(prod.sold_count || 0) + Number(it.qty || 1);
            await db.from('products').update({ sold_count: newSold }).eq('id', prod.id);
          }
        }
      }

      if (order?.buyer_id) {
        const statusMsg = {
          confirmed: `Your order ${orderRef} has been confirmed and is being prepared.`,
          shipped: `Your order ${orderRef} has been SHIPPED! No cancellation allowed from this point.`,
          delivered: `Your order ${orderRef} has been marked as DELIVERED. Thank you for shopping!`
        }[nextStatus] || `Order ${orderRef} updated to ${nextStatus}.`;

        await createNotification(
          order.buyer_id,
          `📦 Order ${orderRef}: ${nextStatus.toUpperCase()}`,
          statusMsg,
          'order',
          'purchases'
        );
      }

      showToast(`Order ${orderRef} marked as ${nextStatus}!`, 'success');
      await loadMarketplace();
      await loadOrders();
      if (activeSellerTab === 'income') renderSellerFinance();
    } catch (err) {
      showToast(err.message || 'Status update failed.', 'error');
    }
  }

  function computeOrderProfitBreakdown(order) {
    const items = Array.isArray(order.items) ? order.items : [];
    const prodMap = new Map(allProducts.map(p => [p.id, p]));

    let productSales = Number(order.items_subtotal ?? 0);
    if (!productSales && items.length > 0) {
      productSales = items.reduce((s, i) => s + Number(i.price || 0) * Number(i.qty || 1), 0);
    }

    const shippingFee = Number(order.shipping_fee ?? 0);

    const puhunan = items.reduce((sum, it) => {
      const qty = Number(it.qty || 1);
      const savedCost = it.cost_price !== undefined && it.cost_price !== null ? Number(it.cost_price) : null;
      const fallbackProd = prodMap.get(it.product_id);
      const unitCost = savedCost !== null ? savedCost : (fallbackProd ? getProductUnitCost(fallbackProd) : 0);
      return sum + (unitCost * qty);
    }, 0);

    const adminFee = order.commission_amount !== undefined && order.commission_amount !== null
      ? Number(order.commission_amount)
      : Number((productSales * PLATFORM_COMMISSION_RATE).toFixed(2));

    const netProfit = productSales - puhunan - adminFee;

    return {
      productSales,
      shippingFee,
      puhunan,
      adminFee,
      netProfit,
      grossOrderTotal: productSales + shippingFee
    };
  }

  function renderSellerFinance() {
    const validOrders = sellerOrders.filter(o => o.status !== 'cancelled');
    const byMonth = new Map();

    validOrders.forEach(o => {
      const mKey = getMonthKey(o.created_at);
      if (!byMonth.has(mKey)) {
        byMonth.set(mKey, {
          monthKey: mKey,
          orderCount: 0,
          productSales: 0,
          shippingFee: 0,
          puhunan: 0,
          adminFee: 0,
          adminUnpaid: 0,
          adminPaid: 0,
          netProfit: 0
        });
      }
      const row = byMonth.get(mKey);
      const b = computeOrderProfitBreakdown(o);
      row.orderCount += 1;
      row.productSales += b.productSales;
      row.shippingFee += b.shippingFee;
      row.puhunan += b.puhunan;
      row.adminFee += b.adminFee;
      row.netProfit += b.netProfit;
      if (o.commission_paid) row.adminPaid += b.adminFee;
      else row.adminUnpaid += b.adminFee;
    });

    const filteredRows = sellerAllMonths
      ? Array.from(byMonth.values())
      : (byMonth.has(sellerSelectedMonth) ? [byMonth.get(sellerSelectedMonth)] : []);

    const sumProdSales = filteredRows.reduce((s, r) => s + r.productSales, 0);
    const sumShip = filteredRows.reduce((s, r) => s + r.shippingFee, 0);
    const sumPuhunan = filteredRows.reduce((s, r) => s + r.puhunan, 0);
    const sumAdmin = filteredRows.reduce((s, r) => s + r.adminFee, 0);
    const sumAdminUnpaid = filteredRows.reduce((s, r) => s + r.adminUnpaid, 0);
    const sumAdminPaid = filteredRows.reduce((s, r) => s + r.adminPaid, 0);
    const sumNetProfit = filteredRows.reduce((s, r) => s + r.netProfit, 0);
    const sumOrders = filteredRows.reduce((s, r) => s + r.orderCount, 0);
    const sumGrossAll = sumProdSales + sumShip;

    const currentMonthObj = byMonth.get(sellerSelectedMonth) || { netProfit: 0, adminUnpaid: 0 };
    if (document.getElementById('home-kpi-net-profit')) {
      document.getElementById('home-kpi-net-profit').textContent = formatMoney(currentMonthObj.netProfit);
    }
    if (document.getElementById('home-kpi-admin-fee')) {
      document.getElementById('home-kpi-admin-fee').textContent = formatMoney(currentMonthObj.adminUnpaid);
    }

    document.getElementById('seller-kpi-net-profit').textContent = formatMoney(sumNetProfit);
    document.getElementById('seller-kpi-prod-sales').textContent = formatMoney(sumProdSales);
    document.getElementById('seller-kpi-order-count').textContent = `${sumOrders} valid order(s)`;
    document.getElementById('seller-kpi-puhunan').textContent = formatMoney(sumPuhunan);
    document.getElementById('seller-kpi-admin-unpaid').textContent = formatMoney(sumAdminUnpaid);
    document.getElementById('seller-kpi-admin-total').textContent = formatMoney(sumAdmin);
    document.getElementById('seller-kpi-admin-paid').textContent = formatMoney(sumAdminPaid);
    document.getElementById('seller-kpi-fee-status').textContent = sumAdminUnpaid > 0
      ? `Unpaid 10% fee: ${formatMoney(sumAdminUnpaid)}`
      : '✓ All 10% admin fees settled';

    document.getElementById('ledger-gross-total').textContent = formatMoney(sumGrossAll);
    document.getElementById('ledger-less-shipping').textContent = `−${formatMoney(sumShip)}`;
    document.getElementById('ledger-product-sales').textContent = formatMoney(sumProdSales);
    document.getElementById('ledger-less-puhunan').textContent = `−${formatMoney(sumPuhunan)}`;
    document.getElementById('ledger-less-admin').textContent = `−${formatMoney(sumAdmin)}`;
    document.getElementById('ledger-net-profit').textContent = formatMoney(sumNetProfit);

    renderSellerIncomePieChart(sumNetProfit, sumPuhunan, sumAdmin, sumShip);

    const tbody = document.getElementById('seller-monthly-history-tbody');
    const sortedMonths = Array.from(byMonth.values()).sort((a, b) => b.monthKey.localeCompare(a.monthKey));
    if (sortedMonths.length === 0) {
      tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; color:var(--muted);">No valid orders recorded yet.</td></tr>`;
      return;
    }

    tbody.innerHTML = sortedMonths.map(r => `
      <tr>
        <td><strong>${escapeHtml(formatMonthLabel(r.monthKey))}</strong></td>
        <td>${r.orderCount}</td>
        <td>${formatMoney(r.productSales)}</td>
        <td style="color:#475569;">−${formatMoney(r.puhunan)}</td>
        <td style="color:#b45309;">−${formatMoney(r.adminFee)}</td>
        <td style="color:#0369a1;">${formatMoney(r.shippingFee)}</td>
        <td style="font-weight:800; color:${r.netProfit >= 0 ? 'var(--primary-dark)' : 'var(--danger)'};">${formatMoney(r.netProfit)}</td>
        <td>${r.adminUnpaid <= 0 ? `<span class="badge status-approved">Settled</span>` : `<span class="badge status-pending">Due ${formatMoney(r.adminUnpaid)}</span>`}</td>
      </tr>
    `).join('');
  }

  // =========================================================
  // PLATFORM ADMIN PANEL
  // =========================================================
  async function loadAdminPanel() {
    if (currentProfile.role !== 'admin') return;
    try {
      const { data: ordersData, error: oErr } = await db.from('orders').select('*').order('created_at', { ascending: false });
      if (oErr) throw oErr;
      allAdminOrders = ordersData || [];
      document.getElementById('admin-commission-month').value = adminSelectedMonth;
      renderAdminShops();
      renderAdminCommission();
      renderAdminProducts();
    } catch (err) {
      showError('Failed to load Admin panel: ' + err.message);
    }
  }

  function renderAdminShops() {
    const tbody = document.getElementById('admin-shops-tbody');
    const pendingCount = allShops.filter(s => s.status === 'pending').length;
    document.getElementById('admin-pending-shops-badge').textContent = `${pendingCount} Pending Review`;

    if (allShops.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:var(--muted);">No shop applications yet.</td></tr>`;
      return;
    }

    tbody.innerHTML = allShops.map(s => {
      const meta = parseShopShippingMeta(s);
      const proofHtml = s.id_proof_url
        ? `<img src="${escapeHtml(s.id_proof_url)}" style="width:54px; height:54px; object-fit:cover; border-radius:6px; border:1px solid var(--border); cursor:pointer;" onclick="window.open(this.src, '_blank')" title="Click to view full ID proof" />`
        : `<span style="font-size:0.75rem; color:var(--muted);">No ID attached</span>`;

      const qrHtml = s.qr_image_url
        ? `<div style="margin-top:0.25rem; font-size:0.74rem; color:#0369a1;">📱 QR: ${escapeHtml(s.qr_description || 'Uploaded')}</div>`
        : `<div style="margin-top:0.25rem; font-size:0.74rem; color:var(--muted);">💵 COD Only</div>`;

      return `
        <tr>
          <td>
            <strong>${escapeHtml(s.name)}</strong><br/>
            <span class="badge cat-badge">${escapeHtml(s.category || 'General')}</span><br/>
            <small style="color:var(--muted);">${escapeHtml(s.description || '')}</small>
          </td>
          <td style="font-size:0.8rem;">
            <div><strong>Tel:</strong> ${escapeHtml(s.contact_phone || '—')}</div>
            <div><strong>Pickup:</strong> ${escapeHtml(s.pickup_address || '—')}</div>
          </td>
          <td style="font-size:0.78rem;">
            <div>${meta.isFreeDefault ? '🚚 Free Shipping' : `🚚 ${formatMoney(meta.defaultFee)}`} • ${meta.brgyRules.length} loc rule(s)</div>
            <div>📍 ${escapeHtml(meta.allowedArea)}</div>
            ${qrHtml}
          </td>
          <td>${proofHtml}</td>
          <td><span class="badge status-${s.status}">${s.status}</span></td>
          <td style="white-space:nowrap;">
            ${s.status !== 'approved' ? `<button type="button" class="success-btn sm" onclick="setShopApprovalStatus('${s.id}', 'approved')">Approve</button>` : ''}
            ${s.status !== 'rejected' ? `<button type="button" class="danger-outline sm" onclick="setShopApprovalStatus('${s.id}', 'rejected')">Reject</button>` : ''}
          </td>
        </tr>
      `;
    }).join('');
  }

  async function setShopApprovalStatus(shopId, newStatus) {
    const shop = allShops.find(s => s.id === shopId);
    const { error } = await db.from('shops').update({ status: newStatus }).eq('id', shopId);
    if (error) {
      showToast(error.message || 'Failed to update shop status.', 'error');
      return;
    }
    if (shop?.owner_id) {
      await createNotification(
        shop.owner_id,
        newStatus === 'approved' ? `🎉 Shop Approved: ${shop.name}` : `⚠️ Shop Status: ${newStatus.toUpperCase()}`,
        newStatus === 'approved'
          ? 'Congratulations! Your shop is now live on MarketHub.'
          : 'Your shop application status was updated. Please review details in Seller Centre.',
        'shop',
        'purchases'
      );
    }
    showToast(`Shop ${newStatus}!`, 'success');
    await loadMarketplace();
    await loadAdminPanel();
  }

  function onAdminMonthChange() {
    adminSelectedMonth = document.getElementById('admin-commission-month').value || new Date().toISOString().slice(0, 7);
    adminAllMonths = false;
    renderAdminCommission();
  }

  function toggleAdminAllMonths() {
    adminAllMonths = !adminAllMonths;
    const btn = document.getElementById('btn-admin-all-months');
    btn.classList.toggle('active', adminAllMonths);
    btn.textContent = adminAllMonths ? 'Showing All Months' : 'Show All Months';
    renderAdminCommission();
  }

  function renderAdminCommission() {
    const tbody = document.getElementById('admin-commission-tbody');
    const validOrders = allAdminOrders.filter(o => o.status !== 'cancelled');
    const filteredOrders = adminAllMonths
      ? validOrders
      : validOrders.filter(o => getMonthKey(o.created_at) === adminSelectedMonth);

    const shopTotals = new Map();
    let grossProductSales = 0;
    let totalCommission = 0;
    let uncollectedComm = 0;
    let collectedComm = 0;
    let totalSellerNetPlusShip = 0;

    filteredOrders.forEach(o => {
      const b = computeOrderProfitBreakdown(o);
      const sellerShare = (b.productSales - b.adminFee) + b.shippingFee;

      grossProductSales += b.productSales;
      totalCommission += b.adminFee;
      totalSellerNetPlusShip += sellerShare;
      if (o.commission_paid) collectedComm += b.adminFee;
      else uncollectedComm += b.adminFee;

      if (!shopTotals.has(o.shop_id)) {
        const sh = allShops.find(s => s.id === o.shop_id);
        shopTotals.set(o.shop_id, {
          shopId: o.shop_id,
          shopName: sh?.name || 'Unknown Shop',
          orderCount: 0,
          productSales: 0,
          shippingFee: 0,
          commission: 0,
          sellerNetPlusShip: 0,
          unpaidCount: 0,
          orderIds: []
        });
      }
      const st = shopTotals.get(o.shop_id);
      st.orderCount += 1;
      st.productSales += b.productSales;
      st.shippingFee += b.shippingFee;
      st.commission += b.adminFee;
      st.sellerNetPlusShip += sellerShare;
      if (!o.commission_paid) {
        st.unpaidCount += 1;
        st.orderIds.push(o.id);
      }
    });

    document.getElementById('kpi-gross-sales').textContent = formatMoney(grossProductSales);
    document.getElementById('kpi-orders-count').textContent = `${filteredOrders.length} valid shop order(s)`;
    document.getElementById('kpi-total-commission').textContent = formatMoney(totalCommission);
    document.getElementById('kpi-uncollected').textContent = formatMoney(uncollectedComm);
    document.getElementById('kpi-collected').textContent = formatMoney(collectedComm);
    document.getElementById('kpi-seller-net').textContent = formatMoney(totalSellerNetPlusShip);

    const rows = Array.from(shopTotals.values());
    if (rows.length === 0) {
      tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; color:var(--muted);">No valid shop orders for this period.</td></tr>`;
      return;
    }

    tbody.innerHTML = rows.map(r => {
      const isPaid = r.unpaidCount === 0;
      return `
        <tr>
          <td><strong>${escapeHtml(r.shopName)}</strong></td>
          <td>${r.orderCount}</td>
          <td>${formatMoney(r.productSales)}</td>
          <td>${formatMoney(r.shippingFee)}</td>
          <td><strong style="color:var(--primary-dark);">${formatMoney(r.commission)}</strong></td>
          <td>${formatMoney(r.sellerNetPlusShip)}</td>
          <td>${isPaid ? `<span class="badge status-approved">Collected</span>` : `<span class="badge status-pending">Uncollected</span>`}</td>
          <td>
            ${isPaid
              ? `<span style="font-size:0.76rem; color:var(--green); font-weight:600;">✓ Paid</span>`
              : `<button type="button" class="success-btn sm" onclick='markShopCommissionPaid(${JSON.stringify(r.orderIds)})'>Mark Paid</button>`}
          </td>
        </tr>
      `;
    }).join('');
  }

  async function markShopCommissionPaid(orderIds) {
    if (!Array.isArray(orderIds) || orderIds.length === 0) return;
    const { error } = await db.from('orders').update({ commission_paid: true }).in('id', orderIds);
    if (error) {
      showToast(error.message || 'Could not update billing status.', 'error');
      return;
    }
    showToast('10% commission marked as collected!', 'success');
    await loadAdminPanel();
  }

  function renderAdminProducts() {
    const tbody = document.getElementById('admin-products-tbody');
    const shopMap = new Map(allShops.map(s => [s.id, s.name]));
    if (allProducts.length === 0) {
      tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:var(--muted);">No products in database.</td></tr>`;
      return;
    }
    tbody.innerHTML = allProducts.map(p => `
      <tr>
        <td>${escapeHtml(shopMap.get(p.shop_id) || 'Shop')}</td>
        <td><strong>${escapeHtml(p.name)}</strong></td>
        <td>${escapeHtml(p.category || 'General')}</td>
        <td>${formatMoney(p.price)}</td>
        <td>${p.stock}</td>
        <td>${p.sold_count || 0}</td>
        <td><button type="button" class="danger sm" onclick="deleteProduct('${p.id}')">Remove</button></td>
      </tr>
    `).join('');
  }

  // =========================================================
  // INITIALIZATION & AUTH LISTENER
  // =========================================================
  async function hydrateUserSession(user) {
    currentUser = user;
    if (!user) {
      currentProfile = { full_name: '', phone: '', address: '', role: 'buyer' };
      myShop = null;
      updateUIForRole();
      return;
    }

    const meta = user.user_metadata || {};
    const fallbackName = meta.full_name || meta.name || (user.email ? user.email.split('@')[0] : 'Member');

    try {
      const { data: prof } = await db.from('profiles').select('*').eq('id', user.id).single();
      if (prof) {
        currentProfile = {
          full_name: prof.full_name || fallbackName,
          phone: prof.phone || meta.phone || '',
          address: prof.address || meta.address || '',
          role: prof.role || 'buyer'
        };
      } else {
        currentProfile = {
          full_name: fallbackName,
          phone: meta.phone || '',
          address: meta.address || '',
          role: 'buyer'
        };
        await db.from('profiles').upsert({
          id: user.id,
          full_name: currentProfile.full_name,
          phone: currentProfile.phone,
          address: currentProfile.address,
          role: 'buyer'
        }, { onConflict: 'id' });
      }
    } catch (_) {
      currentProfile = {
        full_name: fallbackName,
        phone: meta.phone || '',
        address: meta.address || '',
        role: 'buyer'
      };
    }

    myShop = allShops.find(s => s.owner_id === user.id) || null;
    updateUIForRole();
    await loadOrders();
    await loadNotifications();
    await loadChatMessages(false);
    if (currentProfile.role === 'admin') {
      await loadAdminPanel();
    }
  }

  async function initApp() {
    renderPhotoSlots();
    updateLiveProductProfitPreview();
    refreshPwaInstallButton();
    initPsgcLocations();

    const { data: { session } } = await db.auth.getSession();
    await loadMarketplace();
    await hydrateUserSession(session?.user || null);

    db.auth.onAuthStateChange(async (event, session) => {
      if (event === 'PASSWORD_RECOVERY') {
        openRecoveryModal();
      }
      await hydrateUserSession(session?.user || null);
      renderMarketplaceAll();
    });
  }

  initApp();
</script>
