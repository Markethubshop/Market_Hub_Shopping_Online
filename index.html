  function addBarangayShippingRule() {
    const nameInput = document.getElementById('brgy-rule-name');
    const brgyName = nameInput.value.trim();
    if (!brgyName) {
      showToast('Enter a Barangay or Location name (e.g., Dangay).', 'warning');
      nameInput.focus();
      return;
    }

    const mode = document.getElementById('brgy-rule-mode').value;
    const fee = mode === 'free' ? 0 : Math.max(0, Number(document.getElementById('brgy-rule-fee').value || 0));

    // Replace if same barangay already exists
    const existingIdx = draftBarangayRates.findIndex(
      r => normalizeLocationToken(r.barangay) === normalizeLocationToken(brgyName)
    );
    const entry = { barangay: brgyName, mode: fee <= 0 ? 'free' : 'paid', fee };

    if (existingIdx !== -1) draftBarangayRates[existingIdx] = entry;
    else draftBarangayRates.push(entry);

    nameInput.value = '';
    renderBarangayRulesList();
    showToast(`Added ${brgyName} (${entry.mode === 'free' ? 'Free Shipping' : peso(entry.fee)}). Click Save Shipping Settings to apply.`);
  }

  function removeBarangayShippingRule(index) {
    draftBarangayRates.splice(index, 1);
    renderBarangayRulesList();
  }

  function renderBarangayRulesList() {
    const listEl = document.getElementById('brgy-rules-list');
    const countEl = document.getElementById('brgy-rules-count');
    if (!listEl) return;

    countEl.textContent = draftBarangayRates.length;
    if (draftBarangayRates.length === 0) {
      listEl.innerHTML = `<div style="grid-column:1/-1; font-size:0.82rem; color:var(--muted); padding:0.75rem; background:#f8fbf9; border:1px dashed var(--border); border-radius:8px;">No specific Barangay rates added yet. Add locations like <strong>Dangay</strong> above to offer Free Shipping or custom delivery fees per Barangay.</div>`;
      return;
    }

    listEl.innerHTML = draftBarangayRates.map((r, idx) => {
      const isFree = r.mode === 'free' || Number(r.fee || 0) <= 0;
      return `
        <div class="brgy-rule-card">
          <div>
            <strong style="font-size:0.9rem; color:var(--text); display:block;">📍 ${escapeHtml(r.barangay)}</strong>
            <span class="badge ${isFree ? 'ship-free' : 'ship-paid'}" style="margin-top:0.25rem; display:inline-block;">
              ${isFree ? '🚚 Free Shipping (₱0.00)' : `🚚 Custom Fee: ${peso(r.fee)}`}
            </span>
          </div>
          <button type="button" class="danger-outline sm" onclick="removeBarangayShippingRule(${idx})">✕</button>
        </div>
      `;
    }).join('');
  }

  async function saveShippingSettings(e) {
    e.preventDefault();
    if (!sb || !myShop) return;
    const btn = document.getElementById('btn-save-shipping-settings');
    btn.disabled = true;
    btn.textContent = 'Saving...';

    try {
      const areaMode = document.getElementById('edit-shop-area-mode').value;
      const areaText = areaMode === 'all' ? 'All Areas' : document.getElementById('edit-shop-area-text').value.trim();
      const shipMode = document.getElementById('edit-shop-ship-mode').value;
      const shipFee = shipMode === 'free' ? 0 : Math.max(0, Number(document.getElementById('edit-shop-ship-fee').value || 0));

      const updatePayload = {
        delivery_area_mode: areaMode,
        delivery_area: areaText,
        shipping_mode: shipMode,
        shipping_fee: shipFee,
        barangay_rates: draftBarangayRates
      };

      let { error } = await sb.from('shops').update(updatePayload).eq('id', myShop.id);
      if (error && /column "barangay_rates"/i.test(error.message)) {
        const fallback = { ...updatePayload };
        delete fallback.barangay_rates;
        const retry = await sb.from('shops').update(fallback).eq('id', myShop.id);
        error = retry.error;
      }
      if (error) throw error;

      setLocalShopExtra(myShop.id, { barangay_rates: draftBarangayRates });
      showToast('Barangay & location shipping settings saved!');
      await loadMarketplaceData();
      populateSellerHomeAndShippingFields();
      renderMarketplace();
    } catch (err) {
      showToast(err.message || 'Failed to save shipping settings.', 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Save Shipping Settings';
    }
  }

  /* =========================================================
     10. SHOPPING CART, BARANGAY SHIPPING CHECKOUT & COD/QR
     ========================================================= */
  function saveCart() {
    localStorage.setItem('mh_cart', JSON.stringify(cart));
    updateCartBadge();
  }

  function updateCartBadge() {
    const count = cart.reduce((sum, item) => sum + Number(item.qty || 1), 0);
    const badge = document.getElementById('cart-count');
    if (badge) badge.textContent = count;
  }

  function addToCart(productId, qty = 1) {
    const prod = allProducts.find(p => p.id === productId);
    if (!prod || Number(prod.stock || 0) <= 0) return showToast('Product is out of stock.', 'error');

    const existing = cart.find(c => c.product_id === productId);
    const nextQty = (existing ? existing.qty : 0) + Number(qty || 1);
    if (nextQty > Number(prod.stock)) {
      return showToast(`Only ${prod.stock} pieces available in stock.`, 'warning');
    }

    if (existing) existing.qty = nextQty;
    else cart.push({ product_id: productId, qty: Number(qty || 1) });

    saveCart();
    showToast(`Added "${prod.name}" to your cart!`);
  }

  function startExpressBuyNow(productId, qty = 1) {
    if (!currentUser) {
      openAuthModal('signin');
      showToast('Please sign in first to buy now.', 'warning');
      return;
    }
    expressBuyItem = { product_id: productId, qty: Number(qty || 1) };
    openCartModal(true);
  }

  function handleHeaderCartClick() {
    if (!currentUser) {
      openAuthModal('signin');
      return;
    }
    expressBuyItem = null;
    openCartModal(false);
  }

  function openCartModal(isExpress = false) {
    document.getElementById('cart-modal').classList.remove('hidden');
    document.getElementById('express-buy-badge').classList.toggle('hidden', !isExpress);
    document.getElementById('cart-modal-title').textContent = isExpress ? '⚡ Express Checkout' : '🛒 Shopping Cart';

    // Auto-fill buyer profile info
    document.getElementById('checkout-name').value = currentProfile?.full_name || '';
    document.getElementById('checkout-phone').value = currentProfile?.phone || '';
    document.getElementById('checkout-address').value = currentProfile?.address || '';
    checkoutEditOpen = !(currentProfile?.full_name && currentProfile?.phone && currentProfile?.address);
    document.getElementById('checkout-edit-fields').classList.toggle('hidden', !checkoutEditOpen);
    document.getElementById('checkout-autofill-card').classList.toggle('hidden', checkoutEditOpen);

    syncCheckoutPreview();
    renderCartModal();
  }

  function closeCart() {
    expressBuyItem = null;
    document.getElementById('cart-modal').classList.add('hidden');
  }

  function toggleCheckoutEdit() {
    checkoutEditOpen = !checkoutEditOpen;
    document.getElementById('checkout-edit-fields').classList.toggle('hidden', !checkoutEditOpen);
    document.getElementById('checkout-autofill-card').classList.toggle('hidden', checkoutEditOpen);
    document.getElementById('btn-toggle-checkout-edit').textContent = checkoutEditOpen ? 'Done' : 'Edit Details';
  }

  function syncCheckoutPreview() {
    const name = document.getElementById('checkout-name').value.trim();
    const phone = document.getElementById('checkout-phone').value.trim();
    const addr = document.getElementById('checkout-address').value.trim();

    document.getElementById('display-checkout-name').textContent = name || '—';
    document.getElementById('display-checkout-phone').textContent = phone || '—';
    document.getElementById('display-checkout-address').textContent = addr || '—';

    const missing = !name || !phone || !addr;
    document.getElementById('checkout-missing-alert').classList.toggle('hidden', !missing);
  }

  function selectCheckoutPaymentMethod(method) {
    checkoutPaymentMethod = method;
    document.getElementById('pay-choice-cod').classList.toggle('active', method === 'COD');
    document.getElementById('pay-choice-qr').classList.toggle('active', method === 'QR');
    document.getElementById('checkout-qr-panel').classList.toggle('hidden', method !== 'QR');
  }

  function updateCartQty(productId, delta) {
    const idx = cart.findIndex(c => c.product_id === productId);
    if (idx === -1) return;
    const prod = allProducts.find(p => p.id === productId);
    const next = cart[idx].qty + delta;
    if (next <= 0) cart.splice(idx, 1);
    else if (prod && next <= Number(prod.stock || 99)) cart[idx].qty = next;
    saveCart();
    renderCartModal();
  }

  function removeFromCart(productId) {
    cart = cart.filter(c => c.product_id !== productId);
    saveCart();
    renderCartModal();
  }

  function renderCartModal() {
    const activeItems = expressBuyItem ? [expressBuyItem] : cart;
    const container = document.getElementById('cart-items-container');
    const checkoutSec = document.getElementById('checkout-section');

    if (activeItems.length === 0) {
      container.innerHTML = `<div class="empty-state">Your shopping cart is empty.</div>`;
      checkoutSec.classList.add('hidden');
      return;
    }

    checkoutSec.classList.remove('hidden');
    const buyerAddr = document.getElementById('checkout-address')?.value || currentProfile?.address || '';

    // Group items by Shop to calculate Barangay Shipping per Shop
    const shopGroups = new Map();
    activeItems.forEach(ci => {
      const prod = allProducts.find(p => p.id === ci.product_id);
      if (!prod) return;
      if (!shopGroups.has(prod.shop_id)) shopGroups.set(prod.shop_id, []);
      shopGroups.get(prod.shop_id).push({ ...ci, prod });
    });

    let grandItemsTotal = 0;
    let grandShippingTotal = 0;
    const qrShops = [];

    let html = '';
    shopGroups.forEach((entries, shopId) => {
      const shop = enrichShopData(allShops.find(s => s.id === shopId) || { id: shopId, name: 'Shop' });
      const shipCalc = computeShopShippingForAddress(shop, buyerAddr);
      if (shop.qr_image_url) qrShops.push(shop);

      let shopSubtotal = 0;
      const rowsHtml = entries.map(({ prod, qty }) => {
        const line = Number(prod.price || 0) * Number(qty || 1);
        shopSubtotal += line;
        return `
          <div class="row-between" style="padding:0.45rem 0; border-bottom:1px solid #f1f5f9;">
            <div style="flex:1; min-width:0;">
              <strong style="font-size:0.84rem; display:block;">${escapeHtml(prod.name)}</strong>
              <span style="font-size:0.76rem; color:var(--muted);">${peso(prod.price)} × ${qty}</span>
            </div>
            <div style="display:flex; align-items:center; gap:0.4rem;">
              ${expressBuyItem ? '' : `
                <button type="button" class="secondary sm" onclick="updateCartQty('${prod.id}', -1)">−</button>
                <span style="font-size:0.82rem; font-weight:700;">${qty}</span>
                <button type="button" class="secondary sm" onclick="updateCartQty('${prod.id}', 1)">+</button>
              `}
              <strong style="font-size:0.85rem; min-width:68px; text-align:right;">${peso(line)}</strong>
            </div>
          </div>
        `;
      }).join('');

      grandItemsTotal += shopSubtotal;
      grandShippingTotal += shipCalc.fee;

      html += `
        <div style="border:1px solid var(--border); border-radius:8px; padding:0.75rem; margin-bottom:0.75rem; background:#fff;">
          <div class="row-between" style="margin-bottom:0.35rem;">
            <strong style="font-size:0.86rem; color:var(--primary-deep);">🏪 ${escapeHtml(shop.name)}</strong>
            <span class="badge ${shipCalc.isFree ? 'ship-free' : 'ship-paid'}">🚚 ${escapeHtml(shipCalc.label)}</span>
          </div>
          ${!shipCalc.allowed ? `<div class="error-box" style="padding:0.45rem 0.65rem; font-size:0.76rem; margin-bottom:0.4rem;">⚠️ Delivery outside shop area (${escapeHtml(shop.delivery_area || 'Roxas Only')}).</div>` : ''}
          ${rowsHtml}
        </div>
      `;
    });

    html += `
      <div style="background:var(--primary-soft); border:1px solid #86efac; border-radius:8px; padding:0.75rem 0.9rem; font-size:0.85rem;">
        <div class="row-between"><span>Items Subtotal:</span><strong>${peso(grandItemsTotal)}</strong></div>
        <div class="row-between" style="margin-top:0.25rem;"><span>Shipping Fee (Barangay Rate):</span><strong>${grandShippingTotal === 0 ? 'FREE (₱0.00)' : peso(grandShippingTotal)}</strong></div>
        <div class="row-between" style="margin-top:0.45rem; padding-top:0.45rem; border-top:1px dashed #86efac; font-size:1rem; color:var(--primary-dark);">
          <strong>Total Payable:</strong><strong>${peso(grandItemsTotal + grandShippingTotal)}</strong>
        </div>
      </div>
    `;

    container.innerHTML = html;

    // Render Seller QR Codes if available
    const qrListEl = document.getElementById('checkout-qr-list');
    if (qrShops.length === 0) {
      qrListEl.innerHTML = `<div style="font-size:0.8rem; color:#92400e;">This shop accepts Cash on Delivery (COD) only. Please select COD above.</div>`;
    } else {
      qrListEl.innerHTML = qrShops.map(sh => `
        <div class="qr-preview-box" style="margin-bottom:0.5rem;">
          <img src="${escapeHtml(sh.qr_image_url)}" alt="${escapeHtml(sh.name)} QR" onclick="window.open('${escapeHtml(sh.qr_image_url)}', '_blank')" />
          <div style="font-size:0.8rem;">
            <strong style="color:var(--primary-deep);">${escapeHtml(sh.name)} — Scan to Pay</strong>
            <div style="color:var(--text-secondary); margin-top:0.2rem;">${escapeHtml(sh.qr_description || 'Scan QR code using GCash / Maya / E-Wallet')}</div>
          </div>
        </div>
      `).join('');
    }
  }

  async function checkout() {
    if (!sb || !currentUser) return showToast('Please sign in first.', 'warning');

    const name = document.getElementById('checkout-name').value.trim();
    const phone = document.getElementById('checkout-phone').value.trim();
    const address = document.getElementById('checkout-address').value.trim();
    if (!name || !phone || !address) {
      checkoutEditOpen = true;
      document.getElementById('checkout-edit-fields').classList.remove('hidden');
      document.getElementById('checkout-autofill-card').classList.add('hidden');
      return showToast('Please complete your name, phone, and Barangay address.', 'error');
    }

    if (!document.getElementById('checkout-policy-agree').checked) {
      return showToast('Please agree to the order policy before placing your order.', 'warning');
    }

    const qrRef = document.getElementById('checkout-qr-ref').value.trim();
    if (checkoutPaymentMethod === 'QR' && !qrRef) {
      return showToast('Please enter your E-Wallet payment reference number.', 'warning');
    }

    const activeItems = expressBuyItem ? [expressBuyItem] : cart;
    if (activeItems.length === 0) return;

    const btn = document.getElementById('btn-place-order');
    btn.disabled = true;
    btn.textContent = 'Placing Order...';

    try {
      // Group by shop_id
      const byShop = new Map();
      activeItems.forEach(ci => {
        const prod = enrichProductData(allProducts.find(p => p.id === ci.product_id));
        if (!prod) return;
        if (!byShop.has(prod.shop_id)) byShop.set(prod.shop_id, []);
        byShop.get(prod.shop_id).push({ prod, qty: Number(ci.qty || 1) });
      });

      for (const [shopId, entries] of byShop.entries()) {
        const shop = enrichShopData(allShops.find(s => s.id === shopId) || {});
        const shipCalc = computeShopShippingForAddress(shop, address);
        if (!shipCalc.allowed) {
          throw new Error(`Shop "${shop.name}" does not deliver to your address (${shop.delivery_area || 'Roxas Only'}).`);
        }

        let itemsSubtotal = 0;
        const orderItems = entries.map(({ prod, qty }) => {
          itemsSubtotal += Number(prod.price || 0) * qty;
          return {
            product_id: prod.id,
            name: prod.name,
            price: Number(prod.price || 0),
            cost_price: Number(prod.cost_price || 0),
            qty,
            image: (Array.isArray(prod.images) && prod.images[0]) || prod.image_url || ''
          };
        });

        const totalAmount = itemsSubtotal + shipCalc.fee;
        const payLabel = checkoutPaymentMethod === 'QR' ? `QR (${qrRef})` : 'COD';

        const { error } = await sb.from('orders').insert({
          buyer_id: currentUser.id,
          shop_id: shopId,
          buyer_name: name,
          buyer_phone: phone,
          delivery_address: address,
          items: orderItems,
          shipping_fee: shipCalc.fee,
          total_amount: totalAmount,
          payment_method: payLabel,
          status: 'pending'
        });
        if (error) throw error;

        // Deduct stock & increment sold_count
        for (const { prod, qty } of entries) {
          await sb.from('products').update({
            stock: Math.max(0, Number(prod.stock || 0) - qty),
            sold_count: Number(prod.sold_count || 0) + qty
          }).eq('id', prod.id);
        }

        // Notify Seller
        if (shop.owner_id) {
          await sb.from('notifications').insert({
            user_id: shop.owner_id,
            title: '🛍️ New Order Received!',
            message: `${name} ordered ${entries.length} item(s) worth ${peso(totalAmount)} (${payLabel}).`,
            is_read: false
          });
        }
      }

      if (!expressBuyItem) {
        cart = [];
        saveCart();
      }
      expressBuyItem = null;
      closeCart();
      showToast('Order placed successfully!');
      await Promise.all([loadMarketplaceData(), loadOrders()]);
      switchOrdersSubTab('purchases');
      switchView('orders');
    } catch (err) {
      showToast(err.message || 'Checkout failed.', 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Place Order Now';
    }
  }

  /* =========================================================
     11. ORDERS, TRACKING, RECEIPT PRINTING & ADMIN PANEL
     ========================================================= */
  async function loadOrders() {
    if (!sb || !currentUser) return;
    const { data } = await sb.from('orders').select('*').order('created_at', { ascending: false });
    allOrders = data || [];

    const myShopSales = myShop ? allOrders.filter(o => o.shop_id === myShop.id) : [];
    document.getElementById('tab-sales-badge').textContent = myShopSales.length;
    renderOrdersList();
  }

  function switchOrdersSubTab(tab) {
    activeOrdersSubTab = tab;
    document.getElementById('orders-tab-purchases').classList.toggle('active', tab === 'purchases');
    document.getElementById('orders-tab-sales').classList.toggle('active', tab === 'sales');
    renderOrdersList();
  }

  function renderOrdersList() {
    const container = document.getElementById('orders-list');
    if (!container || !currentUser) return;

    const list = activeOrdersSubTab === 'sales'
      ? (myShop ? allOrders.filter(o => o.shop_id === myShop.id) : [])
      : allOrders.filter(o => o.buyer_id === currentUser.id);

    if (list.length === 0) {
      container.innerHTML = `<div class="empty-state">No ${activeOrdersSubTab === 'sales' ? 'shop sales' : 'purchases'} found yet.</div>`;
      return;
    }

    const steps = ['pending', 'confirmed', 'shipped', 'delivered'];

    container.innerHTML = list.map(o => {
      const shop = allShops.find(s => s.id === o.shop_id) || { name: 'Shop' };
      const items = Array.isArray(o.items) ? o.items : [];
      const isCancelled = o.status === 'cancelled';
      const stepIdx = steps.indexOf(o.status);

      const stepperHtml = isCancelled
        ? `<div class="cancelled-banner">✕ Order Cancelled</div>`
        : `<div class="order-stepper">
            ${steps.map((st, idx) => `
              <div class="step-item ${idx < stepIdx ? 'done' : (idx === stepIdx ? 'current' : '')}">
                <div class="step-dot">${idx <= stepIdx ? '✓' : idx + 1}</div>
                <div style="text-transform:capitalize;">${st}</div>
              </div>
            `).join('')}
          </div>`;

      const sellerControls = activeOrdersSubTab === 'sales' && !isCancelled && o.status !== 'delivered'
        ? `<div style="display:flex; gap:0.45rem; flex-wrap:wrap; margin-top:0.65rem;">
            ${o.status === 'pending' ? `<button type="button" class="shop-cta sm" onclick="updateOrderStatus('${o.id}', 'confirmed')">✓ Confirm Order</button>` : ''}
            ${o.status === 'confirmed' ? `<button type="button" class="shop-cta sm" onclick="updateOrderStatus('${o.id}', 'shipped')">🚚 Mark as Shipped</button>` : ''}
            ${o.status === 'shipped' ? `<button type="button" class="success-btn sm" onclick="updateOrderStatus('${o.id}', 'delivered')">📦 Mark Delivered</button>` : ''}
          </div>`
        : '';

      const buyerCancelBtn = activeOrdersSubTab === 'purchases' && o.status === 'pending'
        ? `<button type="button" class="danger-outline sm" onclick="cancelOrderByBuyer('${o.id}')">Cancel Order</button>`
        : '';

      return `
        <div class="panel">
          <div class="row-between">
            <div>
              <strong style="font-size:0.95rem; color:var(--primary-deep);">🏪 ${escapeHtml(shop.name)}</strong>
              <span class="badge status-${escapeHtml(o.status)}" style="margin-left:0.4rem;">${escapeHtml(o.status)}</span>
              <div style="font-size:0.75rem; color:var(--muted); margin-top:0.2rem;">
                Order #${escapeHtml(String(o.id).slice(0, 8))} • ${new Date(o.created_at || Date.now()).toLocaleString()} • Payment: <strong>${escapeHtml(o.payment_method || 'COD')}</strong>
              </div>
            </div>
            <div style="display:flex; gap:0.4rem; flex-wrap:wrap;">
              <button type="button" class="secondary sm" onclick="openReceiptModal('${o.id}')">🖨️ Receipt</button>
              <button type="button" class="secondary sm" onclick="openChatModal('${shop.id}', '${escapeHtml(shop.name)}', '${o.id}')">💬 Chat</button>
              ${buyerCancelBtn}
            </div>
          </div>

          ${stepperHtml}

          <div style="font-size:0.83rem; color:var(--text-secondary); margin:0.5rem 0;">
            <strong>Recipient:</strong> ${escapeHtml(o.buyer_name)} (${escapeHtml(o.buyer_phone)})<br/>
            <strong>Delivery Address:</strong> ${escapeHtml(o.delivery_address)}
          </div>

          <div style="border-top:1px solid var(--border); padding-top:0.55rem; margin-top:0.55rem;">
            ${items.map(it => `
              <div class="row-between" style="font-size:0.83rem; padding:0.2rem 0;">
                <span>${escapeHtml(it.name)} × <strong>${it.qty}</strong></span>
                <span>${peso(Number(it.price || 0) * Number(it.qty || 1))}</span>
              </div>
            `).join('')}
            <div class="row-between" style="font-size:0.82rem; color:var(--muted); margin-top:0.35rem;">
              <span>Shipping Fee:</span>
              <span>${Number(o.shipping_fee || 0) === 0 ? 'FREE' : peso(o.shipping_fee)}</span>
            </div>
            <div class="row-between" style="font-size:0.95rem; font-weight:800; color:var(--primary-dark); margin-top:0.3rem;">
              <span>Total Amount:</span>
              <span>${peso(o.total_amount)}</span>
            </div>
          </div>
          ${sellerControls}
        </div>
      `;
    }).join('');
  }

  async function updateOrderStatus(orderId, nextStatus) {
    if (!sb) return;
    const { error } = await sb.from('orders').update({ status: nextStatus }).eq('id', orderId);
    if (error) return showToast(error.message, 'error');
    showToast(`Order marked as ${nextStatus.toUpperCase()}!`);
    await loadOrders();
    if (myShop) renderSellerIncomeMonitoring();
  }

  async function cancelOrderByBuyer(orderId) {
    if (!sb || !confirm('Cancel this pending order?')) return;
    const order = allOrders.find(o => o.id === orderId);
    if (!order || order.status !== 'pending') {
      return showToast('Only pending orders can be cancelled.', 'error');
    }
    const { error } = await sb.from('orders').update({ status: 'cancelled' }).eq('id', orderId);
    if (error) return showToast(error.message, 'error');

    // Restore stock
    for (const it of (order.items || [])) {
      const prod = allProducts.find(p => p.id === it.product_id);
      if (prod) {
        await sb.from('products').update({
          stock: Number(prod.stock || 0) + Number(it.qty || 1),
          sold_count: Math.max(0, Number(prod.sold_count || 0) - Number(it.qty || 1))
        }).eq('id', prod.id);
      }
    }
    showToast('Order cancelled.');
    await Promise.all([loadMarketplaceData(), loadOrders()]);
  }

      <div class="receipt-total-box">
        <div class="row-between"><span>Payment Method:</span><strong>${escapeHtml(o.payment_method || 'COD')}</strong></div>
        <div class="row-between"><span>Shipping Fee:</span><strong>${Number(o.shipping_fee || 0) === 0 ? 'FREE' : peso(o.shipping_fee)}</strong></div>
        <div class="row-between" style="font-size:1.05rem; margin-top:0.35rem; padding-top:0.35rem; border-top:1px solid #0f172a;">
          <strong>TOTAL COLLECTIBLE:</strong><strong>${peso(o.total_amount)}</strong>
        </div>
      </div>
    `;
    document.getElementById('receipt-modal').classList.remove('hidden');
  }

  function closeReceiptModal() {
    document.getElementById('receipt-modal').classList.add('hidden');
  }

  /* =========================================================
     12. PLATFORM ADMIN PANEL
     ========================================================= */
  function onAdminMonthChange() {
    adminSelectedMonth = document.getElementById('admin-commission-month').value;
    adminShowAllMonths = false;
    document.getElementById('btn-admin-all-months').classList.remove('active');
    renderAdminPanel();
  }

  function toggleAdminAllMonths() {
    adminShowAllMonths = !adminShowAllMonths;
    document.getElementById('btn-admin-all-months').classList.toggle('active', adminShowAllMonths);
    renderAdminPanel();
  }

  async function reviewShopApplication(shopId, status) {
    if (!sb) return;
    let adminNote = null;
    if (status === 'rejected') {
      adminNote = prompt('Enter reason for rejection / revision note:') || 'Please upload clearer verification proof.';
    }
    const { error } = await sb.from('shops').update({ status, admin_note: adminNote }).eq('id', shopId);
    if (error) return showToast(error.message, 'error');
    showToast(`Shop ${status.toUpperCase()}!`);
    await loadMarketplaceData();
    renderAdminPanel();
    renderMarketplace();
  }

  async function toggleCommissionSettled(shopId, monthStr, currentlySettled) {
    if (!sb) return;
    await sb.from('commission_settlements').upsert({
      shop_id: shopId,
      month: monthStr,
      settled: !currentlySettled
    }, { onConflict: 'shop_id,month' });
    await loadMarketplaceData();
    renderAdminPanel();
  }

  async function adminDeleteProduct(prodId) {
    if (!sb || !confirm('Remove this product from MarketHub?')) return;
    await sb.from('products').delete().eq('id', prodId);
    showToast('Product removed.');
    await loadMarketplaceData();
    renderAdminPanel();
    renderMarketplace();
  }

  function renderAdminPanel() {
    const monthInput = document.getElementById('admin-commission-month');
    if (!monthInput.value) monthInput.value = adminSelectedMonth;

    const pendingCount = allShops.filter(s => s.status === 'pending').length;
    document.getElementById('admin-pending-shops-badge').textContent = `${pendingCount} Pending Review`;

    document.getElementById('admin-shops-tbody').innerHTML = allShops.map(s => `
      <tr>
        <td><strong>${escapeHtml(s.name)}</strong><br/><small>${escapeHtml(s.description || '')}</small></td>
        <td>${escapeHtml(s.phone || '')}<br/><small>${escapeHtml(s.pickup_address || '')}</small></td>
        <td>${escapeHtml(formatShopShippingBadgeText(s))}<br/><small>${escapeHtml(s.delivery_area || '')}</small></td>
        <td>${s.id_proof_url ? `<a href="${escapeHtml(s.id_proof_url)}" target="_blank">View Proof ↗</a>` : '—'}</td>
        <td><span class="badge status-${escapeHtml(s.status)}">${escapeHtml(s.status)}</span></td>
        <td style="white-space:nowrap;">
          ${s.status !== 'approved' ? `<button type="button" class="success-btn sm" onclick="reviewShopApplication('${s.id}', 'approved')">Approve</button>` : ''}
          ${s.status !== 'rejected' ? `<button type="button" class="danger-outline sm" onclick="reviewShopApplication('${s.id}', 'rejected')">Reject</button>` : ''}
        </td>
      </tr>
    `).join('');

    // Commission Table
    const validOrders = allOrders.filter(o => o.status !== 'cancelled' && (adminShowAllMonths || String(o.created_at || '').slice(0, 7) === adminSelectedMonth));
    let totalProdSales = 0;
    let totalComm = 0;
    let totalUncollected = 0;
    let totalCollected = 0;
    let totalSellerNet = 0;

    const approvedShops = allShops.filter(s => s.status === 'approved');
    document.getElementById('admin-commission-tbody').innerHTML = approvedShops.map(s => {
      const orders = validOrders.filter(o => o.shop_id === s.id);
      const shipSum = orders.reduce((acc, o) => acc + Number(o.shipping_fee || 0), 0);
      const prodSum = orders.reduce((acc, o) => acc + Math.max(0, Number(o.total_amount || 0) - Number(o.shipping_fee || 0)), 0);
      const comm = prodSum * COMMISSION_RATE;
      const sellerNet = prodSum - comm + shipSum;
      const settled = commissionSettlements.some(cs => cs.shop_id === s.id && cs.month === adminSelectedMonth && cs.settled);

      totalProdSales += prodSum;
      totalComm += comm;
      totalSellerNet += sellerNet;
      if (settled) totalCollected += comm;
      else totalUncollected += comm;

      return `
        <tr>
          <td><strong>${escapeHtml(s.name)}</strong></td>
          <td>${orders.length}</td>
          <td>${peso(prodSum)}</td>
          <td>${peso(shipSum)}</td>
          <td><strong>${peso(comm)}</strong></td>
          <td>${peso(sellerNet)}</td>
          <td><span class="badge ${settled ? 'status-approved' : 'status-pending'}">${settled ? 'Collected' : 'Uncollected'}</span></td>
          <td>
            ${!adminShowAllMonths ? `<button type="button" class="secondary sm" onclick="toggleCommissionSettled('${s.id}', '${adminSelectedMonth}', ${settled})">${settled ? 'Mark Unpaid' : 'Mark Paid'}</button>` : '—'}
          </td>
        </tr>
      `;
    }).join('');

    document.getElementById('kpi-gross-sales').textContent = peso(totalProdSales);
    document.getElementById('kpi-orders-count').textContent = `${validOrders.length} valid shop orders`;
    document.getElementById('kpi-total-commission').textContent = peso(totalComm);
    document.getElementById('kpi-uncollected').textContent = peso(totalUncollected);
    document.getElementById('kpi-collected').textContent = peso(totalCollected);
    document.getElementById('kpi-seller-net').textContent = peso(totalSellerNet);

    // Products moderation
    const shopMap = new Map(allShops.map(s => [s.id, s.name]));
    document.getElementById('admin-products-tbody').innerHTML = allProducts.map(p => `
      <tr>
        <td>${escapeHtml(shopMap.get(p.shop_id) || 'Shop')}</td>
        <td><strong>${escapeHtml(p.name)}</strong></td>
        <td>${escapeHtml(p.category || '')}</td>
        <td>${peso(p.price)}</td>
        <td>${p.stock}</td>
        <td>${p.sold_count || 0}</td>
        <td><button type="button" class="danger-outline sm" onclick="adminDeleteProduct('${p.id}')">Remove</button></td>
      </tr>
    `).join('');
  }

  /* =========================================================
     13. NOTIFICATIONS & LIVE CHAT
     ========================================================= */
  async function loadNotifications() {
    if (!sb || !currentUser) return;
    const { data } = await sb.from('notifications').select('*').eq('user_id', currentUser.id).order('created_at', { ascending: false }).limit(25);
    allNotifications = data || [];
    const unread = allNotifications.filter(n => !n.is_read).length;
    const badge = document.getElementById('notif-badge');
    badge.textContent = unread;
    badge.classList.toggle('hidden', unread === 0);

    const listEl = document.getElementById('notif-list');
    if (allNotifications.length === 0) {
      listEl.innerHTML = `<div style="padding:1rem; text-align:center; font-size:0.8rem; color:var(--muted);">No notifications yet.</div>`;
      return;
    }
    listEl.innerHTML = allNotifications.map(n => `
      <div class="notif-item ${n.is_read ? '' : 'unread'}">
        <div class="notif-item-top">
          <span class="notif-title">${escapeHtml(n.title)}</span>
          <span class="notif-time">${new Date(n.created_at || Date.now()).toLocaleDateString()}</span>
        </div>
        <div class="notif-desc">${escapeHtml(n.message)}</div>
      </div>
    `).join('');
  }

  function toggleNotifDropdown(e) {
    e.stopPropagation();
    document.getElementById('notif-dropdown').classList.toggle('hidden');
  }

  async function markAllNotificationsRead() {
    if (!sb || !currentUser) return;
    await sb.from('notifications').update({ is_read: true }).eq('user_id', currentUser.id);
    await loadNotifications();
  }

  async function clearAllNotifications() {
    if (!sb || !currentUser) return;
    await sb.from('notifications').delete().eq('user_id', currentUser.id);
    await loadNotifications();
  }

  async function openChatModal(shopId = null, shopName = null, orderId = null) {
    if (!currentUser) return openAuthModal('signin');
    document.getElementById('chat-modal').classList.remove('hidden');
    if (shopId) {
      const sh = allShops.find(s => s.id === shopId);
      activeChatShopId = shopId;
      activeChatPartnerId = sh?.owner_id || null;
      activeChatOrderId = orderId;
      document.getElementById('chat-active-banner').textContent = `Chatting with ${shopName || sh?.name || 'Seller'}`;
    }
    await loadChatMessages(true);
  }

  function closeChatModal() {
    document.getElementById('chat-modal').classList.add('hidden');
  }

  async function loadChatMessages(renderUi = true) {
    if (!sb || !currentUser) return;
    const { data } = await sb.from('messages')
      .select('*')
      .or(`sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`)
      .order('created_at', { ascending: true });
    allMessages = data || [];

    if (!renderUi) return;

    // Build threads
    const threadMap = new Map();
    if (activeChatPartnerId && activeChatPartnerId !== currentUser.id) {
      const sh = allShops.find(s => s.id === activeChatShopId);
      threadMap.set(activeChatPartnerId, { partnerId: activeChatPartnerId, title: sh?.name || 'Store Chat' });
    }
    allMessages.forEach(m => {
      const otherId = m.sender_id === currentUser.id ? m.receiver_id : m.sender_id;
      if (!threadMap.has(otherId)) {
        const sh = allShops.find(s => s.owner_id === otherId);
        threadMap.set(otherId, { partnerId: otherId, title: sh?.name || m.sender_name || 'Customer' });
      }
    });

    const threadsEl = document.getElementById('chat-threads-list');
    const threads = Array.from(threadMap.values());
    if (!activeChatPartnerId && threads.length > 0) {
      activeChatPartnerId = threads[0].partnerId;
      document.getElementById('chat-active-banner').textContent = `Conversation: ${threads[0].title}`;
    }

    threadsEl.innerHTML = threads.length
      ? threads.map(t => `
          <div class="chat-thread-item ${t.partnerId === activeChatPartnerId ? 'active' : ''}" onclick="activeChatPartnerId='${t.partnerId}'; document.getElementById('chat-active-banner').textContent='Conversation: ${escapeHtml(t.title)}'; loadChatMessages(true);">
            <strong style="font-size:0.82rem; display:block;">${escapeHtml(t.title)}</strong>
            <small style="font-size:0.7rem; color:var(--muted);">Tap to view messages</small>
          </div>
        `).join('')
      : `<div style="padding:0.85rem; font-size:0.78rem; color:var(--muted);">No conversations yet.</div>`;

    const feed = document.getElementById('chat-messages-feed');
    const msgs = allMessages.filter(m => m.sender_id === activeChatPartnerId || m.receiver_id === activeChatPartnerId);
    feed.innerHTML = msgs.length
      ? msgs.map(m => {
          const mine = m.sender_id === currentUser.id;
          return `
            <div class="chat-bubble ${mine ? 'mine' : 'theirs'}">
              <div>${escapeHtml(m.content)}</div>
              <span class="chat-bubble-meta">${new Date(m.created_at || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
            </div>
          `;
        }).join('')
      : `<div style="text-align:center; color:var(--muted); font-size:0.8rem; margin-top:2rem;">Send a message to start chatting!</div>`;
    feed.scrollTop = feed.scrollHeight;
  }

  async function sendChatMessage(e) {
    e.preventDefault();
    if (!sb || !currentUser || !activeChatPartnerId) return;
    const input = document.getElementById('chat-message-input');
    const content = input.value.trim();
    if (!content) return;

    input.value = '';
    const { error } = await sb.from('messages').insert({
      sender_id: currentUser.id,
      receiver_id: activeChatPartnerId,
      sender_name: currentProfile?.full_name || currentUser.email.split('@')[0],
      shop_id: activeChatShopId,
      order_id: activeChatOrderId,
      content
    });
    if (error) showToast(error.message, 'error');
    else await loadChatMessages(true);
  }

  /* =========================================================
     14. PWA INSTALL & INITIALIZATION
     ========================================================= */
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
    document.getElementById('btn-install-pwa').classList.remove('hidden');
  });

  async function promptInstallPwa() {
    if (deferredInstallPrompt) {
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
    } else {
      document.getElementById('ios-install-modal').classList.remove('hidden');
    }
  }

  function closeIosInstallModal() {
    document.getElementById('ios-install-modal').classList.add('hidden');
  }

  document.addEventListener('click', () => {
    const dd = document.getElementById('notif-dropdown');
    if (dd) dd.classList.add('hidden');
  });

  if (sb) {
    sb.auth.onAuthStateChange((event) => {
      if (event === 'PASSWORD_RECOVERY') {
        document.getElementById('recovery-modal').classList.remove('hidden');
      }
    });
  }

  window.addEventListener('DOMContentLoaded', () => {
    bootstrapSession();
  });
</script>
</body>
</html>
